<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Demo 4 - 居中浮层沉浸式</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            min-height: 100vh; color: #e0e0e0;
        }
        .page-hint {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0.3; font-size: 14px;
        }

        /* Dock Trigger */
        .chatbot-dock-btn {
            position: fixed; bottom: 24px; right: 24px; z-index: 1000;
            width: 56px; height: 56px; border-radius: 16px;
            background: rgba(20, 10, 40, 0.9); border: 1px solid rgba(139, 92, 246, 0.3);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 24px rgba(139, 92, 246, 0.2), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.3s;
        }
        .chatbot-dock-btn:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 4px 32px rgba(139, 92, 246, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .chatbot-dock-btn i { color: #a78bfa; font-size: 22px; }

        /* Overlay */
        .chatbot-overlay {
            position: fixed; inset: 0; z-index: 900;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .chatbot-overlay.open { opacity: 1; pointer-events: all; }

        /* Main Panel (Centered Overlay) */
        .chatbot-center-panel {
            position: fixed; z-index: 901;
            top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
            width: min(860px, 92vw); height: 80vh;
            border-radius: 20px;
            background: rgba(14, 10, 28, 0.96);
            backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 1px rgba(139, 92, 246, 0.3);
            display: flex; overflow: hidden;
            opacity: 0; pointer-events: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chatbot-center-panel.open {
            opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: all;
        }

        /* Left Sidebar - Agent List */
        .panel-sidebar {
            width: 220px; border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; background: rgba(0,0,0,0.2);
        }
        .sidebar-header {
            padding: 20px 16px 12px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; color: #6b7280;
        }
        .sidebar-agents { flex: 1; overflow-y: auto; padding: 0 8px; }
        .sidebar-agents::-webkit-scrollbar { width: 3px; }
        .sidebar-agents::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); }

        .sidebar-agent {
            padding: 12px 14px; border-radius: 10px; margin-bottom: 4px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: all 0.2s; position: relative;
        }
        .sidebar-agent:hover { background: rgba(255,255,255,0.04); }
        .sidebar-agent.active { background: rgba(139, 92, 246, 0.12); }
        .sidebar-agent.active::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 20px; border-radius: 0 3px 3px 0;
            background: #8b5cf6;
        }
        .sidebar-agent-icon {
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff; flex-shrink: 0;
        }
        .sidebar-agent-info { flex: 1; min-width: 0; }
        .sidebar-agent-name { font-size: 13px; font-weight: 500; color: #e5e7eb; }
        .sidebar-agent-desc { font-size: 10px; color: #6b7280; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Add Agent Button */
        .sidebar-add {
            margin: 8px; padding: 10px; border-radius: 10px;
            border: 1px dashed rgba(255,255,255,0.1); text-align: center;
            font-size: 11px; color: #6b7280; cursor: pointer; transition: all 0.2s;
        }
        .sidebar-add:hover { border-color: rgba(139,92,246,0.4); color: #a78bfa; }

        /* Right Chat Area */
        .panel-chat {
            flex: 1; display: flex; flex-direction: column;
        }

        /* Chat Header */
        .chat-header {
            padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .chat-header-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
        }
        .chat-header-name { font-size: 15px; font-weight: 600; }
        .chat-header-tag {
            font-size: 10px; padding: 2px 8px; border-radius: 4px;
            background: rgba(139,92,246,0.15); color: #a78bfa;
        }
        .chat-header-actions { display: flex; gap: 8px; }
        .chat-header-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.04); color: #6b7280; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .chat-header-btn:hover { background: rgba(255,255,255,0.08); color: #e5e7eb; }

        /* Messages */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }

        .chat-m { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
        .chat-m-user { flex-direction: row-reverse; }
        .chat-m-avatar {
            width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff;
        }
        .chat-m-bot .chat-m-avatar { background: linear-gradient(135deg, #7c3aed, #6366f1); }
        .chat-m-user .chat-m-avatar { background: rgba(255,255,255,0.06); color: #9ca3af; }
        .chat-m-body { max-width: 70%; }
        .chat-m-bubble {
            padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.7;
        }
        .chat-m-bot .chat-m-bubble {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            border-top-left-radius: 4px;
        }
        .chat-m-user .chat-m-bubble {
            background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff;
            border-top-right-radius: 4px;
        }
        .chat-m-meta { font-size: 10px; color: #4b5563; margin-top: 6px; padding: 0 4px; }
        .chat-m-user .chat-m-meta { text-align: right; }

        /* Suggestions */
        .chat-suggestions {
            display: flex; gap: 8px; flex-wrap: wrap; padding: 0 24px 12px;
        }
        .chat-suggestion {
            padding: 8px 14px; border-radius: 20px; font-size: 12px;
            background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2);
            color: #c4b5fd; cursor: pointer; transition: all 0.2s;
        }
        .chat-suggestion:hover { background: rgba(139,92,246,0.2); border-color: rgba(139,92,246,0.4); }

        /* Input */
        .chat-input-section {
            padding: 16px 24px 20px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .chat-input-box {
            display: flex; align-items: flex-end; gap: 10px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 12px 12px 12px 18px;
            transition: border-color 0.2s;
        }
        .chat-input-box:focus-within { border-color: rgba(139,92,246,0.4); }
        .chat-input-box textarea {
            flex: 1; background: transparent; border: none; color: #e5e7eb;
            font-size: 14px; outline: none; resize: none; min-height: 20px; max-height: 120px;
            font-family: inherit; line-height: 1.5;
        }
        .chat-input-box textarea::placeholder { color: #4b5563; }
        .chat-submit {
            width: 38px; height: 38px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .chat-submit:hover { transform: scale(1.05); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .panel-sidebar { display: none; }
            .chatbot-center-panel { width: 95vw; height: 90vh; }
        }
    </style>
</head>
<body>
    <div class="page-hint">
        <h2>Demo 4 - 居中浮层沉浸式</h2>
        <p>点击右下角按钮打开全面板对话</p>
    </div>

    <button class="chatbot-dock-btn" id="dock-btn"><i class="fas fa-brain"></i></button>

    <div class="chatbot-overlay" id="overlay"></div>
    <div class="chatbot-center-panel" id="center-panel">
        <div class="panel-sidebar">
            <div class="sidebar-header">Agent 矩阵</div>
            <div class="sidebar-agents" id="sidebar-agents"></div>
            <div class="sidebar-add" id="sidebar-add"><i class="fas fa-plus"></i> 配置新 Agent</div>
        </div>
        <div class="panel-chat">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-header-icon" id="ch-icon" style="background:#7c3aed"><i class="fas fa-robot"></i></div>
                    <div>
                        <div class="chat-header-name" id="ch-name">通用助手</div>
                        <div class="chat-header-tag" id="ch-tag">general</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="chat-header-btn" title="清空对话"><i class="fas fa-trash-alt"></i></button>
                    <button class="chat-header-btn" title="设置"><i class="fas fa-cog"></i></button>
                    <button class="chat-header-btn" id="close-btn" title="关闭"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="chat-m chat-m-bot">
                    <div class="chat-m-avatar"><i class="fas fa-robot"></i></div>
                    <div class="chat-m-body">
                        <div class="chat-m-bubble">你好！我是你的 AI 助手。左侧可以切换不同的 Agent，每个都有独立的上下文和能力。有什么可以帮你的吗？</div>
                        <div class="chat-m-meta">刚刚</div>
                    </div>
                </div>
            </div>
            <div class="chat-suggestions" id="suggestions">
                <div class="chat-suggestion" data-text="帮我分析一下代码">分析代码</div>
                <div class="chat-suggestion" data-text="给我写一段周报">写周报</div>
                <div class="chat-suggestion" data-text="解释一下这个概念">解释概念</div>
            </div>
            <div class="chat-input-section">
                <div class="chat-input-box">
                    <textarea id="chat-textarea" placeholder="输入消息... (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
                    <button class="chat-submit" id="chat-submit"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const AGENTS = [
            { id: 'general', name: '通用助手', icon: 'fas fa-robot', color: '#7c3aed', desc: '日常对话与任务处理' },
            { id: 'code', name: '代码专家', icon: 'fas fa-laptop-code', color: '#f97316', desc: '编程、调试、代码审查' },
            { id: 'writer', name: '写作助手', icon: 'fas fa-pen-fancy', color: '#10b981', desc: '文案、博客、周报' },
            { id: 'analyst', name: '数据分析', icon: 'fas fa-chart-line', color: '#ec4899', desc: '数据洞察与可视化' },
            { id: 'planner', name: '规划师', icon: 'fas fa-project-diagram', color: '#0ea5e9', desc: '项目规划与任务拆解' },
        ];

        let currentAgent = 'general';

        const dockBtn = document.getElementById('dock-btn');
        const overlay = document.getElementById('overlay');
        const panel = document.getElementById('center-panel');
        const closeBtn = document.getElementById('close-btn');
        const sidebarAgents = document.getElementById('sidebar-agents');
        const messagesEl = document.getElementById('chat-messages');
        const textarea = document.getElementById('chat-textarea');
        const submitBtn = document.getElementById('chat-submit');
        const chIcon = document.getElementById('ch-icon');
        const chName = document.getElementById('ch-name');
        const chTag = document.getElementById('ch-tag');

        function openPanel() { overlay.classList.add('open'); panel.classList.add('open'); textarea.focus(); }
        function closePanel() { overlay.classList.remove('open'); panel.classList.remove('open'); }

        function renderSidebar() {
            sidebarAgents.innerHTML = AGENTS.map(a => `
                <div class="sidebar-agent ${a.id === currentAgent ? 'active' : ''}" data-id="${a.id}">
                    <div class="sidebar-agent-icon" style="background:${a.color}"><i class="${a.icon}"></i></div>
                    <div class="sidebar-agent-info">
                        <div class="sidebar-agent-name">${a.name}</div>
                        <div class="sidebar-agent-desc">${a.desc}</div>
                    </div>
                </div>
            `).join('');
            sidebarAgents.querySelectorAll('.sidebar-agent').forEach(el => {
                el.addEventListener('click', () => switchAgent(el.dataset.id));
            });
        }

        function switchAgent(id) {
            currentAgent = id;
            const agent = AGENTS.find(a => a.id === id);
            chIcon.style.background = agent.color;
            chIcon.innerHTML = `<i class="${agent.icon}"></i>`;
            chName.textContent = agent.name;
            chTag.textContent = agent.id;
            renderSidebar();
            addBotMsg(`已切换到「${agent.name}」— ${agent.desc}。有什么需要帮助的？`);
        }

        function addBotMsg(text) {
            const agent = AGENTS.find(a => a.id === currentAgent);
            const div = document.createElement('div');
            div.className = 'chat-m chat-m-bot';
            div.innerHTML = `
                <div class="chat-m-avatar" style="background:${agent.color}"><i class="${agent.icon}"></i></div>
                <div class="chat-m-body">
                    <div class="chat-m-bubble">${text}</div>
                    <div class="chat-m-meta">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addUserMsg(text) {
            const div = document.createElement('div');
            div.className = 'chat-m chat-m-user';
            div.innerHTML = `
                <div class="chat-m-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-m-body">
                    <div class="chat-m-bubble">${escapeHtml(text)}</div>
                    <div class="chat-m-meta">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function send() {
            const text = textarea.value.trim();
            if (!text) return;
            textarea.value = '';
            textarea.style.height = 'auto';
            addUserMsg(text);
            setTimeout(() => {
                addBotMsg(`[${AGENTS.find(a=>a.id===currentAgent).name}] 收到消息。这是模拟回复，实际集成后会调用 cursor-bridge 或飞书 Aily API。`);
            }, 1000);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Auto-resize textarea
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        });
        textarea.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        dockBtn.addEventListener('click', openPanel);
        overlay.addEventListener('click', closePanel);
        closeBtn.addEventListener('click', closePanel);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
        submitBtn.addEventListener('click', send);

        document.querySelectorAll('.chat-suggestion').forEach(el => {
            el.addEventListener('click', () => { textarea.value = el.dataset.text; send(); });
        });

        renderSidebar();
    })();
    </script>
</body>
</html>
