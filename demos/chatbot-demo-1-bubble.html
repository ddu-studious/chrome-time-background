<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Demo 1 - 极简气泡浮窗</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .page-hint {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0.4; font-size: 14px;
        }
        .page-hint h2 { font-size: 24px; margin-bottom: 8px; }

        /* Chatbot Trigger Button */
        .chatbot-trigger {
            position: fixed; bottom: 24px; right: 24px; z-index: 1000;
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chatbot-trigger:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(102, 126, 234, 0.6); }
        .chatbot-trigger i { color: #fff; font-size: 22px; transition: transform 0.3s; }
        .chatbot-trigger.open i { transform: rotate(90deg); }

        /* Chat Window */
        .chatbot-window {
            position: fixed; bottom: 92px; right: 24px; z-index: 999;
            width: 380px; height: 520px; border-radius: 16px;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column;
            opacity: 0; transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chatbot-window.visible {
            opacity: 1; transform: translateY(0) scale(1); pointer-events: all;
        }

        /* Header */
        .chatbot-header {
            padding: 16px 20px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .chatbot-avatar {
            width: 36px; height: 36px; border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff;
        }
        .chatbot-info { flex: 1; }
        .chatbot-name { font-size: 14px; font-weight: 600; color: #fff; }
        .chatbot-status { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .chatbot-status::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            border-radius: 50%; background: #4ade80; margin-right: 4px; vertical-align: middle;
        }

        /* Agent Selector */
        .agent-selector {
            position: relative;
        }
        .agent-selector-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 6px 10px; cursor: pointer;
            font-size: 11px; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 4px;
            transition: all 0.2s;
        }
        .agent-selector-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .agent-dropdown {
            position: absolute; top: 100%; right: 0; margin-top: 6px;
            background: rgba(30, 30, 50, 0.98); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 6px; min-width: 200px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            opacity: 0; transform: translateY(-4px); pointer-events: none;
            transition: all 0.2s;
        }
        .agent-dropdown.show { opacity: 1; transform: translateY(0); pointer-events: all; }
        .agent-option {
            padding: 8px 12px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.15s;
        }
        .agent-option:hover { background: rgba(255,255,255,0.06); }
        .agent-option.active { background: rgba(102, 126, 234, 0.2); }
        .agent-option-icon {
            width: 28px; height: 28px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #fff;
        }
        .agent-option-info { flex: 1; }
        .agent-option-name { font-size: 12px; font-weight: 500; color: #fff; }
        .agent-option-desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; }

        /* Messages */
        .chatbot-messages {
            flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
        }
        .chatbot-messages::-webkit-scrollbar { width: 4px; }
        .chatbot-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .msg { display: flex; gap: 8px; max-width: 85%; animation: msgIn 0.3s ease; }
        .msg-bot { align-self: flex-start; }
        .msg-user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar {
            width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        .msg-bot .msg-avatar { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .msg-user .msg-avatar { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
        .msg-bubble {
            padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6;
        }
        .msg-bot .msg-bubble {
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9);
            border-bottom-left-radius: 4px;
        }
        .msg-user .msg-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 4px; padding: 0 36px; }

        /* Typing Indicator */
        .typing-indicator { display: flex; gap: 4px; padding: 10px 14px; }
        .typing-dot {
            width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4);
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Input */
        .chatbot-input {
            padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 8px;
        }
        .chatbot-input input {
            flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #fff; outline: none;
            transition: border-color 0.2s;
        }
        .chatbot-input input::placeholder { color: rgba(255,255,255,0.3); }
        .chatbot-input input:focus { border-color: rgba(102, 126, 234, 0.5); }
        .chatbot-send {
            width: 36px; height: 36px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, opacity 0.2s; opacity: 0.7;
        }
        .chatbot-send:hover { transform: scale(1.05); opacity: 1; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        @media (max-width: 480px) {
            .chatbot-window { width: calc(100vw - 16px); right: 8px; bottom: 80px; height: 60vh; }
        }
    </style>
</head>
<body>
    <div class="page-hint">
        <h2>Demo 1 - 极简气泡浮窗</h2>
        <p>点击右下角按钮开启对话</p>
    </div>

    <button class="chatbot-trigger" id="chatbot-trigger">
        <i class="fas fa-comment-dots"></i>
    </button>

    <div class="chatbot-window" id="chatbot-window">
        <div class="chatbot-header">
            <div class="chatbot-avatar"><i class="fas fa-robot"></i></div>
            <div class="chatbot-info">
                <div class="chatbot-name" id="current-agent-name">通用助手</div>
                <div class="chatbot-status">在线</div>
            </div>
            <div class="agent-selector">
                <button class="agent-selector-btn" id="agent-selector-btn">
                    <i class="fas fa-exchange-alt"></i> 切换
                </button>
                <div class="agent-dropdown" id="agent-dropdown"></div>
            </div>
        </div>
        <div class="chatbot-messages" id="chatbot-messages">
            <div class="msg msg-bot">
                <div class="msg-avatar"><i class="fas fa-robot"></i></div>
                <div class="msg-bubble">你好！我是你的 AI 助手。有什么可以帮你的吗？</div>
            </div>
        </div>
        <div class="chatbot-input">
            <input type="text" id="chatbot-input" placeholder="输入消息..." autocomplete="off">
            <button class="chatbot-send" id="chatbot-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // Agent 配置（可自定义）
        const AGENTS_CONFIG = [
            { id: 'general', name: '通用助手', icon: 'fas fa-robot', color: '#667eea', desc: '日常问答与任务' },
            { id: 'code', name: '代码专家', icon: 'fas fa-code', color: '#f97316', desc: '编程与技术问题' },
            { id: 'writer', name: '写作助手', icon: 'fas fa-pen-fancy', color: '#10b981', desc: '文案与内容创作' },
            { id: 'analyst', name: '数据分析', icon: 'fas fa-chart-line', color: '#ec4899', desc: '数据洞察与报告' },
        ];

        let currentAgentId = 'general';
        let isOpen = false;

        const trigger = document.getElementById('chatbot-trigger');
        const window_ = document.getElementById('chatbot-window');
        const messages = document.getElementById('chatbot-messages');
        const input = document.getElementById('chatbot-input');
        const sendBtn = document.getElementById('chatbot-send');
        const agentBtn = document.getElementById('agent-selector-btn');
        const dropdown = document.getElementById('agent-dropdown');
        const agentNameEl = document.getElementById('current-agent-name');

        function renderDropdown() {
            dropdown.innerHTML = AGENTS_CONFIG.map(a => `
                <div class="agent-option ${a.id === currentAgentId ? 'active' : ''}" data-id="${a.id}">
                    <div class="agent-option-icon" style="background:${a.color}"><i class="${a.icon}"></i></div>
                    <div class="agent-option-info">
                        <div class="agent-option-name">${a.name}</div>
                        <div class="agent-option-desc">${a.desc}</div>
                    </div>
                </div>
            `).join('');
            dropdown.querySelectorAll('.agent-option').forEach(el => {
                el.addEventListener('click', () => switchAgent(el.dataset.id));
            });
        }

        function switchAgent(id) {
            currentAgentId = id;
            const agent = AGENTS_CONFIG.find(a => a.id === id);
            agentNameEl.textContent = agent.name;
            dropdown.classList.remove('show');
            renderDropdown();
            addBotMessage(`已切换到「${agent.name}」模式。${agent.desc}，请问有什么需要？`);
        }

        function toggle() {
            isOpen = !isOpen;
            window_.classList.toggle('visible', isOpen);
            trigger.classList.toggle('open', isOpen);
            trigger.querySelector('i').className = isOpen ? 'fas fa-times' : 'fas fa-comment-dots';
            if (isOpen) input.focus();
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-user';
            div.innerHTML = `<div class="msg-avatar"><i class="fas fa-user"></i></div><div class="msg-bubble">${escapeHtml(text)}</div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-bot';
            div.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="msg-bubble">${text}</div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg msg-bot';
            div.id = 'typing-msg';
            div.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-msg');
            if (el) el.remove();
        }

        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addUserMessage(text);
            showTyping();
            // Simulate API call (replace with real cursor-bridge / aily API)
            setTimeout(() => {
                removeTyping();
                addBotMessage(`[${AGENTS_CONFIG.find(a=>a.id===currentAgentId).name}] 收到你的消息："${escapeHtml(text)}"。这是模拟回复，实际会调用后端 API。`);
            }, 1200);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        trigger.addEventListener('click', toggle);
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        agentBtn.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.toggle('show'); });
        document.addEventListener('click', () => dropdown.classList.remove('show'));
        dropdown.addEventListener('click', e => e.stopPropagation());

        renderDropdown();
    })();
    </script>
</body>
</html>
