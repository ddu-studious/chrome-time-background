<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 1 - 卡片网格抽屉</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920') center/cover no-repeat;
    height: 100vh; overflow: hidden; color: #fff;
}
.bg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); }

/* 触发按钮 */
.drawer-trigger {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    width: 56px; height: 56px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, rgba(100,180,255,0.3), rgba(140,100,255,0.3));
    backdrop-filter: blur(20px) saturate(180%);
    color: #fff; font-size: 22px; cursor: pointer;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s;
}
.drawer-trigger:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }

/* 抽屉遮罩 */
.drawer-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden; transition: all 0.3s ease;
}
.drawer-overlay.open { opacity: 1; visibility: visible; }

/* 抽屉面板 */
.drawer-panel {
    position: fixed; top: 0; right: -480px; z-index: 201;
    width: 460px; height: 100vh;
    background: linear-gradient(135deg, rgba(30,32,40,0.95), rgba(20,22,30,0.97));
    backdrop-filter: blur(40px) saturate(200%);
    border-left: 1px solid rgba(255,255,255,0.08);
    box-shadow: -10px 0 60px rgba(0,0,0,0.5);
    transition: right 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex; flex-direction: column; overflow: hidden;
}
.drawer-overlay.open .drawer-panel { right: 0; }

/* 头部 */
.drawer-header {
    padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
}
.drawer-header h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.drawer-header h2 i { color: rgba(100,180,255,0.85); }
.drawer-close {
    width: 32px; height: 32px; border: none; border-radius: 8px;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
    cursor: pointer; font-size: 16px; transition: all 0.2s;
}
.drawer-close:hover { background: rgba(255,100,100,0.2); color: #ff6b6b; }

/* 搜索 */
.drawer-search {
    padding: 12px 24px;
}
.drawer-search input {
    width: 100%; padding: 10px 14px 10px 38px; border: none; border-radius: 10px;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9);
    font-size: 13px; outline: none; transition: all 0.25s;
}
.drawer-search input:focus { background: rgba(255,255,255,0.1); box-shadow: 0 0 0 2px rgba(100,180,255,0.25); }
.drawer-search input::placeholder { color: rgba(255,255,255,0.3); }
.drawer-search { position: relative; }
.drawer-search i {
    position: absolute; left: 38px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.3); font-size: 13px;
}

/* 分类标签 */
.drawer-categories {
    padding: 0 24px 12px; display: flex; gap: 8px; flex-wrap: wrap;
}
.cat-tag {
    padding: 5px 14px; border-radius: 20px; font-size: 12px; border: none;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
    cursor: pointer; transition: all 0.2s;
}
.cat-tag.active, .cat-tag:hover {
    background: rgba(100,180,255,0.2); color: rgba(100,180,255,0.9);
}

/* 卡片网格 */
.drawer-grid {
    flex: 1; overflow-y: auto; padding: 0 24px 24px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    align-content: start;
}
.drawer-grid::-webkit-scrollbar { width: 4px; }
.drawer-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

/* 信息卡片 */
.info-card {
    padding: 16px; border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; transition: all 0.25s;
    position: relative; overflow: hidden;
}
.info-card:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.info-card.full-width { grid-column: 1 / -1; }
.info-card .card-icon {
    width: 36px; height: 36px; border-radius: 10px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.info-card .card-icon.blue { background: rgba(100,180,255,0.15); color: rgba(100,180,255,0.9); }
.info-card .card-icon.purple { background: rgba(180,100,255,0.15); color: rgba(180,100,255,0.9); }
.info-card .card-icon.green { background: rgba(92,216,92,0.15); color: rgba(92,216,92,0.9); }
.info-card .card-icon.orange { background: rgba(255,180,80,0.15); color: rgba(255,180,80,0.9); }
.info-card .card-icon.pink { background: rgba(255,100,150,0.15); color: rgba(255,100,150,0.9); }
.info-card .card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: rgba(255,255,255,0.85); }
.info-card .card-desc { font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.5; }
.info-card .card-count {
    position: absolute; top: 12px; right: 12px;
    font-size: 11px; color: rgba(255,255,255,0.3);
}
.info-card .card-content { margin-top: 10px; }
.info-card .card-content .link-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px;
    color: rgba(255,255,255,0.6);
}
.info-card .card-content .link-item:last-child { border-bottom: none; }
.info-card .card-content .link-item i { color: rgba(100,180,255,0.6); font-size: 10px; }

/* 新增按钮 */
.add-card {
    padding: 16px; border-radius: 14px; border: 2px dashed rgba(255,255,255,0.1);
    background: transparent; color: rgba(255,255,255,0.3); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; min-height: 100px; font-size: 13px; transition: all 0.2s;
}
.add-card:hover { border-color: rgba(100,180,255,0.3); color: rgba(100,180,255,0.7); }
.add-card i { font-size: 24px; }

/* 底部操作栏 */
.drawer-footer {
    padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-between; align-items: center;
}
.drawer-footer .info { font-size: 11px; color: rgba(255,255,255,0.3); }
.drawer-footer button {
    padding: 8px 16px; border: none; border-radius: 8px;
    background: rgba(100,180,255,0.15); color: rgba(100,180,255,0.85);
    font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.drawer-footer button:hover { background: rgba(100,180,255,0.25); }

.demo-label {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    padding: 12px 20px; border-radius: 12px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    font-size: 14px; color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.1);
}
.demo-label strong { color: rgba(100,180,255,0.9); }
</style>
</head>
<body>
<div class="bg-overlay"></div>

<div class="demo-label">
    <strong>Demo 1</strong> — 卡片网格抽屉<br>
    <span style="font-size:12px;color:rgba(255,255,255,0.4)">点击右下角按钮打开抽屉</span>
</div>

<button class="drawer-trigger" id="drawerTrigger" title="打开日常信息">
    <i class="fas fa-th-large"></i>
</button>

<div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer-panel">
        <div class="drawer-header">
            <h2><i class="fas fa-th-large"></i> 日常信息</h2>
            <button class="drawer-close" id="drawerClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索信息...">
        </div>
        <div class="drawer-categories">
            <button class="cat-tag active">全部</button>
            <button class="cat-tag">链接</button>
            <button class="cat-tag">笔记</button>
            <button class="cat-tag">片段</button>
            <button class="cat-tag">联系人</button>
        </div>
        <div class="drawer-grid">
            <div class="info-card">
                <div class="card-icon blue"><i class="fas fa-link"></i></div>
                <span class="card-count">5 项</span>
                <div class="card-title">常用链接</div>
                <div class="card-desc">工作常用网站入口</div>
                <div class="card-content">
                    <div class="link-item"><i class="fas fa-circle"></i> GitHub</div>
                    <div class="link-item"><i class="fas fa-circle"></i> Jira 面板</div>
                    <div class="link-item"><i class="fas fa-circle"></i> 企业邮箱</div>
                </div>
            </div>
            <div class="info-card">
                <div class="card-icon purple"><i class="fas fa-sticky-note"></i></div>
                <span class="card-count">3 项</span>
                <div class="card-title">快捷笔记</div>
                <div class="card-desc">随手记录的信息</div>
                <div class="card-content">
                    <div class="link-item"><i class="fas fa-circle"></i> 会议纪要 3/10</div>
                    <div class="link-item"><i class="fas fa-circle"></i> 项目排期</div>
                </div>
            </div>
            <div class="info-card">
                <div class="card-icon green"><i class="fas fa-code"></i></div>
                <span class="card-count">8 项</span>
                <div class="card-title">代码片段</div>
                <div class="card-desc">常用代码模板</div>
                <div class="card-content">
                    <div class="link-item"><i class="fas fa-circle"></i> Git 常用命令</div>
                    <div class="link-item"><i class="fas fa-circle"></i> SQL 模板</div>
                </div>
            </div>
            <div class="info-card">
                <div class="card-icon orange"><i class="fas fa-address-book"></i></div>
                <span class="card-count">4 项</span>
                <div class="card-title">联系人</div>
                <div class="card-desc">常联系的同事信息</div>
                <div class="card-content">
                    <div class="link-item"><i class="fas fa-circle"></i> 张三 - 后端</div>
                    <div class="link-item"><i class="fas fa-circle"></i> 李四 - 产品</div>
                </div>
            </div>
            <div class="info-card full-width">
                <div class="card-icon pink"><i class="fas fa-calendar-check"></i></div>
                <span class="card-count">12 项</span>
                <div class="card-title">本周要点</div>
                <div class="card-desc">本周需要关注的重要事项</div>
                <div class="card-content">
                    <div class="link-item"><i class="fas fa-circle"></i> 周三发布 v1.6.0</div>
                    <div class="link-item"><i class="fas fa-circle"></i> 周五项目评审</div>
                    <div class="link-item"><i class="fas fa-circle"></i> 服务器证书续期</div>
                </div>
            </div>
            <div class="add-card">
                <i class="fas fa-plus"></i>
                添加信息卡片
            </div>
        </div>
        <div class="drawer-footer">
            <span class="info">共 32 条信息 · 5 个分类</span>
            <button><i class="fas fa-cog"></i> 管理</button>
        </div>
    </div>
</div>

<script>
const trigger = document.getElementById('drawerTrigger');
const overlay = document.getElementById('drawerOverlay');
const close = document.getElementById('drawerClose');

trigger.addEventListener('click', () => overlay.classList.add('open'));
close.addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('open'); });

document.querySelectorAll('.cat-tag').forEach(tag => {
    tag.addEventListener('click', () => {
        document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
    });
});
</script>
</body>
</html>
