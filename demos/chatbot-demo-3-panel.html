<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Demo 3 - 卡片式多 Agent 面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            min-height: 100vh; color: #e0e0e0;
        }
        .page-hint {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0.3; font-size: 14px;
        }

        /* Trigger */
        .chatbot-trigger {
            position: fixed; bottom: 24px; right: 24px; z-index: 1000;
            width: 56px; height: 56px; border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 24px rgba(99, 102, 241, 0.35);
            transition: all 0.3s;
        }
        .chatbot-trigger:hover { transform: scale(1.08) rotate(-3deg); }
        .chatbot-trigger i { color: #fff; font-size: 22px; }

        /* Panel */
        .chatbot-panel {
            position: fixed; top: 0; right: -440px; z-index: 999;
            width: 420px; height: 100vh;
            background: rgba(15, 15, 26, 0.98);
            backdrop-filter: blur(32px);
            border-left: 1px solid rgba(255,255,255,0.06);
            box-shadow: -12px 0 60px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chatbot-panel.open { right: 0; }

        /* Panel Header */
        .panel-header {
            padding: 20px 24px 16px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .panel-header h3 { font-size: 16px; font-weight: 600; }
        .panel-close {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(255,255,255,0.05); border: none; color: #8b949e;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .panel-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* Agent Cards */
        .agent-cards {
            padding: 16px 20px; display: flex; gap: 8px; overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .agent-cards::-webkit-scrollbar { height: 0; }
        .agent-card {
            flex-shrink: 0; padding: 10px 14px; border-radius: 12px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: all 0.2s; min-width: 130px;
        }
        .agent-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }
        .agent-card.active { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.4); }
        .agent-card-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff;
        }
        .agent-card-name { font-size: 12px; font-weight: 500; white-space: nowrap; }
        .agent-card-status {
            width: 6px; height: 6px; border-radius: 50%; background: #4ade80;
            margin-left: auto; flex-shrink: 0;
        }

        /* Chat Area */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .chat-msg { display: flex; gap: 10px; animation: slideIn 0.3s ease; }
        .chat-msg-bot { }
        .chat-msg-user { flex-direction: row-reverse; }
        .chat-msg-avatar {
            width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff;
        }
        .chat-msg-bot .chat-msg-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .chat-msg-user .chat-msg-avatar { background: rgba(255,255,255,0.08); color: #a0a0b0; }
        .chat-msg-content { max-width: 75%; }
        .chat-msg-name { font-size: 10px; color: #6b7280; margin-bottom: 4px; }
        .chat-msg-user .chat-msg-name { text-align: right; }
        .chat-msg-bubble {
            padding: 12px 16px; border-radius: 14px; font-size: 13px; line-height: 1.6;
        }
        .chat-msg-bot .chat-msg-bubble {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06);
            border-top-left-radius: 4px;
        }
        .chat-msg-user .chat-msg-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
            border-top-right-radius: 4px;
        }

        /* Quick Actions */
        .quick-actions {
            padding: 8px 24px; display: flex; gap: 6px; flex-wrap: wrap;
        }
        .quick-action {
            padding: 6px 12px; border-radius: 16px; font-size: 11px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            color: #a0a0b0; cursor: pointer; transition: all 0.2s;
        }
        .quick-action:hover { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.3); color: #c4b5fd; }

        /* Input */
        .chat-input-area {
            padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.06);
        }
        .chat-input-wrapper {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 4px 4px 4px 16px;
            transition: border-color 0.2s;
        }
        .chat-input-wrapper:focus-within { border-color: rgba(99,102,241,0.5); }
        .chat-input-wrapper input {
            flex: 1; background: transparent; border: none; color: #e0e0e0;
            font-size: 13px; outline: none;
        }
        .chat-input-wrapper input::placeholder { color: #4b5563; }
        .chat-send-btn {
            width: 36px; height: 36px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s;
        }
        .chat-send-btn:hover { opacity: 0.85; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .chatbot-panel { width: 100vw; right: -100vw; }
        }
    </style>
</head>
<body>
    <div class="page-hint">
        <h2>Demo 3 - 卡片式侧边面板</h2>
        <p>点击右下角按钮打开侧边栏</p>
    </div>

    <button class="chatbot-trigger" id="chatbot-trigger">
        <i class="fas fa-comments"></i>
    </button>

    <div class="chatbot-panel" id="chatbot-panel">
        <div class="panel-header">
            <h3><i class="fas fa-robot" style="margin-right:8px;color:#8b5cf6"></i>AI 对话</h3>
            <button class="panel-close" id="panel-close"><i class="fas fa-times"></i></button>
        </div>

        <div class="agent-cards" id="agent-cards"></div>

        <div class="chat-area" id="chat-area">
            <div class="chat-msg chat-msg-bot">
                <div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>
                <div class="chat-msg-content">
                    <div class="chat-msg-name">通用助手</div>
                    <div class="chat-msg-bubble">你好！选择上方的 Agent 卡片可以切换不同专家。有什么我能帮你的？</div>
                </div>
            </div>
        </div>

        <div class="quick-actions" id="quick-actions">
            <div class="quick-action" data-text="帮我总结一下">总结</div>
            <div class="quick-action" data-text="帮我写一段代码">写代码</div>
            <div class="quick-action" data-text="分析一下数据">分析数据</div>
            <div class="quick-action" data-text="翻译成英文">翻译</div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="输入消息..." autocomplete="off">
                <button class="chat-send-btn" id="chat-send"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const AGENTS = [
            { id: 'general', name: '通用助手', icon: 'fas fa-robot', color: '#6366f1' },
            { id: 'code', name: '代码专家', icon: 'fas fa-code', color: '#f97316' },
            { id: 'writer', name: '写作', icon: 'fas fa-pen-nib', color: '#10b981' },
            { id: 'analyst', name: '分析师', icon: 'fas fa-chart-pie', color: '#ec4899' },
            { id: 'translator', name: '翻译', icon: 'fas fa-language', color: '#0ea5e9' },
        ];

        let currentAgent = 'general';

        const trigger = document.getElementById('chatbot-trigger');
        const panel = document.getElementById('chatbot-panel');
        const closeBtn = document.getElementById('panel-close');
        const cardsEl = document.getElementById('agent-cards');
        const chatArea = document.getElementById('chat-area');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send');

        function renderCards() {
            cardsEl.innerHTML = AGENTS.map(a => `
                <div class="agent-card ${a.id === currentAgent ? 'active' : ''}" data-id="${a.id}">
                    <div class="agent-card-icon" style="background:${a.color}"><i class="${a.icon}"></i></div>
                    <div class="agent-card-name">${a.name}</div>
                    <div class="agent-card-status"></div>
                </div>
            `).join('');
            cardsEl.querySelectorAll('.agent-card').forEach(el => {
                el.addEventListener('click', () => {
                    currentAgent = el.dataset.id;
                    renderCards();
                    const agent = AGENTS.find(a => a.id === currentAgent);
                    addBotMsg(`已切换到「${agent.name}」。请问有什么需要帮助的？`);
                });
            });
        }

        function addBotMsg(text) {
            const agent = AGENTS.find(a => a.id === currentAgent);
            const div = document.createElement('div');
            div.className = 'chat-msg chat-msg-bot';
            div.innerHTML = `
                <div class="chat-msg-avatar" style="background:${agent.color}"><i class="${agent.icon}"></i></div>
                <div class="chat-msg-content">
                    <div class="chat-msg-name">${agent.name}</div>
                    <div class="chat-msg-bubble">${text}</div>
                </div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addUserMsg(text) {
            const div = document.createElement('div');
            div.className = 'chat-msg chat-msg-user';
            div.innerHTML = `
                <div class="chat-msg-avatar"><i class="fas fa-user"></i></div>
                <div class="chat-msg-content">
                    <div class="chat-msg-name">你</div>
                    <div class="chat-msg-bubble">${escapeHtml(text)}</div>
                </div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addUserMsg(text);
            setTimeout(() => {
                addBotMsg(`收到！[${AGENTS.find(a=>a.id===currentAgent).name}] 正在处理你的请求...（实际对接 API）`);
            }, 900);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        trigger.addEventListener('click', () => panel.classList.add('open'));
        closeBtn.addEventListener('click', () => panel.classList.remove('open'));
        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

        document.querySelectorAll('.quick-action').forEach(el => {
            el.addEventListener('click', () => { input.value = el.dataset.text; send(); });
        });

        renderCards();
    })();
    </script>
</body>
</html>
