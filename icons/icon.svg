<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <defs>
        <!-- 天空渐变 - 呼应毛玻璃山水画主题 -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a2a4a"/>
            <stop offset="50%" stop-color="#2a3d6b"/>
            <stop offset="100%" stop-color="#1e3355"/>
        </linearGradient>
        <!-- 山体渐变 -->
        <linearGradient id="mtGrad1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a5a8c"/>
            <stop offset="100%" stop-color="#2a4060"/>
        </linearGradient>
        <linearGradient id="mtGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4a6fa0"/>
            <stop offset="100%" stop-color="#3a5580"/>
        </linearGradient>
        <!-- 水面渐变 -->
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(100,180,255,0.3)"/>
            <stop offset="100%" stop-color="rgba(60,120,200,0.15)"/>
        </linearGradient>
        <!-- 时钟表盘光晕 -->
        <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
    </defs>

    <!-- 底部圆形（带微妙圆角正方形，更现代） -->
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#skyGrad)"/>

    <!-- 远山 -->
    <path d="M4 95 L28 58 L48 72 L68 42 L88 65 L108 50 L124 70 L124 124 L4 124 Z" 
          fill="url(#mtGrad1)" opacity="0.6"/>
    
    <!-- 近山 -->
    <path d="M4 105 L22 75 L40 88 L58 62 L78 82 L96 68 L118 85 L124 95 L124 124 L4 124 Z" 
          fill="url(#mtGrad2)" opacity="0.8"/>
    
    <!-- 水面 -->
    <rect x="4" y="100" width="120" height="24" rx="0" fill="url(#waterGrad)"/>
    
    <!-- 时钟光晕 -->
    <circle cx="64" cy="52" r="30" fill="url(#clockGlow)"/>
    
    <!-- 时钟外圈 -->
    <circle cx="64" cy="52" r="24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
    
    <!-- 时钟刻度 - 12点 -->
    <line x1="64" y1="30" x2="64" y2="34" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
    <!-- 3点 -->
    <line x1="86" y1="52" x2="82" y2="52" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
    <!-- 6点 -->
    <line x1="64" y1="74" x2="64" y2="70" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
    <!-- 9点 -->
    <line x1="42" y1="52" x2="46" y2="52" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 小刻度 -->
    <line x1="76" y1="33.6" x2="74.5" y2="36.2" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="84.4" y1="40" x2="81.8" y2="41.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="84.4" y1="64" x2="81.8" y2="62.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="76" y1="70.4" x2="74.5" y2="67.8" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="52" y1="70.4" x2="53.5" y2="67.8" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="43.6" y1="64" x2="46.2" y2="62.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="43.6" y1="40" x2="46.2" y2="41.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    <line x1="52" y1="33.6" x2="53.5" y2="36.2" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    
    <!-- 时针（10:10 位置 - 经典美感） -->
    <line x1="64" y1="52" x2="56" y2="40" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- 分针 -->
    <line x1="64" y1="52" x2="74" y2="40" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 中心点 -->
    <circle cx="64" cy="52" r="2.5" fill="rgba(100,180,255,0.9)"/>
    <circle cx="64" cy="52" r="1.2" fill="white"/>
</svg>
