<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI 工作台 · 快捷助手</title>
  <link rel="stylesheet" href="css/assistant.css?v=20260928-todo-surface-2">
</head>
<body>
  <div id="assistant-shell" class="assistant-shell">
  <main class="assistant" aria-label="快捷助手">
    <header><h1><span>AI 工作台</span><span class="workspace-subtitle">快捷助手</span><small id="session-label"></small></h1><div><button id="edit-task" class="quiet" type="button" hidden>编辑输入</button><button id="new-task" class="quiet" type="button">＋ 新需求</button><button id="hide" class="quiet" type="button" aria-label="收起输入条">Esc 收起</button></div></header>
    <section class="workspace-intro" aria-label="工作台介绍"><h2>从一句话开始</h2><p>找音乐、继续看视频，或安排下一件事。</p></section>
    <form id="compose">
      <div class="search-line"><span class="search-icon" aria-hidden="true">✦</span><div id="tokens" aria-label="已选择的应用与动作"></div>
      <label class="sr-only" for="request">输入你的需求</label>
      <textarea id="request" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" maxlength="500" rows="1" placeholder="输入 @ 选择应用，或说说你想做什么…" autocomplete="off" spellcheck="false"></textarea><button id="submit" class="primary" type="submit" aria-label="执行需求">↵</button></div>
      <div class="toolbar"><div><button id="apps" type="button">@ 应用</button><button id="skills" type="button">/ 动作</button><label class="ai-choice"><span>模型</span><select id="assistant-model" aria-label="选择本次请求的模型" disabled><option value="">读取中…</option></select></label><label class="ai-choice"><span>思考</span><select id="assistant-reasoning" aria-label="选择本次请求的思考强度" disabled><option value="">默认</option></select></label><span id="session-memory"></span></div><div><span id="submit-mode"></span><span id="new-request-shortcut"></span><button id="compact-context" type="button" hidden>整理上下文</button><button id="cancel" type="button" hidden>停止执行</button></div></div>
      <div class="decision-row"><label class="ai-choice"><span>Laya 决策辅助</span><select id="assistant-laya-mode" aria-label="选择 Laya 决策辅助模式" aria-describedby="assistant-laya-note" disabled><option value="off">关闭</option><option value="shadow">只观察</option><option value="assist">参与预加载 · 实验</option></select></label><span id="assistant-laya-note" role="status" aria-live="polite">读取本机策略…</span><a href="settings.html#ai-control" target="_blank" rel="noopener">详细设置 ↗</a></div>
      <div class="voice-row"><div id="voice-input" aria-label="语音输入"></div><span id="voice-status" role="status" aria-live="polite">本机语音 · 先转文字，再由你执行</span><a id="voice-open-standalone" href="assistant.html" target="_blank" rel="noopener" hidden>在独立页录音 ↗</a><button id="voice-stop" type="button" hidden>停止朗读</button></div>
    </form>
    <section id="discovery" aria-label="应用与动作建议"><h2 id="menu-title">试试这样说</h2><div id="suggestions" role="listbox" aria-label="应用、动作与示例"></div></section>
    <section id="session-receipt" hidden><button id="receipt-toggle" type="button" aria-expanded="false" aria-controls="session-workspace"><span class="receipt-check" aria-hidden="true">✓</span><span id="receipt-title"></span><span id="receipt-label">查看本次对话 ⌄</span></button></section>
    <div id="session-workspace" hidden>
    <section id="task" aria-label="当前任务" hidden>
      <div class="task-heading"><h2 id="task-title">当前任务</h2><span id="task-state"></span></div>
      <div id="conversation-messages" aria-label="本次对话"></div>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="playback-feedback" role="status" aria-live="polite" hidden><strong id="playback-title"></strong><p id="playback-message"></p></section>
      <div id="music-view" hidden></div><div id="music-filters" hidden><nav id="music-types" aria-label="音乐结果类型"></nav><input id="result-filter" aria-label="筛选当前音乐结果，支持拼音" placeholder="拼音筛选当前结果"></div><div id="choices"></div>
      <div id="records"></div>
      <details id="steps"><summary>执行步骤</summary><ol id="step-list"></ol></details>
    </section>
    <aside id="execution-panel" aria-label="执行过程">
      <button id="trace-toggle" type="button" aria-expanded="true" aria-controls="trace-body"><span><span class="trace-dot" aria-hidden="true"></span><strong id="trace-title">执行过程</strong></span><span id="trace-toggle-label">收起过程 ⌃</span></button>
      <div id="trace-body"><p id="trace-meta"></p><div id="trace-list" aria-label="执行动作时间线"></div><p id="trace-note"></p><a class="trace-history" href="settings.html#ai-control" target="_blank" rel="noopener">查看完整留存记录 ↗</a></div>
    </aside>
    </div>
    <p id="error" role="alert" hidden></p>
    <footer><button id="examples" class="quiet" type="button">示例</button><span id="shortcut">正在读取快捷键…</span><button id="shortcut-settings" class="quiet" type="button">设置快捷键</button><a href="settings.html#ai-control" target="_blank" rel="noopener">AI 设置</a><a href="assistant-memory.html" target="_blank" rel="noopener">我的记忆</a><span class="keyboard-tip">↑↓ 选择 · Tab 补全</span></footer>
  </main>
  <aside id="todo-tips" class="todo-tips" aria-label="待办清单侧边贴片" hidden>
    <button id="todo-toggle" type="button" aria-expanded="true" aria-controls="todo-content" aria-label="收起待办清单">
      <span class="todo-title">待办清单</span><span class="todo-title-short" aria-hidden="true">待办</span>
      <span id="todo-badge"></span><span id="todo-chevron" aria-hidden="true">›</span>
    </button>
    <div id="todo-content">
      <p id="todo-progress" role="status" aria-live="polite"></p><p id="todo-note"></p><ol id="todo-list"></ol>
    </div>
  </aside>
  </div>
  <script src="vendor/pinyin-match/pinyin-match.js"></script><script src="js/assistant-match.js"></script>
  <script src="js/music-intent.js"></script><script src="js/assistant-memory.js"></script><script src="js/assistant-contract.js"></script>
  <script src="js/assistant-todo.js"></script>
  <script src="js/assistant-timeline.js?v=20260929-speed"></script>
  <script src="js/voice-live.js"></script><script src="js/voice-input.js"></script><script src="js/assistant-voice.js"></script>
  <script src="js/assistant.js?v=20260928-todo-surface-2"></script>
</body>
</html>
