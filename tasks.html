<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理 - 中国风景时钟</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/tasks.css?v=2">
    <link rel="stylesheet" href="css/product-ui-v4.css">
    <link rel="stylesheet" href="css/product-ui-v5.css?v=6">
    <link rel="stylesheet" href="css/tasks-v5.css?v=5">
    <link rel="stylesheet" href="vendor/highlight-theme.css">
</head>
<body class="task-workbench-v5">
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="back-link" title="返回首页">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="header-title">
                <i class="fas fa-tasks"></i>
                <span>任务<small>集中查看、筛选与推进所有事项</small></span>
            </h1>
        </div>
        <div class="header-right">
            <div class="header-stats" id="header-stats">
                <span class="stat-item" title="总任务数"><i class="fas fa-list"></i> <span id="stat-total">0</span></span>
                <span class="stat-item stat-active" title="进行中"><i class="fas fa-spinner"></i> <span id="stat-active">0</span></span>
                <span class="stat-item stat-done" title="已完成"><i class="fas fa-check"></i> <span id="stat-done">0</span></span>
                <span class="stat-item stat-overdue" title="已过期"><i class="fas fa-exclamation-triangle"></i> <span id="stat-overdue">0</span></span>
                <span class="stat-item stat-failed" title="已失败"><i class="fas fa-times-circle"></i> <span id="stat-failed">0</span></span>
            </div>
            <button class="task-create-btn" id="task-create-btn" type="button"><i class="fas fa-plus"></i> 新建任务</button>
        </div>
    </header>

    <nav class="task-page-tabs" aria-label="任务视图">
        <button class="task-page-tab active" type="button" data-task-view="list" aria-current="page"><i class="fas fa-list"></i><span>列表</span></button>
        <button class="task-page-tab" type="button" data-task-view="kanban" aria-current="false"><i class="fas fa-table-columns"></i><span>看板</span></button>
        <button class="task-page-tab" type="button" data-task-view="calendar" aria-current="false"><i class="far fa-calendar-alt"></i><span>日历</span></button>
        <button class="task-page-tab" type="button" data-task-view="analytics" aria-current="false"><i class="fas fa-chart-pie"></i><span>分析</span></button>
        <button class="task-page-tab" type="button" data-task-view="recurring-habits" aria-current="false"><i class="fas fa-repeat"></i><span>周期与习惯</span></button>
    </nav>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="搜索任务标题、内容..." autocomplete="off">
                <button class="search-clear" id="search-clear" type="button" title="清除搜索" aria-label="清除搜索">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="toolbar-right">
            <div class="filter-group">
                <select id="filter-status" class="filter-select" aria-label="按状态筛选">
                    <option value="all">全部状态</option>
                    <option value="active">未完成</option>
                    <option value="in_progress">进行中</option>
                    <option value="not_started">待处理</option>
                    <option value="waiting">等待</option>
                    <option value="completed">已完成</option>
                    <option value="failed">已失败</option>
                    <option value="overdue">已过期</option>
                    <option value="archived">已归档</option>
                    <option value="today">今日到期</option>
                </select>
                <select id="filter-priority" class="filter-select" aria-label="按优先级筛选">
                    <option value="all">全部优先级</option>
                    <option value="high">高优先级</option>
                    <option value="medium">中优先级</option>
                    <option value="low">低优先级</option>
                    <option value="none">无优先级</option>
                </select>
                <div id="filter-category-wrap" class="filter-category-combobox-wrap"></div>
                <select id="sort-select" class="filter-select" aria-label="任务排序方式">
                    <option value="newest">最新创建</option>
                    <option value="oldest">最早创建</option>
                    <option value="dueDate">截止日期</option>
                    <option value="priority">优先级</option>
                    <option value="progress">进度</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 批量操作栏（选中任务时显示） -->
    <div class="batch-bar hidden" id="batch-bar">
        <span class="batch-info">已选择 <strong id="batch-count">0</strong> 个任务</span>
        <div class="batch-actions">
            <button class="batch-btn" id="batch-complete" title="批量完成"><i class="fas fa-check"></i> 标记完成</button>
            <button class="batch-btn" id="batch-uncomplete" title="批量取消完成"><i class="fas fa-undo"></i> 取消完成</button>
            <button class="batch-btn" id="batch-archive" title="批量归档"><i class="fas fa-box-archive"></i> 归档</button>
            <button class="batch-btn batch-danger" id="batch-delete" title="批量删除"><i class="fas fa-trash"></i> 删除</button>
            <button class="batch-btn" id="batch-cancel" title="取消选择"><i class="fas fa-times"></i> 取消</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 表格视图 -->
        <section class="task-view-panel table-view" id="table-view" data-task-panel="list">
            <table class="task-table">
                <thead>
                    <tr>
                        <th class="col-checkbox"><input type="checkbox" id="select-all" title="全选" aria-label="选择当前页全部任务"></th>
                        <th class="col-status">状态</th>
                        <th class="col-priority">优先级</th>
                        <th class="col-title">标题</th>
                        <th class="col-category">分类</th>
                        <th class="col-progress">进度</th>
                        <th class="col-due">截止日期</th>
                        <th class="col-created">创建时间</th>
                        <th class="col-actions">操作</th>
                    </tr>
                </thead>
                <tbody id="task-table-body">
                    <!-- 任务行将在这里动态生成 -->
                </tbody>
            </table>
        </section>

        <section class="task-view-panel kanban-view hidden" id="kanban-view" data-task-panel="kanban">
            <div class="task-kanban" id="task-kanban"></div>
        </section>

        <section class="task-view-panel calendar-view hidden" id="calendar-view" data-task-panel="calendar">
            <div class="task-calendar-shell">
                <div class="task-calendar-header">
                    <button type="button" id="calendar-prev" aria-label="上个月"><i class="fas fa-chevron-left"></i></button>
                    <div><strong id="calendar-title"></strong><span>按截止日期规划任务</span></div>
                    <button type="button" id="calendar-next" aria-label="下个月"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-unscheduled" id="calendar-unscheduled"></div>
                <div class="task-calendar" id="task-calendar"></div>
            </div>
        </section>

        <section class="task-view-panel analytics-view hidden" id="analytics-view" data-task-panel="analytics">
            <div id="task-analytics"></div>
        </section>

        <section class="task-view-panel recurring-view hidden" id="recurring-view" data-task-panel="recurring-habits">
            <div id="task-recurring"></div>
        </section>

        <div class="empty-state hidden" id="empty-state">
            <i class="fas fa-search" id="empty-state-icon"></i>
            <h3 id="empty-state-title">暂无任务</h3>
            <p id="empty-state-copy">创建你的第一个任务，开始高效推进工作</p>
            <div class="task-empty-context hidden" id="task-empty-context"></div>
            <div class="task-empty-actions">
                <button class="task-empty-create" id="task-empty-create" type="button"><i class="fas fa-plus"></i> 新建任务</button>
                <button class="task-empty-secondary hidden" id="task-empty-clear" type="button"><i class="fas fa-filter-circle-xmark"></i> 清除筛选</button>
                <button class="task-empty-secondary hidden" id="task-empty-archived" type="button"><i class="fas fa-box-archive"></i> 查看已归档</button>
            </div>
        </div>
    </main>

    <!-- 任务详情侧边面板 -->
    <div class="detail-overlay hidden" id="detail-overlay"></div>
    <aside class="detail-panel hidden" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true">
        <div class="detail-header">
            <h2 id="detail-title">任务详情</h2>
            <button class="detail-close" id="detail-close" type="button" title="关闭" aria-label="关闭任务详情"><i class="fas fa-times"></i></button>
        </div>
        <div class="detail-body" id="detail-body">
            <!-- 详情内容将在这里动态生成 -->
        </div>
    </aside>

    <div class="task-create-overlay hidden" id="task-create-overlay"></div>
    <section class="task-create-sheet hidden" id="task-create-sheet" role="dialog" aria-modal="true" aria-labelledby="task-create-title" aria-hidden="true">
        <form id="task-create-form">
            <div class="task-create-heading">
                <div><span class="task-create-kicker">NEW TASK</span><h2 id="task-create-title">新建任务</h2><p>把目标拆成下一步可执行的行动。</p></div>
                <button type="button" class="detail-close" id="task-create-close" aria-label="关闭新建任务"><i class="fas fa-times"></i></button>
            </div>
            <label class="task-create-field task-create-field-wide"><span>任务标题</span><input id="task-create-name" name="title" required maxlength="120" placeholder="例如：完成首页交互验收"></label>
            <label class="task-create-field task-create-field-wide"><span>说明</span><textarea id="task-create-description" name="text" rows="4" maxlength="1000" placeholder="补充验收标准、上下文或下一步"></textarea></label>
            <div class="task-create-stage"><span><b>1</b> 基本信息</span><i></i><span><b>2</b> 计划与拆解</span><small>标题填写后即可快速创建，高级属性都有清晰默认值。</small></div>
            <div class="task-create-grid">
                <label class="task-create-field"><span>开始日期</span><input id="task-create-start" name="startDate" type="date"></label>
                <label class="task-create-field"><span>截止日期</span><input id="task-create-due" name="dueDate" type="date"></label>
                <label class="task-create-field"><span>优先级</span><select id="task-create-priority" name="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option><option value="none">无</option></select></label>
                <label class="task-create-field"><span>重复</span><select id="task-create-recurrence" name="recurrence"><option value="">不重复</option><option value="daily">每天</option><option value="weekdays">工作日</option><option value="weekly">每周</option><option value="monthly">每月</option></select></label>
                <label class="task-create-field"><span>负责人</span><input id="task-create-assignee" name="assignee" maxlength="40" value="我" placeholder="默认由我负责"></label>
                <label class="task-create-field"><span>初始进度</span><input id="task-create-progress" name="progress" type="number" min="0" max="100" value="0" inputmode="numeric"></label>
                <label class="task-create-field"><span>第一个子任务</span><input id="task-create-subtask" name="subtask" maxlength="200" placeholder="可选，创建后可继续补充"></label>
                <label class="task-create-field"><span>图片附件</span><input id="task-create-images" name="images" type="file" accept="image/*" multiple><small>最多 3 张，每张不超过 1MB</small></label>
            </div>
            <div class="task-create-error hidden" id="task-create-error" role="alert"></div>
            <div class="task-create-actions"><button type="button" id="task-create-cancel">取消</button><button type="submit" class="primary" id="task-create-submit"><i class="fas fa-plus"></i> 创建任务</button></div>
        </form>
    </section>

    <!-- 分页 -->
    <div class="pagination" id="pagination">
        <button class="page-btn" id="page-prev" type="button" title="上一页" aria-label="上一页"><i class="fas fa-chevron-left"></i></button>
        <span class="page-info" id="page-info">第 1 页 / 共 1 页</span>
        <button class="page-btn" id="page-next" type="button" title="下一页" aria-label="下一页"><i class="fas fa-chevron-right"></i></button>
        <select class="page-size-select" id="page-size" aria-label="每页任务数量">
            <option value="20">每页 20 条</option>
            <option value="50">每页 50 条</option>
            <option value="100">每页 100 条</option>
        </select>
    </div>

    <div class="task-action-toast hidden" id="task-action-toast" role="status" aria-live="polite">
        <span id="task-action-message"></span><button id="task-action-undo" type="button">撤销</button>
    </div>

    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/mermaid.tiny.min.js"></script>
    <script src="js/markdown-renderer.js"></script>
    <script src="js/chrome-shim.js?v=5"></script>
    <script src="js/product-pages-v5.js?v=6"></script>
    <script src="js/product-ui-v5.js?v=6"></script>
    <script src="js/tasks.js?v=11"></script>
</body>
</html>
