<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诗词电台真实页面验收夹具</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#07101d}</style>
</head>
<body>
  <iframe id="app" src="../../index.html" title="诗词电台本地验收页面"></iframe>
  <script>
    const storageKey = '__chrome_storage__';
    const previousStorage = localStorage.getItem(storageKey);
    addEventListener('beforeunload', () => {
      if (previousStorage == null) localStorage.removeItem(storageKey);
      else localStorage.setItem(storageKey, previousStorage);
    }, { once: true });
    const frame = document.getElementById('app');
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      for (let i = 0; i < 200 && !win.PoetryRadioV5; i += 1) await sleep(50);
      const api = win.PoetryRadioV5;
      if (!api) return;
      api.state.poems = [
        { title: '山居秋暝', author: '王维', dynasty: '唐', lines: ['空山新雨后，天气晚来秋。', '明月松间照，清泉石上流。', '竹喧归浣女，莲动下渔舟。', '随意春芳歇，王孙自可留。'] },
        { title: '饮湖上初晴后雨', author: '苏轼', dynasty: '宋', lines: ['水光潋滟晴方好，山色空蒙雨亦奇。', '欲把西湖比西子，淡妆浓抹总相宜。'] },
        { title: '春江花月夜', author: '张若虚', dynasty: '唐', lines: ['春江潮水连海平，海上明月共潮生。', '滟滟随波千万里，何处春江无月明。'] }
      ];
      api.state.currentIndex = 0;
      api.state.favorites = ['山居秋暝-王维'];
      api.state.mode = 'random';
      api.state.speed = 1;
      api.state.pitch = 1;
      api.renderCurrent();
      api.toggleMini();
      const view = new URLSearchParams(location.search).get('view') || 'mini-player';
      if (view !== 'mini-player') api.showPage(view);
    });
  </script>
</body>
</html>
