<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应用启动台真实页面验收夹具</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#07101d}</style>
</head>
<body>
  <iframe id="app" title="应用启动台本地验收页面"></iframe>
  <script>
    const frame = document.getElementById('app');
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    frame.src = `../../index.html?fixtureRev=${encodeURIComponent(new URLSearchParams(location.search).get('rev') || Date.now())}`;
    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      for (let i = 0; i < 200 && !win.dockManager?.launchpadEl; i += 1) await sleep(50);
      const manager = win.dockManager;
      if (!manager?.launchpadEl) return;
      const view = new URLSearchParams(location.search).get('view') || 'all-apps';
      if (view === 'dock-menu') {
        const rect = win.document.getElementById('dock-bar')?.getBoundingClientRect();
        manager._showContextMenu(rect?.right || win.innerWidth - 24, rect?.top || win.innerHeight - 80);
        return;
      }
      manager.showLaunchpad();
      if (view === 'category') {
        manager.launchpadEl.querySelector('[data-category="games"]')?.click();
      } else if (view === 'search') {
        const search = manager.launchpadEl.querySelector('#dock-launchpad-search');
        search.value = '音乐';
        search.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  </script>
</body>
</html>
