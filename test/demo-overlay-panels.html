<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 矩阵浮层面板 - 方案对比</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.3);
  --green: #22c55e;
  --blue: #3b82f6;
  --red: #ef4444;
  --yellow: #eab308;
  --bg-dark: #0a0c14;
  --bg-card: rgba(22, 25, 38, 0.85);
  --bg-glass: rgba(30, 33, 48, 0.72);
  --border: rgba(99, 102, 241, 0.15);
  --border-hover: rgba(99, 102, 241, 0.4);
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0c14 0%, #1a1d2b 50%, #0f1219 100%);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}

/* ─── Scheme Switcher ─── */
.switcher {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  gap: 6px;
  padding: 6px;
  background: rgba(15, 18, 25, 0.9);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.switcher button {
  position: relative;
  width: 48px;
  height: 40px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.5px;
}

.switcher button:hover {
  color: var(--text);
  background: rgba(99, 102, 241, 0.1);
  border-color: var(--border);
}

.switcher button.active {
  color: #fff;
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
}

.switcher-label {
  display: flex;
  align-items: center;
  padding: 0 12px 0 8px;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  border-right: 1px solid var(--border);
  margin-right: 4px;
}

.switcher-label i { margin-right: 6px; font-size: 14px; color: var(--primary); }

/* ─── Trigger Buttons ─── */
.trigger-hint {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  gap: 12px;
  align-items: center;
}

.trigger-btn {
  padding: 12px 28px;
  border: 1px solid var(--primary);
  border-radius: 12px;
  background: rgba(99, 102, 241, 0.12);
  backdrop-filter: blur(10px);
  color: var(--primary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}

.trigger-btn:hover {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 0 30px var(--primary-glow);
  transform: translateY(-2px);
}

.trigger-btn .kbd {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  font-family: monospace;
}

/* ─── Background Scene ─── */
.bg-scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #0a0c14 0%, #1a1d2b 50%, #0f1219 100%);
}

.bg-scene::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 30%, rgba(99,102,241,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 500px 300px at 80% 70%, rgba(34,197,94,0.04) 0%, transparent 70%);
}

.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ─── Overlay / Mask ─── */
.overlay-mask {
  position: fixed;
  inset: 0;
  z-index: 9000;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s ease;
}

.overlay-mask.visible {
  opacity: 1;
  visibility: visible;
}

/* ─── Scheme Container ─── */
.scheme { display: none; }
.scheme.active { display: block; }

/* ═══════════════════════════════════════════
   Scheme A: 中央浮层面板
   ═══════════════════════════════════════════ */
.panel-a {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  z-index: 9500;
  width: 720px;
  height: 520px;
  background: var(--bg-glass);
  backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 60px var(--primary-glow);
  opacity: 0;
  visibility: hidden;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-a.open {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}

.panel-a-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  cursor: move;
  user-select: none;
  flex-shrink: 0;
}

.panel-a-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.panel-a-header-left h3 {
  font-size: 15px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

.status-badge.connected {
  background: rgba(34, 197, 94, 0.12);
  color: var(--green);
  border: 1px solid rgba(34, 197, 94, 0.2);
}

.status-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse-dot 2s ease infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
  50% { opacity: 0.7; box-shadow: 0 0 0 4px transparent; }
}

.close-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.close-btn:hover {
  background: rgba(239, 68, 68, 0.15);
  border-color: rgba(239, 68, 68, 0.3);
  color: var(--red);
}

.panel-a-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.panel-a-sidebar {
  width: 180px;
  border-right: 1px solid var(--border);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}

.panel-a-sidebar .sidebar-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  padding: 6px 8px 8px;
  font-weight: 600;
}

.tpl-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  width: 100%;
}

.tpl-btn i { width: 16px; text-align: center; font-size: 12px; }

.tpl-btn:hover {
  background: rgba(99, 102, 241, 0.08);
  border-color: var(--border);
  color: var(--text);
}

.tpl-btn:active { transform: scale(0.97); }

.panel-a-content {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.panel-a-content::-webkit-scrollbar { width: 4px; }
.panel-a-content::-webkit-scrollbar-track { background: transparent; }
.panel-a-content::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.2); border-radius: 4px; }

.agent-card {
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(15, 18, 28, 0.5);
  cursor: pointer;
  transition: var(--transition);
}

.agent-card:hover {
  border-color: var(--border-hover);
  background: rgba(99, 102, 241, 0.06);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.agent-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.agent-card-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}

.agent-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.agent-icon.purple { background: rgba(99,102,241,0.15); color: var(--primary); }
.agent-icon.blue { background: rgba(59,130,246,0.15); color: var(--blue); }
.agent-icon.green { background: rgba(34,197,94,0.15); color: var(--green); }

.agent-status-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

.agent-status-tag.running { background: rgba(34,197,94,0.12); color: var(--green); }
.agent-status-tag.idle { background: rgba(148,163,184,0.1); color: var(--text-muted); }
.agent-status-tag.error { background: rgba(239,68,68,0.12); color: var(--red); }

.agent-card-desc {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 8px;
}

.agent-card-meta {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--text-muted);
}

.agent-card-meta span { display: flex; align-items: center; gap: 4px; }

.panel-a-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-a-footer-left {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-a-footer-right { display: flex; gap: 8px; }

.new-agent-btn {
  padding: 7px 16px;
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  background: rgba(99, 102, 241, 0.12);
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.new-agent-btn:hover {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 0 20px var(--primary-glow);
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
  flex: 1;
}

.empty-state i {
  font-size: 40px;
  color: var(--text-muted);
  margin-bottom: 16px;
  opacity: 0.4;
}

.empty-state h4 {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.empty-state p {
  font-size: 12px;
  color: var(--text-muted);
  max-width: 240px;
  line-height: 1.6;
}

/* ═══════════════════════════════════════════
   Scheme B: 命令面板式
   ═══════════════════════════════════════════ */
.panel-b {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-30px);
  z-index: 9500;
  width: 600px;
  max-height: 480px;
  background: var(--bg-glass);
  backdrop-filter: blur(28px) saturate(1.5);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.1) inset;
  opacity: 0;
  visibility: hidden;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-b.open {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

.panel-b-search {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.panel-b-search i {
  font-size: 16px;
  color: var(--primary);
}

.panel-b-search input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  outline: none;
}

.panel-b-search input::placeholder { color: var(--text-muted); }

.panel-b-search .esc-hint {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: monospace;
}

.panel-b-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.panel-b-body::-webkit-scrollbar { width: 4px; }
.panel-b-body::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.2); border-radius: 4px; }

.panel-b-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  padding: 10px 14px 6px;
  font-weight: 600;
}

.panel-b-templates {
  display: flex;
  gap: 6px;
  padding: 4px 10px 10px;
  flex-wrap: wrap;
}

.panel-b-tpl {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: rgba(99,102,241,0.06);
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.panel-b-tpl i { font-size: 11px; }

.panel-b-tpl:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(99,102,241,0.12);
}

.panel-b-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}

.panel-b-item:hover { background: rgba(99,102,241,0.08); }

.panel-b-item .agent-icon { width: 32px; height: 32px; border-radius: 8px; }

.panel-b-item-info { flex: 1; min-width: 0; }

.panel-b-item-info h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-b-item-info p {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.panel-b-item-action {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

.panel-b-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  text-align: center;
}

.panel-b-empty i { font-size: 32px; color: var(--text-muted); opacity: 0.3; margin-bottom: 12px; }
.panel-b-empty p { font-size: 12px; color: var(--text-muted); }

/* ═══════════════════════════════════════════
   Scheme C: 分离式浮动卡片
   ═══════════════════════════════════════════ */
.panel-c {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9500;
  width: 320px;
  max-height: 440px;
  background: var(--bg-glass);
  backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 16px 60px rgba(0,0,0,0.4), 0 0 40px rgba(99,102,241,0.08);
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px) scale(0.95);
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-c.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.panel-c-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.panel-c-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-c-header-left h3 {
  font-size: 14px;
  font-weight: 700;
}

.panel-c-header-left .count {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(99,102,241,0.15);
  color: var(--primary);
  font-weight: 600;
}

.panel-c-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.panel-c-body::-webkit-scrollbar { width: 3px; }
.panel-c-body::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.2); border-radius: 3px; }

.mini-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(15, 18, 28, 0.4);
  cursor: pointer;
  transition: var(--transition);
}

.mini-card:hover {
  border-color: var(--border-hover);
  background: rgba(99,102,241,0.06);
  transform: translateX(2px);
}

.mini-card .agent-icon { width: 32px; height: 32px; border-radius: 8px; font-size: 13px; }

.mini-card-info { flex: 1; min-width: 0; }
.mini-card-info h4 { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.mini-card-info p { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mini-card-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.mini-card-status.running { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.4); }
.mini-card-status.idle { background: var(--text-muted); }
.mini-card-status.error { background: var(--red); }

.panel-c-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  text-align: center;
}

.panel-c-empty i { font-size: 28px; color: var(--text-muted); opacity: 0.3; margin-bottom: 10px; }
.panel-c-empty p { font-size: 11px; color: var(--text-muted); line-height: 1.6; }

.panel-c-tpls {
  padding: 6px 10px 4px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.panel-c-tpl-chip {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: transparent;
  color: var(--text-muted);
  font-size: 10px;
  cursor: pointer;
  transition: var(--transition);
}

.panel-c-tpl-chip:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(99,102,241,0.08);
}

.panel-c-footer {
  padding: 10px;
  border-top: 1px solid var(--border);
}

.panel-c-footer .new-agent-btn {
  width: 100%;
  justify-content: center;
  padding: 8px;
  border-radius: 10px;
}

/* ═══════════════════════════════════════════
   Scheme D: 全屏接管式
   ═══════════════════════════════════════════ */
.panel-d {
  position: fixed;
  inset: 0;
  z-index: 9500;
  background: rgba(10, 12, 20, 0.88);
  backdrop-filter: blur(20px);
  opacity: 0;
  visibility: hidden;
  transition: all 0.4s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 40px 40px;
  overflow-y: auto;
}

.panel-d.open {
  opacity: 1;
  visibility: visible;
}

.panel-d-header {
  width: 100%;
  max-width: 800px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.4s ease 0.1s;
}

.panel-d.open .panel-d-header {
  opacity: 1;
  transform: translateY(0);
}

.panel-d-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.panel-d-header-left h2 {
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.panel-d-toolbar {
  display: flex;
  gap: 8px;
}

.panel-d-toolbar button {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(30,33,48,0.6);
  backdrop-filter: blur(10px);
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.panel-d-toolbar button:hover {
  border-color: var(--border-hover);
  color: var(--text);
  background: rgba(99,102,241,0.1);
}

.panel-d-toolbar button.primary-btn {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(99,102,241,0.1);
}

.panel-d-toolbar button.primary-btn:hover {
  background: var(--primary);
  color: #fff;
}

.panel-d-templates {
  width: 100%;
  max-width: 800px;
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.4s ease 0.15s;
}

.panel-d.open .panel-d-templates {
  opacity: 1;
  transform: translateY(0);
}

.panel-d-tpl {
  padding: 8px 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(30,33,48,0.4);
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-d-tpl i { font-size: 13px; }

.panel-d-tpl:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(99,102,241,0.1);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.panel-d-grid {
  width: 100%;
  max-width: 800px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.panel-d-card {
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(22, 25, 38, 0.6);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: var(--transition);
  opacity: 0;
  transform: translateY(20px);
}

.panel-d.open .panel-d-card {
  opacity: 1;
  transform: translateY(0);
}

.panel-d.open .panel-d-card:nth-child(1) { transition-delay: 0.2s; }
.panel-d.open .panel-d-card:nth-child(2) { transition-delay: 0.25s; }
.panel-d.open .panel-d-card:nth-child(3) { transition-delay: 0.3s; }
.panel-d.open .panel-d-card:nth-child(4) { transition-delay: 0.35s; }

.panel-d-card:hover {
  border-color: var(--border-hover);
  background: rgba(99, 102, 241, 0.06);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.3), 0 0 30px var(--primary-glow);
}

.panel-d-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.panel-d-card-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.panel-d-card-title .agent-icon { width: 36px; height: 36px; border-radius: 10px; font-size: 15px; }

.panel-d-card-title h4 { font-size: 15px; font-weight: 700; }

.panel-d-card-desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 14px;
}

.panel-d-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-d-card-meta {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--text-muted);
}

.panel-d-card-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.panel-d-card-actions { display: flex; gap: 6px; }

.panel-d-card-actions button {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.panel-d-card-actions button:hover {
  border-color: var(--border-hover);
  color: var(--text);
  background: rgba(99,102,241,0.1);
}

.panel-d-empty-card {
  padding: 40px 20px;
  border: 2px dashed var(--border);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  opacity: 0;
  transform: translateY(20px);
}

.panel-d.open .panel-d-empty-card {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.4s;
}

.panel-d-empty-card:hover {
  border-color: var(--primary);
  background: rgba(99,102,241,0.04);
}

.panel-d-empty-card i {
  font-size: 28px;
  color: var(--text-muted);
  opacity: 0.4;
  margin-bottom: 12px;
}

.panel-d-empty-card h4 { font-size: 14px; color: var(--text-dim); margin-bottom: 4px; }
.panel-d-empty-card p { font-size: 12px; color: var(--text-muted); }

.panel-d-close {
  position: fixed;
  top: 20px;
  right: 24px;
  z-index: 9600;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(30,33,48,0.6);
  backdrop-filter: blur(10px);
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
}

.panel-d.open ~ .panel-d-close,
.panel-d.open + .panel-d-close {
  opacity: 1;
  visibility: visible;
}

.panel-d-close:hover {
  background: rgba(239,68,68,0.15);
  border-color: rgba(239,68,68,0.3);
  color: var(--red);
}

/* ─── Info Tag ─── */
.scheme-info {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 10px 24px;
  background: rgba(15, 18, 25, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  color: var(--text-dim);
  text-align: center;
  white-space: nowrap;
  transition: all 0.3s ease;
}

.scheme-info strong {
  color: var(--primary);
  font-weight: 700;
}

/* ─── Animations ─── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="bg-scene">
  <div class="bg-grid"></div>
</div>

<!-- Scheme Switcher -->
<div class="switcher">
  <div class="switcher-label"><i class="fas fa-layer-group"></i>方案</div>
  <button class="active" onclick="switchScheme('a')">A</button>
  <button onclick="switchScheme('b')">B</button>
  <button onclick="switchScheme('c')">C</button>
  <button onclick="switchScheme('d')">D</button>
</div>

<!-- Scheme Info -->
<div class="scheme-info" id="schemeInfo">
  <strong>方案 A</strong> — 中央浮层面板（720×520，可拖拽）
</div>

<!-- Trigger Button -->
<div class="trigger-hint">
  <button class="trigger-btn" id="triggerBtn" onclick="togglePanel()">
    <i class="fas fa-robot"></i> 打开 Agent 面板
    <span class="kbd">⌘ K</span>
  </button>
</div>

<!-- Overlay Mask -->
<div class="overlay-mask" id="overlayMask" onclick="closePanel()"></div>

<!-- ═══════════ Scheme A ═══════════ -->
<div class="scheme active" id="scheme-a">
  <div class="panel-a" id="panelA">
    <div class="panel-a-header" id="panelAHeader">
      <div class="panel-a-header-left">
        <h3><i class="fas fa-robot"></i> Agent 矩阵</h3>
        <span class="status-badge connected"><span class="dot"></span> 已连接</span>
      </div>
      <button class="close-btn" onclick="closePanel()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="panel-a-body">
      <div class="panel-a-sidebar">
        <div class="sidebar-title">快捷模板</div>
        <button class="tpl-btn"><i class="fas fa-magnifying-glass-chart" style="color:var(--primary)"></i>代码审查</button>
        <button class="tpl-btn"><i class="fas fa-code" style="color:var(--blue)"></i>功能实现</button>
        <button class="tpl-btn"><i class="fas fa-flask" style="color:var(--green)"></i>测试编写</button>
        <button class="tpl-btn"><i class="fas fa-recycle" style="color:var(--yellow)"></i>重构优化</button>
        <button class="tpl-btn"><i class="fas fa-file-lines" style="color:#a78bfa"></i>文档生成</button>
      </div>
      <div class="panel-a-content" id="panelAContent">
        <!-- Populated by JS -->
      </div>
    </div>
    <div class="panel-a-footer">
      <div class="panel-a-footer-left">
        <i class="fas fa-circle-info"></i>
        <span>3 个 Agent · 1 运行中</span>
      </div>
      <div class="panel-a-footer-right">
        <button class="new-agent-btn" onclick="toggleAContent()">
          <i class="fas fa-arrows-rotate"></i> 切换空/满
        </button>
        <button class="new-agent-btn">
          <i class="fas fa-plus"></i> 新建 Agent
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ Scheme B ═══════════ -->
<div class="scheme" id="scheme-b">
  <div class="panel-b" id="panelB">
    <div class="panel-b-search">
      <i class="fas fa-magnifying-glass"></i>
      <input type="text" placeholder="搜索 Agent 或输入命令...">
      <span class="esc-hint">ESC</span>
    </div>
    <div class="panel-b-body" id="panelBBody">
      <!-- Populated by JS -->
    </div>
  </div>
</div>

<!-- ═══════════ Scheme C ═══════════ -->
<div class="scheme" id="scheme-c">
  <div class="panel-c" id="panelC">
    <div class="panel-c-header">
      <div class="panel-c-header-left">
        <h3>Agent</h3>
        <span class="count">3</span>
        <span class="status-badge connected" style="margin-left:4px"><span class="dot"></span></span>
      </div>
      <button class="close-btn" onclick="closePanel()" style="width:28px;height:28px">
        <i class="fas fa-xmark" style="font-size:11px"></i>
      </button>
    </div>
    <div class="panel-c-tpls">
      <button class="panel-c-tpl-chip">审查</button>
      <button class="panel-c-tpl-chip">实现</button>
      <button class="panel-c-tpl-chip">测试</button>
      <button class="panel-c-tpl-chip">重构</button>
      <button class="panel-c-tpl-chip">文档</button>
    </div>
    <div class="panel-c-body" id="panelCBody">
      <!-- Populated by JS -->
    </div>
    <div class="panel-c-footer">
      <button class="new-agent-btn">
        <i class="fas fa-plus"></i> 新建 Agent
      </button>
    </div>
  </div>
</div>

<!-- ═══════════ Scheme D ═══════════ -->
<div class="scheme" id="scheme-d">
  <div class="panel-d" id="panelD">
    <div class="panel-d-header">
      <div class="panel-d-header-left">
        <h2><i class="fas fa-robot" style="margin-right:8px"></i>Agent 矩阵</h2>
        <span class="status-badge connected"><span class="dot"></span> 已连接</span>
      </div>
      <div class="panel-d-toolbar">
        <button><i class="fas fa-magnifying-glass"></i> 搜索</button>
        <button class="primary-btn"><i class="fas fa-plus"></i> 新建 Agent</button>
        <button onclick="closePanel()"><i class="fas fa-xmark"></i></button>
      </div>
    </div>
    <div class="panel-d-templates">
      <div class="panel-d-tpl"><i class="fas fa-magnifying-glass-chart" style="color:var(--primary)"></i>代码审查</div>
      <div class="panel-d-tpl"><i class="fas fa-code" style="color:var(--blue)"></i>功能实现</div>
      <div class="panel-d-tpl"><i class="fas fa-flask" style="color:var(--green)"></i>测试编写</div>
      <div class="panel-d-tpl"><i class="fas fa-recycle" style="color:var(--yellow)"></i>重构优化</div>
      <div class="panel-d-tpl"><i class="fas fa-file-lines" style="color:#a78bfa"></i>文档生成</div>
    </div>
    <div class="panel-d-grid" id="panelDGrid">
      <!-- Populated by JS -->
    </div>
  </div>
</div>

<script>
const AGENTS = [
  {
    name: '代码审查 Agent',
    icon: 'fas fa-magnifying-glass-chart',
    iconClass: 'purple',
    status: 'running',
    desc: '正在审查 cursor-bridge/src/routes/agents.ts 中的代码质量...',
    model: 'Claude Opus',
    time: '2 分钟前',
    tokens: '3.2k'
  },
  {
    name: '功能实现 Agent',
    icon: 'fas fa-code',
    iconClass: 'blue',
    status: 'idle',
    desc: '等待任务分配，上次执行了浮层面板的 CSS 优化',
    model: 'Claude Sonnet',
    time: '15 分钟前',
    tokens: '8.7k'
  },
  {
    name: '测试编写 Agent',
    icon: 'fas fa-flask',
    iconClass: 'green',
    status: 'idle',
    desc: '已完成 Agent Pool 服务的单元测试覆盖',
    model: 'GPT-4',
    time: '1 小时前',
    tokens: '12.1k'
  }
];

const TEMPLATES = [
  { name: '代码审查', icon: 'fas fa-magnifying-glass-chart', color: 'var(--primary)' },
  { name: '功能实现', icon: 'fas fa-code', color: 'var(--blue)' },
  { name: '测试编写', icon: 'fas fa-flask', color: 'var(--green)' },
  { name: '重构优化', icon: 'fas fa-recycle', color: 'var(--yellow)' },
  { name: '文档生成', icon: 'fas fa-file-lines', color: '#a78bfa' }
];

let currentScheme = 'a';
let panelOpen = false;
let showEmpty = false;

const schemeInfoMap = {
  a: '<strong>方案 A</strong> — 中央浮层面板（720×520，可拖拽）',
  b: '<strong>方案 B</strong> — 命令面板式（类 VS Code / Spotlight）',
  c: '<strong>方案 C</strong> — 分离式浮动卡片（右下角小组件）',
  d: '<strong>方案 D</strong> — 全屏接管式（Dashboard 网格）'
};

function switchScheme(scheme) {
  if (panelOpen) closePanel();

  currentScheme = scheme;

  document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.switcher button').forEach(b => {
    if (b.textContent.trim().toLowerCase() === scheme) b.classList.add('active');
  });

  document.querySelectorAll('.scheme').forEach(s => s.classList.remove('active'));
  document.getElementById('scheme-' + scheme).classList.add('active');

  document.getElementById('schemeInfo').innerHTML = schemeInfoMap[scheme];

  setTimeout(() => populateContent(), 50);
}

function togglePanel() {
  if (panelOpen) { closePanel(); return; }

  panelOpen = true;
  const mask = document.getElementById('overlayMask');

  if (currentScheme !== 'd') mask.classList.add('visible');

  const panel = document.getElementById('panel' + currentScheme.toUpperCase());
  if (panel) {
    requestAnimationFrame(() => panel.classList.add('open'));
  }
}

function closePanel() {
  panelOpen = false;
  document.getElementById('overlayMask').classList.remove('visible');

  ['A','B','C','D'].forEach(s => {
    const p = document.getElementById('panel' + s);
    if (p) p.classList.remove('open');
  });
}

function toggleAContent() {
  showEmpty = !showEmpty;
  populateContent();
}

function renderAgentCard(agent) {
  const statusLabel = { running: '运行中', idle: '空闲', error: '错误' };
  return `
    <div class="agent-card">
      <div class="agent-card-header">
        <div class="agent-card-title">
          <div class="agent-icon ${agent.iconClass}"><i class="${agent.icon}"></i></div>
          <span>${agent.name}</span>
        </div>
        <span class="agent-status-tag ${agent.status}">${statusLabel[agent.status]}</span>
      </div>
      <div class="agent-card-desc">${agent.desc}</div>
      <div class="agent-card-meta">
        <span><i class="fas fa-microchip"></i> ${agent.model}</span>
        <span><i class="fas fa-clock"></i> ${agent.time}</span>
        <span><i class="fas fa-coins"></i> ${agent.tokens}</span>
      </div>
    </div>`;
}

function populateContent() {
  populateA();
  populateB();
  populateC();
  populateD();
}

function populateA() {
  const el = document.getElementById('panelAContent');
  if (!el) return;

  if (showEmpty) {
    el.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-robot"></i>
        <h4>暂无活跃 Agent</h4>
        <p>从左侧选择一个模板快速创建，或点击底部新建按钮</p>
      </div>`;
  } else {
    el.innerHTML = AGENTS.map(renderAgentCard).join('');
  }
}

function populateB() {
  const el = document.getElementById('panelBBody');
  if (!el) return;

  if (showEmpty) {
    el.innerHTML = `
      <div class="panel-b-section-title">快捷模板</div>
      <div class="panel-b-templates">
        ${TEMPLATES.map(t => `<div class="panel-b-tpl"><i class="${t.icon}" style="color:${t.color}"></i>${t.name}</div>`).join('')}
      </div>
      <div class="panel-b-empty">
        <i class="fas fa-inbox"></i>
        <p>暂无 Agent，选择模板快速创建</p>
      </div>`;
  } else {
    const statusLabel = { running: '运行中', idle: '空闲', error: '错误' };
    el.innerHTML = `
      <div class="panel-b-section-title">快捷模板</div>
      <div class="panel-b-templates">
        ${TEMPLATES.map(t => `<div class="panel-b-tpl"><i class="${t.icon}" style="color:${t.color}"></i>${t.name}</div>`).join('')}
      </div>
      <div class="panel-b-section-title">活跃 Agent</div>
      ${AGENTS.map(a => `
        <div class="panel-b-item">
          <div class="agent-icon ${a.iconClass}"><i class="${a.icon}"></i></div>
          <div class="panel-b-item-info">
            <h4>${a.name} <span class="agent-status-tag ${a.status}">${statusLabel[a.status]}</span></h4>
            <p>${a.desc}</p>
          </div>
          <div class="panel-b-item-action"><i class="fas fa-chevron-right"></i></div>
        </div>`).join('')}`;
  }
}

function populateC() {
  const el = document.getElementById('panelCBody');
  if (!el) return;

  if (showEmpty) {
    el.innerHTML = `
      <div class="panel-c-empty">
        <i class="fas fa-cube"></i>
        <p>暂无 Agent<br>点击下方按钮创建</p>
      </div>`;
  } else {
    el.innerHTML = AGENTS.map(a => `
      <div class="mini-card">
        <div class="agent-icon ${a.iconClass}"><i class="${a.icon}"></i></div>
        <div class="mini-card-info">
          <h4>${a.name}</h4>
          <p>${a.desc}</p>
        </div>
        <div class="mini-card-status ${a.status}"></div>
      </div>`).join('');
  }
}

function populateD() {
  const el = document.getElementById('panelDGrid');
  if (!el) return;

  const statusLabel = { running: '运行中', idle: '空闲', error: '错误' };

  if (showEmpty) {
    el.innerHTML = `
      <div class="panel-d-empty-card" style="grid-column:1/-1">
        <i class="fas fa-robot"></i>
        <h4>暂无活跃 Agent</h4>
        <p>从上方选择模板快速创建一个 Agent</p>
      </div>`;
  } else {
    el.innerHTML = AGENTS.map(a => `
      <div class="panel-d-card">
        <div class="panel-d-card-header">
          <div class="panel-d-card-title">
            <div class="agent-icon ${a.iconClass}"><i class="${a.icon}"></i></div>
            <h4>${a.name}</h4>
          </div>
          <span class="agent-status-tag ${a.status}">${statusLabel[a.status]}</span>
        </div>
        <div class="panel-d-card-desc">${a.desc}</div>
        <div class="panel-d-card-footer">
          <div class="panel-d-card-meta">
            <span><i class="fas fa-microchip"></i> ${a.model}</span>
            <span><i class="fas fa-clock"></i> ${a.time}</span>
            <span><i class="fas fa-coins"></i> ${a.tokens}</span>
          </div>
          <div class="panel-d-card-actions">
            <button title="暂停"><i class="fas fa-pause"></i></button>
            <button title="删除"><i class="fas fa-trash-can"></i></button>
          </div>
        </div>
      </div>`).join('') + `
      <div class="panel-d-empty-card">
        <i class="fas fa-plus-circle"></i>
        <h4>新建 Agent</h4>
        <p>选择模板或从空白创建</p>
      </div>`;
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    togglePanel();
  }
  if (e.key === 'Escape') closePanel();
});

// Drag for Panel A
(function initDragA() {
  const header = document.getElementById('panelAHeader');
  const panel = document.getElementById('panelA');
  if (!header || !panel) return;

  let dragging = false, startX, startY, origX, origY;

  header.addEventListener('mousedown', e => {
    if (e.target.closest('.close-btn')) return;
    dragging = true;
    const rect = panel.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    origX = rect.left + rect.width / 2;
    origY = rect.top + rect.height / 2;
    panel.style.transition = 'none';
    document.body.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    panel.style.left = (origX + dx) + 'px';
    panel.style.top = (origY + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    document.body.style.cursor = '';
  });
})();

// Init
populateContent();
</script>
</body>
</html>
