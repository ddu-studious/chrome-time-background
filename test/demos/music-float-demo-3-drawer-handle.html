<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 3 - iOS 风格抽屉</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif;
    background: #0a0a12;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.demo-label {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(200,160,255,0.12); color: rgba(200,160,255,0.8);
    padding: 6px 18px; border-radius: 20px; font-size: 12px;
    border: 1px solid rgba(200,160,255,0.15); z-index: 999;
    backdrop-filter: blur(10px);
}
.demo-desc {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-size: 11px; z-index: 999;
    text-align: center; max-width: 400px; line-height: 1.5;
}

.bg-image {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    z-index: 0;
}
.bg-image::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(100,60,180,0.15), transparent 70%),
                radial-gradient(ellipse at 70% 80%, rgba(30,100,160,0.1), transparent 60%);
}

.music-island {
    position: relative; z-index: 50;
    display: flex; flex-direction: column; align-items: center;
}

.mc-strip-card {
    width: 340px;
    background: rgba(16,14,22,0.95);
    backdrop-filter: blur(60px) saturate(200%);
    border-radius: 24px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.7), inset 0 0.5px 0 rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
    z-index: 2; position: relative;
}

.mc-strip {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px; cursor: pointer;
}
.mc-cover {
    width: 44px; height: 44px; border-radius: 12px;
    overflow: hidden; flex-shrink: 0;
    background: rgba(200,160,255,0.08);
    display: flex; align-items: center; justify-content: center;
}
.mc-cover i { font-size: 16px; color: rgba(200,160,255,0.3); }
.mc-info { flex: 1; min-width: 0; }
.mc-title { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.95); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.mc-strip-controls { display: flex; gap: 4px; }
.mc-ctrl-btn {
    background: none; border: none; color: rgba(255,255,255,0.45);
    cursor: pointer; width: 28px; height: 28px; border-radius: 50%;
    font-size: 12px; display: flex; align-items: center; justify-content: center;
    transition: all .2s;
}
.mc-ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
.mc-play-btn { background: rgba(200,160,255,0.85); color: #000; font-size: 14px; width: 32px; height: 32px; }
.mc-play-btn:hover { background: rgba(200,160,255,1); transform: scale(1.05); }
.mc-progress { display: flex; align-items: center; gap: 6px; padding: 0 16px 10px; }
.mc-prg-time { font-size: 9px; color: rgba(255,255,255,0.25); min-width: 28px; text-align: center; }
.mc-prg-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.mc-prg-fill { height: 100%; width: 35%; background: linear-gradient(90deg, rgba(200,160,255,0.8), rgba(150,120,255,0.8)); border-radius: 2px; }

/* ========= 核心：抽屉式面板，带拖拽把手和弹性动画 ========= */
.mc-drawer-wrapper {
    width: 340px;
    position: relative;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.5s cubic-bezier(.32,1.25,.62,1);
}
.mc-drawer-wrapper.open {
    grid-template-rows: 1fr;
}

.mc-drawer {
    background: rgba(20,18,28,0.96);
    backdrop-filter: blur(40px) saturate(180%);
    border-radius: 0 0 24px 24px;
    border: 1px solid rgba(255,255,255,0.04);
    border-top: none;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    overflow: hidden;
    min-height: 0;
}

.mc-drawer-handle {
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0 6px; cursor: grab;
}
.mc-drawer-handle-bar {
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.12);
    transition: background .2s;
}
.mc-drawer:hover .mc-drawer-handle-bar {
    background: rgba(200,160,255,0.25);
}
.mc-drawer-handle-hint {
    font-size: 9px; color: rgba(255,255,255,0.12);
    margin-top: 4px; transition: opacity 0.3s;
}

.mc-tabs { display: flex; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.mc-tab {
    flex: 1; padding: 8px 0; text-align: center; font-size: 11px;
    color: rgba(255,255,255,0.35); cursor: pointer; border: none; background: none;
    transition: color .2s;
}
.mc-tab:hover { color: rgba(255,255,255,0.6); }
.mc-tab.active { color: rgba(200,160,255,0.95); font-weight: 500; }

.mc-content { height: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent; }
.mc-content::-webkit-scrollbar { width: 3px; }
.mc-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.mc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 14px; cursor: pointer; transition: background .12s;
}
.mc-row:hover { background: rgba(255,255,255,0.03); }
.mc-row.active { background: rgba(200,160,255,0.04); }
.mc-row-num { width: 22px; text-align: center; font-size: 10px; color: rgba(255,255,255,0.22); }
.mc-row.active .mc-row-num { color: rgba(200,160,255,0.7); }
.mc-row-info { flex: 1; min-width: 0; }
.mc-row-title { font-size: 12px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-row.active .mc-row-title { color: rgba(200,160,255,0.95); font-weight: 500; }
.mc-row-artist { font-size: 10px; color: rgba(255,255,255,0.25); }

.mc-modes {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 16px 12px;
    border-top: 1px solid rgba(255,255,255,0.04);
}
.mc-mode-btn {
    background: none; border: none; color: rgba(255,255,255,0.2);
    cursor: pointer; font-size: 12px; padding: 3px; transition: all .2s;
}
.mc-mode-btn:hover { color: rgba(255,255,255,0.5); }
.mc-mode-btn.active { color: rgba(200,160,255,0.9); }
.mc-mode-divider { width: 1px; height: 12px; background: rgba(255,255,255,0.06); }
.mc-mode-label { font-size: 9px; color: rgba(255,255,255,0.15); }

/* 展开指示箭头 */
.mc-expand-hint {
    position: absolute;
    bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 8px; color: rgba(255,255,255,0.12);
    transition: all 0.3s;
    pointer-events: none;
}
.mc-strip-card:hover .mc-expand-hint { color: rgba(200,160,255,0.3); }
.expanded .mc-expand-hint { transform: translateX(-50%) rotate(180deg); }
</style>
</head>
<body>
<div class="demo-label">Demo 3 - iOS 风格抽屉推出</div>
<div class="demo-desc">内容区域像抽屉一样从播放条底部推出<br>带弹性 spring 动画和拖拽把手指示器，视觉上如同一体</div>
<div class="bg-image"></div>

<div class="music-island">
    <div class="mc-strip-card" id="strip-card">
        <div class="mc-strip" id="mc-strip">
            <div class="mc-cover"><i class="fas fa-music"></i></div>
            <div class="mc-info">
                <div class="mc-title">星河万里</div>
                <div class="mc-sub">Rom邢锐</div>
            </div>
            <div class="mc-strip-controls">
                <button class="mc-ctrl-btn"><i class="fas fa-step-backward"></i></button>
                <button class="mc-ctrl-btn mc-play-btn"><i class="fas fa-play"></i></button>
                <button class="mc-ctrl-btn"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>
        <div class="mc-progress">
            <span class="mc-prg-time">0:54</span>
            <div class="mc-prg-bar"><div class="mc-prg-fill"></div></div>
            <span class="mc-prg-time">3:32</span>
        </div>
        <div class="mc-expand-hint"><i class="fas fa-chevron-down"></i></div>
    </div>

    <div class="mc-drawer-wrapper">
        <div class="mc-drawer" id="drawer">
            <div class="mc-drawer-handle">
                <div class="mc-drawer-handle-bar"></div>
                <div class="mc-drawer-handle-hint">拖拽展开</div>
            </div>
            <div class="mc-tabs">
                <button class="mc-tab active">队列</button>
                <button class="mc-tab">歌单</button>
                <button class="mc-tab">歌词</button>
                <button class="mc-tab">发现</button>
                <button class="mc-tab">搜索</button>
            </div>
            <div class="mc-content">
                <div class="mc-row active">
                    <div class="mc-row-num">1</div>
                    <div class="mc-row-info"><div class="mc-row-title">星河万里</div><div class="mc-row-artist">Rom邢锐</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">2</div>
                    <div class="mc-row-info"><div class="mc-row-title">触不可及</div><div class="mc-row-artist">周深</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">3</div>
                    <div class="mc-row-info"><div class="mc-row-title">向往</div><div class="mc-row-artist">李健</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">4</div>
                    <div class="mc-row-info"><div class="mc-row-title">桃花诺</div><div class="mc-row-artist">G.E.M.邓紫棋</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">5</div>
                    <div class="mc-row-info"><div class="mc-row-title">你说</div><div class="mc-row-artist">林俊杰</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">6</div>
                    <div class="mc-row-info"><div class="mc-row-title">平凡之路</div><div class="mc-row-artist">朴树</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">7</div>
                    <div class="mc-row-info"><div class="mc-row-title">起风了</div><div class="mc-row-artist">买辣椒也用券</div></div>
                </div>
                <div class="mc-row">
                    <div class="mc-row-num">8</div>
                    <div class="mc-row-info"><div class="mc-row-title">光年之外</div><div class="mc-row-artist">G.E.M.邓紫棋</div></div>
                </div>
            </div>
            <div class="mc-modes">
                <button class="mc-mode-btn"><i class="fas fa-arrow-right"></i></button>
                <button class="mc-mode-btn active"><i class="fas fa-redo"></i></button>
                <button class="mc-mode-btn"><i class="fas fa-redo-alt"></i></button>
                <button class="mc-mode-btn"><i class="fas fa-random"></i></button>
                <div class="mc-mode-divider"></div>
                <span class="mc-mode-label">顺序播放</span>
                <div class="mc-mode-divider"></div>
                <button class="mc-mode-btn"><i class="fas fa-volume-up"></i></button>
                <div class="mc-mode-divider"></div>
                <button class="mc-mode-btn" style="color:rgba(255,100,100,0.4)"><i class="fas fa-times-circle"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
const strip = document.getElementById('mc-strip');
const drawer = document.getElementById('drawer');
const card = document.getElementById('strip-card');
let expanded = false;

const wrapper = drawer.parentElement;
strip.addEventListener('click', () => {
    expanded = !expanded;
    wrapper.classList.toggle('open', expanded);
    card.classList.toggle('expanded', expanded);
});
</script>
</body>
</html>
