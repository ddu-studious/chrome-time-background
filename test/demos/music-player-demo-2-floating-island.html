<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器 Demo 2 - 灵动岛浮窗</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920') center/cover no-repeat fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff;
        }
        body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 0; }
        .scene { position: relative; z-index: 1; text-align: center; }
        .time { font-size: 72px; font-weight: 200; letter-spacing: 4px; text-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .date { font-size: 16px; opacity: 0.7; margin-top: 4px; }
        .demo-label {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 20px;
            font-size: 13px; z-index: 10; backdrop-filter: blur(10px);
        }

        /* === 灵动岛浮窗 === */
        .music-island {
            display: flex; justify-content: center;
            margin-top: 24px;
        }
        .island-inner {
            display: flex; align-items: center;
            gap: 0; padding: 0;
            border-radius: 28px;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
            overflow: hidden;
            min-width: 180px;
            max-width: 380px;
            height: 52px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            animation: island-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes island-pop {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }
        .island-inner:hover {
            min-width: 360px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .island-cover {
            width: 52px; height: 52px;
            flex-shrink: 0; position: relative;
            overflow: hidden;
        }
        .island-cover img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .island-cover::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent 60%, rgba(10,10,10,0.75) 100%);
        }
        .island-info {
            flex: 1; min-width: 0;
            padding: 0 12px;
            opacity: 0;
            transition: opacity 0.3s 0.1s;
        }
        .island-inner:hover .island-info { opacity: 1; }
        .island-title {
            font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,0.9);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .island-artist {
            font-size: 10px; color: rgba(255,255,255,0.45);
            margin-top: 1px;
        }
        .island-controls {
            display: flex; align-items: center; gap: 2px;
            padding-right: 10px;
        }
        .island-btn {
            width: 28px; height: 28px; border: none; border-radius: 50%;
            background: transparent; color: rgba(255,255,255,0.6);
            cursor: pointer; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .island-btn:hover { color: #fff; }
        .island-btn-play {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.12);
            color: #fff; font-size: 11px;
        }
        .island-btn-play:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.08);
        }
        .island-wave {
            display: flex; align-items: center; gap: 2px;
            padding: 0 8px;
        }
        .island-wave span {
            display: block; width: 2px;
            background: #1ed760; border-radius: 2px;
            animation: wave-bar 0.8s ease-in-out infinite alternate;
        }
        .island-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .island-wave span:nth-child(2) { height: 14px; animation-delay: 0.15s; }
        .island-wave span:nth-child(3) { height: 10px; animation-delay: 0.3s; }
        .island-wave span:nth-child(4) { height: 16px; animation-delay: 0.45s; }
        .island-wave.paused span { animation-play-state: paused; height: 4px !important; }
        @keyframes wave-bar {
            0% { height: 4px; }
            100% { height: 18px; }
        }
    </style>
</head>
<body>
    <div class="demo-label">Demo 2：灵动岛浮窗 (Dynamic Island)</div>
    <div class="scene">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date"></div>
        <div class="music-island">
            <div class="island-inner">
                <div class="island-cover">
                    <img src="https://picsum.photos/80" alt="" crossorigin="anonymous">
                </div>
                <div class="island-wave" id="island-wave">
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="island-info">
                    <div class="island-title">夜曲</div>
                    <div class="island-artist">周杰伦</div>
                </div>
                <div class="island-controls">
                    <button class="island-btn"><i class="fas fa-step-backward"></i></button>
                    <button class="island-btn island-btn-play" id="play-btn"><i class="fas fa-pause" id="play-icon"></i></button>
                    <button class="island-btn"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
            document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
        }
        setInterval(updateTime, 1000); updateTime();
        let playing = true;
        document.getElementById('play-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            playing = !playing;
            document.getElementById('play-icon').className = playing ? 'fas fa-pause' : 'fas fa-play';
            document.getElementById('island-wave').classList.toggle('paused', !playing);
        });
    </script>
</body>
</html>
