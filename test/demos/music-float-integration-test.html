<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集成测试 - 抽屉式音乐面板</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif;
    background: #0a0a12;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.demo-label {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(80,200,120,0.12); color: rgba(80,200,120,0.8);
    padding: 6px 18px; border-radius: 20px; font-size: 12px;
    border: 1px solid rgba(80,200,120,0.15); z-index: 999;
}
.demo-desc {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-size: 11px; z-index: 999;
    text-align: center; max-width: 500px; line-height: 1.5;
}
.bg-image {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    z-index: 0;
}
.bg-image::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(100,60,180,0.15), transparent 70%),
                radial-gradient(ellipse at 70% 80%, rgba(30,100,160,0.1), transparent 60%);
}
</style>
</head>
<body>
<div class="demo-label">集成测试 - 使用实际 style.css 的抽屉效果</div>
<div class="demo-desc">这个测试使用了项目实际的 css/style.css 样式<br>验证改造后的抽屉式展开效果是否正确</div>
<div class="bg-image"></div>

<div class="music-island" id="music-island" style="z-index: 50; position: relative;">
    <div class="mc-panel" id="mc-panel">
        <div class="mc-strip" id="mc-strip">
            <div class="mc-cover" id="mc-cover">
                <i class="fas fa-music mc-cover-placeholder"></i>
            </div>
            <div class="mc-info">
                <div class="mc-title" id="mc-title">星河万里</div>
                <div class="mc-sub" id="mc-sub">Rom邢锐</div>
            </div>
            <div class="mc-strip-controls">
                <button class="mc-ctrl-btn" id="mc-prev"><i class="fas fa-step-backward"></i></button>
                <button class="mc-ctrl-btn mc-play-btn" id="mc-play"><i class="fas fa-play" id="mc-play-icon"></i></button>
                <button class="mc-ctrl-btn" id="mc-next"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>
        <div class="mc-progress" id="mc-progress">
            <span class="mc-prg-time" id="mc-time-cur">0:54</span>
            <div class="mc-prg-bar" id="mc-prg-bar">
                <div class="mc-prg-fill" id="mc-prg-fill" style="width: 35%"></div>
            </div>
            <span class="mc-prg-time" id="mc-time-total">3:32</span>
        </div>
        <div class="mc-drawer-wrapper" id="mc-drawer-wrapper">
          <div class="mc-drawer-inner">
            <div class="mc-drawer-handle"><div class="mc-drawer-handle-bar"></div></div>
            <div class="mc-tabs" id="mc-tabs">
                <button class="mc-tab active" data-mc-tab="queue">队列</button>
                <button class="mc-tab" data-mc-tab="playlists">歌单</button>
                <button class="mc-tab" data-mc-tab="lyrics">歌词</button>
                <button class="mc-tab" data-mc-tab="discover">发现</button>
                <button class="mc-tab" data-mc-tab="search">搜索</button>
                <div class="mc-tab-indicator" id="mc-tab-indicator"></div>
            </div>
            <div class="mc-content" id="mc-content">
                <div class="mc-pane active" data-mc-pane="queue" id="mc-pane-queue">
                    <div class="mc-row mc-row-active">
                        <div class="mc-row-num">1</div>
                        <div class="mc-row-info"><div class="mc-row-title">星河万里</div><div class="mc-row-artist">Rom邢锐</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">2</div>
                        <div class="mc-row-info"><div class="mc-row-title">触不可及</div><div class="mc-row-artist">周深</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">3</div>
                        <div class="mc-row-info"><div class="mc-row-title">向往</div><div class="mc-row-artist">李健</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">4</div>
                        <div class="mc-row-info"><div class="mc-row-title">桃花诺</div><div class="mc-row-artist">G.E.M.邓紫棋</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">5</div>
                        <div class="mc-row-info"><div class="mc-row-title">你说</div><div class="mc-row-artist">林俊杰</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">6</div>
                        <div class="mc-row-info"><div class="mc-row-title">平凡之路</div><div class="mc-row-artist">朴树</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">7</div>
                        <div class="mc-row-info"><div class="mc-row-title">起风了</div><div class="mc-row-artist">买辣椒也用券</div></div>
                    </div>
                    <div class="mc-row">
                        <div class="mc-row-num">8</div>
                        <div class="mc-row-info"><div class="mc-row-title">光年之外</div><div class="mc-row-artist">G.E.M.邓紫棋</div></div>
                    </div>
                </div>
            </div>
            <div class="mc-modes" id="mc-modes">
                <button class="mc-mode-btn" data-mode="sequence"><i class="fas fa-arrow-right"></i></button>
                <button class="mc-mode-btn active" data-mode="loop"><i class="fas fa-redo"></i></button>
                <button class="mc-mode-btn" data-mode="single"><i class="fas fa-redo-alt"></i></button>
                <button class="mc-mode-btn" data-mode="shuffle"><i class="fas fa-random"></i></button>
                <div class="mc-mode-divider"></div>
                <span class="mc-mode-label" id="mc-mode-label">顺序播放</span>
                <div class="mc-mode-divider"></div>
                <button class="mc-ctrl-btn mc-vol-toggle" id="mc-vol-toggle"><i class="fas fa-volume-up"></i></button>
                <div class="mc-mode-divider"></div>
                <button class="mc-ctrl-btn mc-disconnect" id="mc-disconnect"><i class="fas fa-times-circle"></i></button>
            </div>
          </div>
        </div>
    </div>
</div>

<script>
const strip = document.getElementById('mc-strip');
const panel = document.getElementById('mc-panel');
let expanded = false;

strip.addEventListener('click', (e) => {
    if (e.target.closest('.mc-ctrl-btn')) return;
    expanded = !expanded;
    panel.classList.toggle('mc-panel-expanded', expanded);
    if (expanded) {
        requestAnimationFrame(() => updateTabIndicator());
        setTimeout(() => updateTabIndicator(), 120);
    }
});

function updateTabIndicator() {
    const active = document.querySelector('#mc-tabs .mc-tab.active');
    const indicator = document.querySelector('#mc-tab-indicator');
    if (active && indicator) {
        indicator.style.left = active.offsetLeft + 'px';
        indicator.style.width = active.offsetWidth + 'px';
    }
}

document.querySelectorAll('#mc-tabs .mc-tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('#mc-tabs .mc-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        updateTabIndicator();
    });
});
</script>
</body>
</html>
