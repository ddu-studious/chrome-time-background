<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>背景特效 Demo 1 — 粒子物理场 + 天气联动</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0e1a;
  overflow: hidden;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  color: #fff;
}
canvas { position: fixed; inset: 0; z-index: 0; }
.controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
  padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
}
.controls button {
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  background: rgba(255,255,255,0.05); color: #ccc; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.controls button:hover { background: rgba(255,255,255,0.12); color: #fff; }
.controls button.active { background: rgba(79,195,247,0.25); border-color: #4fc3f7; color: #4fc3f7; }
.info {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  font-size: 12px; opacity: 0.5; line-height: 1.8;
}
.info h2 { font-size: 16px; opacity: 1; margin-bottom: 6px; }
.fps { position: fixed; top: 20px; right: 20px; font-size: 11px; opacity: 0.4; z-index: 10; }
.slider-group {
  display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px;
}
.slider-group input[type="range"] {
  width: 80px; height: 3px; accent-color: #4fc3f7;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="info">
  <h2>粒子物理场</h2>
  <div>鼠标移动：粒子视差偏移</div>
  <div>鼠标静止：粒子自然漂浮</div>
  <div>切换天气：改变粒子行为</div>
</div>
<div class="fps" id="fps">60 FPS</div>

<div class="controls">
  <button class="active" data-weather="clear">☀️ 晴天</button>
  <button data-weather="rain">🌧️ 雨天</button>
  <button data-weather="snow">❄️ 雪天</button>
  <button data-weather="night">🌙 夜晚</button>
  <div class="slider-group">
    <span>密度</span>
    <input type="range" id="density" min="20" max="200" value="80">
  </div>
  <div class="slider-group">
    <span>连线</span>
    <input type="range" id="connectDist" min="0" max="200" value="100">
  </div>
  <div class="slider-group">
    <span>速度</span>
    <input type="range" id="speed" min="1" max="20" value="5">
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, active: false };
document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
document.addEventListener('mouseleave', () => { mouse.active = false; });

let config = {
  weather: 'clear',
  density: 80,
  connectDist: 100,
  speed: 5,
  mouseRadius: 150,
};

const WEATHER_THEMES = {
  clear: { colors: ['#fff', '#e3f2fd', '#bbdefb'], bgGrad: ['#0a0e1a', '#1a237e'], gravity: 0, drift: 0.3 },
  rain: { colors: ['#4fc3f7', '#81d4fa', '#b3e5fc'], bgGrad: ['#0d1117', '#1b2838'], gravity: 2.5, drift: 0.1 },
  snow: { colors: ['#fff', '#e8eaf6', '#f3e5f5'], bgGrad: ['#1a1a2e', '#16213e'], gravity: 0.4, drift: 0.8 },
  night: { colors: ['#ffd54f', '#fff9c4', '#fff'], bgGrad: ['#000', '#0d1b2a'], gravity: 0, drift: 0.15 },
};

class Particle {
  constructor() { this.reset(); }
  reset() {
    const theme = WEATHER_THEMES[config.weather];
    this.x = Math.random() * W;
    this.y = config.weather === 'rain' ? -10 : Math.random() * H;
    this.baseSize = config.weather === 'rain' ? Math.random() * 1.5 + 0.5 : Math.random() * 3 + 1;
    this.size = this.baseSize;
    this.vx = (Math.random() - 0.5) * theme.drift;
    this.vy = config.weather === 'rain' ? Math.random() * 2 + 1 : (Math.random() - 0.5) * theme.drift;
    this.color = theme.colors[Math.floor(Math.random() * theme.colors.length)];
    this.opacity = Math.random() * 0.5 + 0.3;
    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.angle = config.weather === 'snow' ? Math.random() * Math.PI * 2 : 0;
    this.angSpeed = config.weather === 'snow' ? (Math.random() - 0.5) * 0.02 : 0;
  }

  update(dt) {
    const theme = WEATHER_THEMES[config.weather];
    const spd = config.speed / 10;

    this.vy += theme.gravity * 0.01 * spd;
    this.x += this.vx * spd;
    this.y += this.vy * spd;

    if (config.weather === 'snow') {
      this.angle += this.angSpeed;
      this.x += Math.sin(this.angle) * 0.3 * spd;
    }

    this.twinklePhase += this.twinkleSpeed;
    this.opacity = 0.3 + Math.sin(this.twinklePhase) * 0.2;

    if (mouse.active) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < config.mouseRadius) {
        const force = (config.mouseRadius - dist) / config.mouseRadius * 0.8;
        this.x += dx / dist * force;
        this.y += dy / dist * force;
      }
    }

    if (this.y > H + 10) { this.y = -10; this.x = Math.random() * W; }
    if (this.y < -20) { this.y = H + 10; }
    if (this.x > W + 10) this.x = -10;
    if (this.x < -10) this.x = W + 10;
  }

  draw() {
    ctx.beginPath();
    if (config.weather === 'rain') {
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x - this.vx * 2, this.y - 8);
      ctx.strokeStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.lineWidth = this.baseSize * 0.5;
      ctx.stroke();
    } else {
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

let particles = [];
function initParticles() {
  particles = Array.from({ length: config.density }, () => new Particle());
}
initParticles();

function drawConnections() {
  if (config.connectDist <= 0 || config.weather === 'rain') return;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < config.connectDist) {
        const alpha = (1 - dist / config.connectDist) * 0.15;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  if (mouse.active && config.weather !== 'rain') {
    for (const p of particles) {
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < config.mouseRadius) {
        const alpha = (1 - dist / config.mouseRadius) * 0.2;
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = `rgba(79,195,247,${alpha})`;
        ctx.lineWidth = 0.4;
        ctx.stroke();
      }
    }
  }
}

function drawBackground() {
  const theme = WEATHER_THEMES[config.weather];
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.bgGrad[0]);
  grad.addColorStop(1, theme.bgGrad[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

let lastTime = performance.now();
let frameCount = 0;
let fpsDisplay = 60;

function animate(now) {
  const dt = now - lastTime;
  lastTime = now;
  frameCount++;

  if (frameCount % 30 === 0) {
    fpsDisplay = Math.round(1000 / dt);
    document.getElementById('fps').textContent = `${fpsDisplay} FPS | ${particles.length} particles`;
  }

  drawBackground();
  drawConnections();
  for (const p of particles) {
    p.update(dt);
    p.draw();
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Controls
document.querySelectorAll('[data-weather]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-weather]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    config.weather = btn.dataset.weather;
    initParticles();
  });
});

document.getElementById('density').addEventListener('input', e => {
  config.density = +e.target.value;
  initParticles();
});
document.getElementById('connectDist').addEventListener('input', e => {
  config.connectDist = +e.target.value;
});
document.getElementById('speed').addEventListener('input', e => {
  config.speed = +e.target.value;
});
</script>
</body>
</html>
