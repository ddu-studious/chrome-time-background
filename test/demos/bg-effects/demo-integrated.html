<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>背景特效 — 集成测试（全部 5 个效果）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #0a0e1a;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  color: #fff;
}
#background-video { display: none; }
</style>
<link rel="stylesheet" href="../../../css/bg-effects.css">
</head>
<body>

<video id="background-video"></video>
<canvas id="bg-effects-canvas" class="bgfx-canvas"></canvas>

<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;pointer-events:none;">
  <div style="font-size:64px;font-weight:100;color:rgba(255,255,255,0.8);" id="clock">22:30</div>
  <div style="font-size:13px;opacity:0.3;margin-top:8px;">背景特效集成测试 · 全部 5 个效果同时运行</div>
</div>

<div style="position:fixed;top:20px;left:20px;z-index:20;font-size:12px;opacity:0.6;line-height:2;">
  <h2 style="font-size:16px;opacity:1;margin-bottom:6px;">集成测试</h2>
  <div>✅ 粒子物理场 — 鼠标移动查看视差</div>
  <div>✅ 涟漪灵感 — 点击空白区域</div>
  <div>✅ 潮汐线 — 底部波浪动画</div>
  <div>✅ 呼吸灯 — 边缘光晕脉搏</div>
  <div>✅ 星座连线 — 鼠标靠近星点连线，点击查看星座名</div>
</div>

<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);padding:14px 20px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);">
  <button id="toggleParticles" class="ctrl-btn active">✨ 粒子</button>
  <button id="toggleRipple" class="ctrl-btn active">🌊 涟漪</button>
  <button id="toggleTide" class="ctrl-btn active">🌊 潮汐</button>
  <button id="toggleBreath" class="ctrl-btn active">💫 呼吸灯</button>
  <button id="toggleConstellation" class="ctrl-btn active">⭐ 星座</button>
  <button id="resetAll" class="ctrl-btn" style="border-color:rgba(255,183,77,0.4);color:#ffb74d;">🔄 重置全部</button>
</div>

<style>
.ctrl-btn {
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  background: rgba(255,255,255,0.05); color: #ccc; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
.ctrl-btn.active { background: rgba(99,179,237,0.25); border-color: #63b3ed; color: #63b3ed; }
</style>

<script>
// Chrome API shim for standalone testing
if (typeof chrome === 'undefined' || !chrome.storage) {
  window.chrome = {
    storage: {
      local: {
        _data: {},
        get(key, cb) { cb(this._data); },
        set(data, cb) { Object.assign(this._data, data); cb?.(); },
      },
      sync: {
        _data: {},
        get(key, cb) { cb(this._data); },
        set(data, cb) { Object.assign(this._data, data); cb?.(); },
      },
      onChanged: { addListener() {} },
    },
    runtime: { getURL(p) { return p; }, sendMessage() {} },
  };
}
</script>
<script src="../../../js/bg-effects.js"></script>
<script>
(async () => {
  await window.bgEffectsManager.init();

  // 默认全部开启
  window.bgEffectsManager.setActiveEffects(['particles', 'ripple', 'tide', 'breath', 'constellation']);

  // 时钟
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // 控制按钮
  const effects = ['particles', 'ripple', 'tide', 'breath', 'constellation'];
  const ids = ['toggleParticles', 'toggleRipple', 'toggleTide', 'toggleBreath', 'toggleConstellation'];

  ids.forEach((id, i) => {
    document.getElementById(id).addEventListener('click', function() {
      this.classList.toggle('active');
      const active = ids
        .map((id2, j) => document.getElementById(id2).classList.contains('active') ? effects[j] : null)
        .filter(Boolean);
      window.bgEffectsManager.setActiveEffects(active);
    });
  });

  document.getElementById('resetAll').addEventListener('click', () => {
    window.bgEffectsManager.destroy();
    setTimeout(async () => {
      await window.bgEffectsManager.init();
      window.bgEffectsManager.setActiveEffects(['particles', 'ripple', 'tide', 'breath', 'constellation']);
      ids.forEach(id => document.getElementById(id).classList.add('active'));
    }, 100);
  });
})();
</script>
</body>
</html>
