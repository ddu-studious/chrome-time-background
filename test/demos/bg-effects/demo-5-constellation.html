<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>背景特效 Demo 5 — 星座连线</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(ellipse at 50% 50%, #0d1b2a, #000);
  overflow: hidden;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  color: #fff;
  height: 100vh;
}
canvas { position: fixed; inset: 0; z-index: 1; }
.center-content {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; z-index: 2; pointer-events: none;
}
.center-content .time {
  font-size: 64px; font-weight: 100; letter-spacing: -1px;
  color: rgba(255,255,255,0.8);
}
.center-content .subtitle {
  font-size: 13px; opacity: 0.3; margin-top: 8px;
}
.info {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  font-size: 12px; opacity: 0.5; line-height: 1.8;
}
.info h2 { font-size: 16px; opacity: 1; margin-bottom: 6px; }
.controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
  padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
}
.controls button {
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  background: rgba(255,255,255,0.05); color: #ccc; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.controls button:hover { background: rgba(255,255,255,0.12); color: #fff; }
.controls button.active { background: rgba(99,179,237,0.25); border-color: #63b3ed; color: #63b3ed; }
.slider-group { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; }
.slider-group input[type="range"] { width: 80px; height: 3px; accent-color: #63b3ed; }
.stats {
  position: fixed; top: 20px; right: 20px; z-index: 10;
  font-size: 11px; opacity: 0.4; text-align: right; line-height: 1.8;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="center-content">
  <div class="time" id="clock">22:14</div>
  <div class="subtitle">星辰为你指路</div>
</div>

<div class="info">
  <h2>星座连线</h2>
  <div>固定星点，鼠标靠近时自动连线</div>
  <div>鼠标作为移动节点参与网络</div>
  <div>星点有微弱闪烁动画</div>
</div>

<div class="stats" id="stats">
  <div>星点: <span id="starCountDisplay">30</span></div>
  <div>连线: <span id="lineCount">0</span></div>
  <div>激活: <span id="activeCount">0</span></div>
</div>

<div class="controls">
  <button class="active" id="toggleMouse">🖱️ 鼠标节点: ON</button>
  <button id="toggleTwinkle">✨ 闪烁: ON</button>
  <button id="regenerate">🔄 重新生成</button>
  <div class="slider-group">
    <span>星点数</span>
    <input type="range" id="starCount" min="10" max="80" value="35">
  </div>
  <div class="slider-group">
    <span>连线距离</span>
    <input type="range" id="connectDist" min="60" max="250" value="130">
  </div>
  <div class="slider-group">
    <span>鼠标半径</span>
    <input type="range" id="mouseRadius" min="80" max="400" value="180">
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateStars();
}

const mouse = { x: -999, y: -999 };
document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

let config = {
  starCount: 35,
  connectDistance: 130,
  mouseRadius: 180,
  mouseAsNode: true,
  twinkle: true,
};

class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.baseSize = Math.random() * 2 + 1;
    this.size = this.baseSize;
    this.opacity = Math.random() * 0.4 + 0.3;
    this.baseOpacity = this.opacity;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.twinkleSpeed = Math.random() * 0.03 + 0.01;
    this.activated = 0;
    this.color = Math.random() > 0.7 ? '#a8dadc' : Math.random() > 0.5 ? '#e0e0e0' : '#bbb';
  }

  update(time) {
    if (config.twinkle) {
      this.twinklePhase += this.twinkleSpeed;
      this.opacity = this.baseOpacity + Math.sin(this.twinklePhase) * 0.15;
    }

    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < config.mouseRadius) {
      this.activated = Math.min(1, this.activated + 0.05);
      this.size = this.baseSize + this.activated * 2;
    } else {
      this.activated = Math.max(0, this.activated - 0.02);
      this.size = this.baseSize + this.activated * 2;
    }
  }

  draw() {
    const glow = this.activated * 8;
    if (glow > 0) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size + glow, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(99, 179, 237, ${this.activated * 0.1})`;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.opacity + this.activated * 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let stars = [];

function generateStars() {
  stars = Array.from({ length: config.starCount }, () => new Star());
}

function drawConnections() {
  let lineCounter = 0;
  let activeCounter = 0;

  for (let i = 0; i < stars.length; i++) {
    if (stars[i].activated < 0.05) continue;
    activeCounter++;

    for (let j = i + 1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x;
      const dy = stars[i].y - stars[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < config.connectDistance) {
        const alpha = (1 - dist / config.connectDistance) * Math.min(stars[i].activated, stars[j].activated) * 0.6;
        if (alpha < 0.01) continue;

        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.strokeStyle = `rgba(99, 179, 237, ${alpha})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
        lineCounter++;
      }
    }

    if (config.mouseAsNode && mouse.x > 0) {
      const dx = stars[i].x - mouse.x;
      const dy = stars[i].y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < config.mouseRadius) {
        const alpha = (1 - dist / config.mouseRadius) * 0.4;
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(stars[i].x, stars[i].y);

        const grad = ctx.createLinearGradient(mouse.x, mouse.y, stars[i].x, stars[i].y);
        grad.addColorStop(0, `rgba(99, 179, 237, ${alpha})`);
        grad.addColorStop(1, `rgba(99, 179, 237, ${alpha * 0.3})`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 0.6;
        ctx.stroke();
        lineCounter++;
      }
    }
  }

  if (config.mouseAsNode && mouse.x > 0) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(99, 179, 237, 0.6)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(99, 179, 237, 0.1)';
    ctx.fill();
  }

  document.getElementById('lineCount').textContent = lineCounter;
  document.getElementById('activeCount').textContent = activeCounter;
}

function animate(time) {
  ctx.clearRect(0, 0, W, H);

  for (const star of stars) {
    star.update(time);
  }

  drawConnections();

  for (const star of stars) {
    star.draw();
  }

  requestAnimationFrame(animate);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(animate);

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateClock();
setInterval(updateClock, 30000);

// Controls
document.getElementById('toggleMouse').addEventListener('click', function() {
  config.mouseAsNode = !config.mouseAsNode;
  this.textContent = `🖱️ 鼠标节点: ${config.mouseAsNode ? 'ON' : 'OFF'}`;
  this.classList.toggle('active', config.mouseAsNode);
});

document.getElementById('toggleTwinkle').addEventListener('click', function() {
  config.twinkle = !config.twinkle;
  this.textContent = `✨ 闪烁: ${config.twinkle ? 'ON' : 'OFF'}`;
  this.classList.toggle('active', config.twinkle);
});
document.getElementById('toggleTwinkle').classList.add('active');

document.getElementById('regenerate').addEventListener('click', () => { generateStars(); });

document.getElementById('starCount').addEventListener('input', e => {
  config.starCount = +e.target.value;
  document.getElementById('starCountDisplay').textContent = config.starCount;
  generateStars();
});
document.getElementById('connectDist').addEventListener('input', e => { config.connectDistance = +e.target.value; });
document.getElementById('mouseRadius').addEventListener('input', e => { config.mouseRadius = +e.target.value; });
</script>
</body>
</html>
