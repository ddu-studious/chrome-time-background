<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>背景特效 Demo 2 — 涟漪交互 + 灵感推送</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  overflow: hidden;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  color: #fff;
  height: 100vh;
  cursor: crosshair;
}
.bg-image {
  position: fixed; inset: 0; z-index: 0;
  background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80') center/cover;
  opacity: 0.3;
}
canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.click-layer { position: fixed; inset: 0; z-index: 2; }
.insight {
  position: fixed; z-index: 3;
  font-size: 15px; color: rgba(255,255,255,0.9);
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  pointer-events: none; white-space: nowrap;
  opacity: 0; transform: translateY(10px) scale(0.95);
  transition: opacity 0.6s ease, transform 0.6s ease;
  font-style: italic; letter-spacing: 0.5px;
}
.insight.show {
  opacity: 1; transform: translateY(0) scale(1);
}
.insight.fade {
  opacity: 0; transform: translateY(-10px) scale(0.98);
  transition: opacity 1s ease, transform 1s ease;
}
.info {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  font-size: 12px; opacity: 0.5; line-height: 1.8;
}
.info h2 { font-size: 16px; opacity: 1; margin-bottom: 6px; }
.controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 8px;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
  padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
}
.controls button {
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  background: rgba(255,255,255,0.05); color: #ccc; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.controls button:hover { background: rgba(255,255,255,0.12); color: #fff; }
.controls button.active { background: rgba(147,51,234,0.25); border-color: #a78bfa; color: #a78bfa; }
.slider-group { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; }
.slider-group input[type="range"] { width: 80px; height: 3px; accent-color: #a78bfa; }
</style>
</head>
<body>
<div class="bg-image"></div>
<canvas id="canvas"></canvas>
<div class="click-layer" id="clickLayer"></div>

<div class="info">
  <h2>涟漪交互 + 灵感推送</h2>
  <div>点击背景任意位置产生涟漪</div>
  <div>涟漪中心浮现灵感文案</div>
  <div>最多同时 3 个涟漪</div>
</div>

<div class="controls">
  <button class="active" data-source="poetry">📜 诗词</button>
  <button data-source="quotes">💬 名言</button>
  <button data-source="tasks">✅ 待办</button>
  <div class="slider-group">
    <span>涟漪大小</span>
    <input type="range" id="rippleSize" min="100" max="500" value="250">
  </div>
  <div class="slider-group">
    <span>持续时间</span>
    <input type="range" id="duration" min="1000" max="5000" value="2500">
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const clickLayer = document.getElementById('clickLayer');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const INSIGHTS = {
  poetry: [
    '落霞与孤鹜齐飞，秋水共长天一色',
    '大漠孤烟直，长河落日圆',
    '人生若只如初见，何事秋风悲画扇',
    '采菊东篱下，悠然见南山',
    '但愿人长久，千里共婵娟',
    '山有木兮木有枝，心悦君兮君不知',
    '人生得意须尽欢，莫使金樽空对月',
    '海内存知己，天涯若比邻',
  ],
  quotes: [
    'Stay hungry, stay foolish. — Steve Jobs',
    '生活就是解决一个又一个问题的过程',
    'The only way to do great work is to love what you do.',
    '不积跬步，无以至千里',
    'Think different.',
    '知行合一',
    'Move fast and break things.',
    '大道至简',
  ],
  tasks: [
    '今日还有 3 个任务待完成',
    '别忘了 14:00 的会议',
    '写作目标：今日 500 字',
    '代码审查还差 2 个 PR',
    '记得喝水休息一下',
    '本周周报还没写哦',
  ],
};

let config = {
  source: 'poetry',
  maxRippleSize: 250,
  duration: 2500,
  maxActive: 3,
};

let activeRipples = [];
let insightEls = [];

class Ripple {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.startTime = performance.now();
    this.maxRadius = config.maxRippleSize;
    this.duration = config.duration;
    this.rings = [0, 0.3, 0.6];
  }

  get progress() {
    return Math.min(1, (performance.now() - this.startTime) / this.duration);
  }

  get alive() {
    return this.progress < 1;
  }

  draw() {
    const p = this.progress;
    for (const offset of this.rings) {
      const ringP = Math.max(0, Math.min(1, (p - offset * 0.3) / (1 - offset * 0.3)));
      if (ringP <= 0) continue;

      const radius = ringP * this.maxRadius;
      const alpha = (1 - ringP) * 0.4;

      ctx.beginPath();
      ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(167, 139, 250, ${alpha})`;
      ctx.lineWidth = 2 - ringP * 1.5;
      ctx.stroke();

      if (ringP < 0.5) {
        const glowAlpha = (1 - ringP * 2) * 0.1;
        const grad = ctx.createRadialGradient(this.x, this.y, radius * 0.8, this.x, this.y, radius);
        grad.addColorStop(0, `rgba(167, 139, 250, 0)`);
        grad.addColorStop(1, `rgba(167, 139, 250, ${glowAlpha})`);
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }
  }
}

function getRandomInsight() {
  const pool = INSIGHTS[config.source] || INSIGHTS.poetry;
  return pool[Math.floor(Math.random() * pool.length)];
}

function showInsight(x, y) {
  const text = getRandomInsight();
  const el = document.createElement('div');
  el.className = 'insight';
  el.textContent = text;
  el.style.left = (x - text.length * 7) + 'px';
  el.style.top = (y - 30) + 'px';
  document.body.appendChild(el);

  requestAnimationFrame(() => el.classList.add('show'));

  setTimeout(() => {
    el.classList.remove('show');
    el.classList.add('fade');
    setTimeout(() => el.remove(), 1200);
  }, config.duration * 0.6);

  insightEls.push(el);
  if (insightEls.length > 5) {
    const old = insightEls.shift();
    old?.remove();
  }
}

let lastClickTime = 0;
clickLayer.addEventListener('click', (e) => {
  const now = Date.now();
  if (now - lastClickTime < 300) return;
  lastClickTime = now;

  if (activeRipples.length >= config.maxActive) return;

  const ripple = new Ripple(e.clientX, e.clientY);
  activeRipples.push(ripple);
  showInsight(e.clientX, e.clientY);
});

function animate() {
  ctx.clearRect(0, 0, W, H);

  activeRipples = activeRipples.filter(r => r.alive);
  for (const ripple of activeRipples) {
    ripple.draw();
  }

  requestAnimationFrame(animate);
}
animate();

// Controls
document.querySelectorAll('[data-source]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-source]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    config.source = btn.dataset.source;
  });
});
document.getElementById('rippleSize').addEventListener('input', e => { config.maxRippleSize = +e.target.value; });
document.getElementById('duration').addEventListener('input', e => { config.duration = +e.target.value; });
</script>
</body>
</html>
