<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>背景特效 Demo 3 — 潮汐线呼吸动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(180deg, #0a0e1a 0%, #1a1a2e 60%, #16213e 100%);
  overflow: hidden;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  color: #fff;
  height: 100vh;
}
.bg-content {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; z-index: 2; pointer-events: none;
}
.bg-content .time {
  font-size: 72px; font-weight: 200; letter-spacing: -2px;
  background: linear-gradient(135deg, #e0e0e0, #9e9e9e);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.bg-content .date { font-size: 14px; opacity: 0.4; margin-top: 8px; }
canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.info {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  font-size: 12px; opacity: 0.5; line-height: 1.8;
}
.info h2 { font-size: 16px; opacity: 1; margin-bottom: 6px; }
.controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
  padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
}
.controls button {
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  background: rgba(255,255,255,0.05); color: #ccc; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.controls button:hover { background: rgba(255,255,255,0.12); color: #fff; }
.controls button.active { background: rgba(38,166,154,0.25); border-color: #26a69a; color: #26a69a; }
.slider-group { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 12px; }
.slider-group input[type="range"] { width: 80px; height: 3px; accent-color: #26a69a; }
</style>
</head>
<body>
<div class="bg-content">
  <div class="time" id="clock">22:14</div>
  <div class="date" id="dateStr">2026年5月30日 星期六</div>
</div>
<canvas id="canvas"></canvas>

<div class="info">
  <h2>潮汐线呼吸动画</h2>
  <div>多层正弦波叠加产生深度感</div>
  <div>8-12 秒完成一个呼吸周期</div>
  <div>颜色/位置/层数均可配置</div>
</div>

<div class="controls">
  <button class="active" data-pos="bottom">底部</button>
  <button data-pos="top">顶部</button>
  <button data-pos="both">两侧</button>
  <button data-color="#4fc3f7">蓝色</button>
  <button data-color="#26a69a">青色</button>
  <button data-color="#ab47bc">紫色</button>
  <button data-color="#ff7043">橙色</button>
  <div class="slider-group">
    <span>振幅</span>
    <input type="range" id="amplitude" min="2" max="20" value="6">
  </div>
  <div class="slider-group">
    <span>速度</span>
    <input type="range" id="speed" min="1" max="20" value="8">
  </div>
  <div class="slider-group">
    <span>层数</span>
    <input type="range" id="layers" min="1" max="5" value="3">
  </div>
  <div class="slider-group">
    <span>透明度</span>
    <input type="range" id="opacity" min="5" max="80" value="30">
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let config = {
  position: 'bottom',
  color: '#4fc3f7',
  amplitude: 6,
  speed: 8,
  layers: 3,
  opacity: 0.3,
  height: 80,
};

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function drawWave(time, yBase, layerIndex, totalLayers, isFlipped) {
  const { r, g, b } = hexToRgb(config.color);
  const layerOpacity = config.opacity * (1 - layerIndex * 0.2);
  const freq = 0.003 + layerIndex * 0.001;
  const amp = config.amplitude * (1 - layerIndex * 0.15);
  const phase = time * config.speed * 0.0001 + layerIndex * 1.2;
  const verticalPhase = Math.sin(time * 0.0003 + layerIndex * 0.5) * amp * 0.5;

  ctx.beginPath();

  if (isFlipped) {
    ctx.moveTo(0, 0);
    for (let x = 0; x <= W; x += 3) {
      const y = yBase + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 0.5 + phase * 1.3) * amp * 0.5
        + verticalPhase;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, 0);
  } else {
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const y = yBase - Math.sin(x * freq + phase) * amp
        - Math.sin(x * freq * 0.5 + phase * 1.3) * amp * 0.5
        - verticalPhase;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
  }

  ctx.closePath();

  const grad = isFlipped
    ? ctx.createLinearGradient(0, 0, 0, yBase + config.height)
    : ctx.createLinearGradient(0, yBase - config.height, 0, H);

  grad.addColorStop(0, `rgba(${r},${g},${b},${isFlipped ? 0 : layerOpacity})`);
  grad.addColorStop(0.5, `rgba(${r},${g},${b},${layerOpacity * 0.6})`);
  grad.addColorStop(1, `rgba(${r},${g},${b},${isFlipped ? layerOpacity : 0})`);

  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  if (isFlipped) {
    for (let x = 0; x <= W; x += 3) {
      const y = yBase + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 0.5 + phase * 1.3) * amp * 0.5
        + verticalPhase;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  } else {
    for (let x = 0; x <= W; x += 3) {
      const y = yBase - Math.sin(x * freq + phase) * amp
        - Math.sin(x * freq * 0.5 + phase * 1.3) * amp * 0.5
        - verticalPhase;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  }
  ctx.strokeStyle = `rgba(${r},${g},${b},${layerOpacity * 1.5})`;
  ctx.lineWidth = 1;
  ctx.stroke();
}

function animate(time) {
  ctx.clearRect(0, 0, W, H);

  const totalLayers = config.layers;

  if (config.position === 'bottom' || config.position === 'both') {
    for (let i = totalLayers - 1; i >= 0; i--) {
      const yBase = H - config.height + i * 8;
      drawWave(time, yBase, i, totalLayers, false);
    }
  }

  if (config.position === 'top' || config.position === 'both') {
    for (let i = totalLayers - 1; i >= 0; i--) {
      const yBase = config.height - i * 8;
      drawWave(time, yBase, i, totalLayers, true);
    }
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('dateStr').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
}
updateClock();
setInterval(updateClock, 30000);

// Controls
document.querySelectorAll('[data-pos]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-pos]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    config.position = btn.dataset.pos;
  });
});
document.querySelectorAll('[data-color]').forEach(btn => {
  btn.addEventListener('click', () => { config.color = btn.dataset.color; });
});
document.getElementById('amplitude').addEventListener('input', e => { config.amplitude = +e.target.value; });
document.getElementById('speed').addEventListener('input', e => { config.speed = +e.target.value; });
document.getElementById('layers').addEventListener('input', e => { config.layers = +e.target.value; });
document.getElementById('opacity').addEventListener('input', e => { config.opacity = +e.target.value / 100; });
</script>
</body>
</html>
