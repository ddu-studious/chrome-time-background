<section class="control-panel"><p class="eyebrow">Atmosphere engine</p><h1>天气导演</h1><p>天气改变的是整张照片的光线、饱和度、空气感和运动层，而不是在图片上贴一层图标。</p><label class="control-row">氛围强度<input id="intensity" type="range" min="10" max="100"><output id="intensity-output">72%</output></label><div class="chip-row" aria-label="天气选择"><button data-weather="clear">晴光</button><button data-weather="rain" class="active">细雨</button><button data-weather="snow">落雪</button><button data-weather="storm">雷暴</button><button data-weather="night">夜色</button><button id="pause-effect">暂停效果</button></div><span class="demo-badge"><i></i> 摄影状态联动 · 光标可拨开局部雾感</span></section>
<div class="interaction-hint"><b>现在试试：</b>切换五种天气，再移动鼠标观察局部雾层。</div><script src="shared.js"></script></body></html>
