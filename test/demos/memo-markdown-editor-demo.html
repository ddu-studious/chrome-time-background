<html lang="zh-CN">

<title>备忘录 Markdown 编辑器 Demo - v2.5.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="../../vendor/highlight-theme.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0f1117;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 40px;
        min-height: 100vh;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: rgba(255,255,255,0.5); margin-bottom: 30px; font-size: 14px; }
    .demo-section { margin-bottom: 40px; }
    .demo-section h2 {
        font-size: 16px;
        color: rgba(100,180,255,0.9);
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* ====== Import the actual CSS from style.css for Markdown editor ====== */
    .hidden { display: none !important; }

    .memo-md-editor-group { display: flex; flex-direction: column; max-width: 700px; }
    .memo-md-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .memo-md-label-row label { font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 500; }
    .memo-md-mode-toggle { display: flex; gap: 2px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 2px; }
    .memo-md-mode-btn { background: transparent; border: none; color: rgba(255,255,255,0.4); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .memo-md-mode-btn:hover { color: rgba(255,255,255,0.7); }
    .memo-md-mode-btn.active { background: rgba(100,180,255,0.2); color: rgba(100,180,255,0.9); }
    .memo-md-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 6px 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-bottom: none; border-radius: 10px 10px 0 0; transition: opacity 0.2s; }
    .memo-md-toolbar.preview-mode { opacity: 0.4; pointer-events: none; }
    .memo-md-toolbar button { background: transparent; border: none; color: rgba(255,255,255,0.5); padding: 5px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: all 0.15s; line-height: 1; }
    .memo-md-toolbar button:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); }
    .memo-md-toolbar button:active { transform: scale(0.92); }
    .memo-md-toolbar-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.1); margin: 0 4px; }
    .memo-md-editor-wrap { position: relative; }
    .memo-md-editor-wrap textarea {
        width: 100%; padding: 14px 16px; border: none; border-radius: 0 0 10px 10px;
        background: rgba(255,255,255,0.08); color: #e2e8f0; min-height: 200px;
        font-family: 'SF Mono','Menlo','Consolas',monospace; font-size: 13px; line-height: 1.7; tab-size: 4; resize: vertical;
    }
    .memo-md-editor-wrap textarea:focus { background: rgba(255,255,255,0.12); outline: none; box-shadow: 0 0 0 2px rgba(100,180,255,0.25); }
    .memo-md-preview {
        padding: 14px 16px; background: rgba(255,255,255,0.08); border-radius: 0 0 10px 10px;
        min-height: 200px; max-height: 500px; overflow-y: auto; font-size: 14px; color: rgba(255,255,255,0.7);
    }

    /* Markdown body styles */
    .memo-md-body h1,.memo-md-body h2,.memo-md-body h3,.memo-md-body h4,.memo-md-body h5,.memo-md-body h6 { color: rgba(255,255,255,0.9); font-weight: 600; margin: 12px 0 6px; line-height: 1.4; }
    .memo-md-body h1 { font-size: 1.4em; } .memo-md-body h2 { font-size: 1.2em; } .memo-md-body h3 { font-size: 1.1em; }
    .memo-md-body p { margin: 6px 0; color: rgba(255,255,255,0.75); line-height: 1.8; }
    .memo-md-body strong { color: rgba(255,255,255,0.9); }
    .memo-md-body em { font-style: italic; }
    .memo-md-body del { opacity: 0.5; text-decoration: line-through; }
    .memo-md-body a { color: rgba(100,180,255,0.85); text-decoration: none; border-bottom: 1px solid rgba(100,180,255,0.3); }
    .memo-md-body a:hover { color: rgba(100,180,255,1); border-bottom-color: rgba(100,180,255,0.7); }
    .memo-md-body blockquote { border-left: 3px solid rgba(100,180,255,0.4); margin: 8px 0; padding: 6px 14px; background: rgba(100,180,255,0.06); border-radius: 0 6px 6px 0; color: rgba(255,255,255,0.6); }
    .memo-md-body ul,.memo-md-body ol { margin: 6px 0; padding-left: 20px; color: rgba(255,255,255,0.7); }
    .memo-md-body li { margin: 3px 0; }
    .memo-md-body code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono','Menlo','Consolas',monospace; font-size: 0.88em; color: rgba(255,200,80,0.9); }
    .memo-md-body pre { margin: 8px 0; border-radius: 8px; overflow-x: auto; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); }
    .memo-md-body pre code { display: block; padding: 12px 16px; background: transparent; color: rgba(255,255,255,0.8); font-size: 13px; line-height: 1.6; white-space: pre; overflow-x: auto; }
    .memo-md-body pre code.hljs { background: transparent; padding: 12px 16px; }
    .memo-md-body table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .memo-md-body th,.memo-md-body td { padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1); text-align: left; color: rgba(255,255,255,0.7); }
    .memo-md-body th { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); font-weight: 600; }
    .memo-md-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 12px 0; }
    .memo-md-body img { max-width: 100%; border-radius: 6px; margin: 6px 0; }

    /* Mermaid */
    .kw-mermaid-block { margin: 10px 0; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; }
    .kw-mermaid-rendered { text-align: center; }
    .kw-mermaid-error code { color: #ff6b6b; font-size: 12px; }

    /* Task viewer section */
    .viewer-section { margin-top: 30px; max-width: 700px; padding: 20px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
    .viewer-section h3 { font-size: 14px; margin-bottom: 12px; color: rgba(255,255,255,0.6); }
    .viewer-md-badge { display: inline-flex; align-items: center; font-size: 11px; color: rgba(100,180,255,0.6); margin-left: 6px; }
</style>
</head>
<body>

<h1>备忘录 Markdown 编辑器 Demo</h1>
<p class="subtitle">v2.5.0 — Phase 3：Markdown 语法高亮 + Mermaid 图表</p>

<div class="demo-section">
    <h2>1. Markdown 编辑器（工具栏 + 预览切换）</h2>
    <div class="memo-md-editor-group">
        <div class="memo-md-label-row">
            <label>详情</label>
            <div class="memo-md-mode-toggle">
                <button type="button" class="memo-md-mode-btn active" data-mode="edit"><i class="fas fa-edit"></i></button>
                <button type="button" class="memo-md-mode-btn" data-mode="preview"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <div class="memo-md-toolbar" id="memo-md-toolbar">
            <button type="button" data-md-action="bold" title="粗体 (Ctrl+B)"><i class="fas fa-bold"></i></button>
            <button type="button" data-md-action="italic" title="斜体 (Ctrl+I)"><i class="fas fa-italic"></i></button>
            <button type="button" data-md-action="strikethrough" title="删除线"><i class="fas fa-strikethrough"></i></button>
            <span class="memo-md-toolbar-sep"></span>
            <button type="button" data-md-action="heading" title="标题"><i class="fas fa-heading"></i></button>
            <button type="button" data-md-action="quote" title="引用"><i class="fas fa-quote-right"></i></button>
            <button type="button" data-md-action="ul" title="无序列表"><i class="fas fa-list-ul"></i></button>
            <button type="button" data-md-action="ol" title="有序列表"><i class="fas fa-list-ol"></i></button>
            <span class="memo-md-toolbar-sep"></span>
            <button type="button" data-md-action="code" title="行内代码"><i class="fas fa-code"></i></button>
            <button type="button" data-md-action="codeblock" title="代码块"><i class="fas fa-file-code"></i></button>
            <button type="button" data-md-action="link" title="链接"><i class="fas fa-link"></i></button>
            <button type="button" data-md-action="table" title="表格"><i class="fas fa-table"></i></button>
            <button type="button" data-md-action="mermaid" title="Mermaid 图表"><i class="fas fa-project-diagram"></i></button>
        </div>
        <div class="memo-md-editor-wrap">
            <textarea id="sidebar-task-text" rows="10">## 项目计划

**目标**: 完成 v2.5.0 开发

### 关键任务

1. Markdown **语法高亮** — 使用 `highlight.js`
2. Mermaid 图表渲染
3. ~~旧的纯文本模式~~

> 支持引用、代码块、表格等常用格式

### 代码示例

```javascript
const greeting = "Hello, Markdown!";
console.log(greeting);
```

### 流程图

```mermaid
graph TD
    A[编辑 Markdown] --> B{预览?}
    B -->|是| C[渲染 HTML]
    B -->|否| D[继续编辑]
    C --> E[显示结果]
```

### 表格

| 功能 | 状态 |
|------|------|
| 语法高亮 | ✅ |
| Mermaid | ✅ |
| 快捷键 | ✅ |</textarea>
            <div class="memo-md-preview memo-md-body hidden" id="memo-md-preview"></div>
        </div>
    </div>
</div>

<div class="demo-section viewer-section" id="viewer-section">
    <h3><i class="fas fa-align-left"></i> 任务详情渲染效果 <span class="viewer-md-badge"><i class="fab fa-markdown"></i></span></h3>
    <div class="memo-md-body" id="viewer-output"></div>
</div>

<script src="../../vendor/marked.min.js"></script>
<script src="../../vendor/purify.min.js"></script>
<script src="../../vendor/highlight.min.js"></script>
<script src="../../vendor/mermaid.tiny.min.js"></script>
<script>
(function() {
    // Configure marked (same as knowledge-wall)
    if (typeof marked !== 'undefined') {
        const renderer = new marked.Renderer();
        renderer.link = function({ href, title, text }) {
            const titleAttr = title ? ` title="${title}"` : '';
            return `<a href="${href}" target="_blank" rel="noopener noreferrer"${titleAttr}>${text}</a>`;
        };
        renderer.code = function({ text, lang }) {
            if (lang === 'mermaid') {
                const id = 'mermaid-' + Math.random().toString(36).slice(2, 10);
                return `<div class="kw-mermaid-block" data-mermaid-id="${id}"><pre class="mermaid">${text}</pre></div>`;
            }
            if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                const highlighted = hljs.highlight(text, { language: lang, ignoreIllegals: true }).value;
                return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
            }
            if (typeof hljs !== 'undefined') {
                const auto = hljs.highlightAuto(text).value;
                return `<pre><code class="hljs">${auto}</code></pre>`;
            }
            const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<pre><code>${escaped}</code></pre>`;
        };
        marked.setOptions({ renderer, breaks: true, gfm: true });
    }

    function renderMarkdown(text) {
        if (!text) return '';
        const raw = marked.parse(text, { breaks: true, gfm: true });
        return typeof DOMPurify !== 'undefined'
            ? DOMPurify.sanitize(raw, {
                ADD_ATTR: ['target', 'rel', 'data-mermaid-id'],
                ADD_TAGS: ['svg','g','path','line','rect','circle','text','tspan','polygon','polyline','marker','defs','style','foreignObject'],
                ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','strong','em','del','s','blockquote','ul','ol','li','a','img','code','pre','table','thead','tbody','tr','th','td','input','div','span'],
            })
            : raw;
    }

    function renderMermaid(container) {
        if (typeof mermaid === 'undefined' || !container) return;
        const blocks = container.querySelectorAll('.kw-mermaid-block[data-mermaid-id]');
        if (!blocks.length) return;
        mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { darkMode: true, background: 'transparent', primaryColor: '#3b82f6', primaryTextColor: '#e2e8f0', primaryBorderColor: '#4b5563', lineColor: '#6b7280' } });
        blocks.forEach(async block => {
            const id = block.dataset.mermaidId;
            const preEl = block.querySelector('pre.mermaid');
            if (!preEl) return;
            try {
                const { svg } = await mermaid.render(id, preEl.textContent);
                block.innerHTML = svg;
                block.classList.add('kw-mermaid-rendered');
            } catch (err) {
                block.innerHTML = `<pre class="kw-mermaid-error"><code>Mermaid 渲染失败: ${err.message}</code></pre>`;
            }
        });
    }

    const ta = document.getElementById('sidebar-task-text');
    const preview = document.getElementById('memo-md-preview');
    const toolbar = document.getElementById('memo-md-toolbar');
    const viewerOutput = document.getElementById('viewer-output');

    // Render viewer section immediately
    viewerOutput.innerHTML = renderMarkdown(ta.value);
    renderMermaid(viewerOutput);

    // Mode toggle
    document.querySelectorAll('.memo-md-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.memo-md-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.mode === 'preview') {
                ta.classList.add('hidden');
                toolbar.classList.add('preview-mode');
                preview.innerHTML = renderMarkdown(ta.value);
                preview.classList.remove('hidden');
                renderMermaid(preview);
            } else {
                ta.classList.remove('hidden');
                toolbar.classList.remove('preview-mode');
                preview.classList.add('hidden');
            }
        });
    });

    // Toolbar actions
    function applyMdAction(action) {
        const start = ta.selectionStart, end = ta.selectionEnd;
        const sel = ta.value.substring(start, end);
        const before = ta.value.substring(0, start), after = ta.value.substring(end);
        const wrap = (p, s, ph) => { const t = sel || ph; ta.value = before + p + t + s + after; ta.setSelectionRange(start+p.length, start+p.length+t.length); ta.focus(); };
        const insertLine = (p, ph) => { const needNl = before.length && !before.endsWith('\n') ? '\n' : ''; ta.value = before + needNl + p + (sel || ph) + after; ta.focus(); };
        const actions = {
            bold: () => wrap('**','**','粗体文本'), italic: () => wrap('*','*','斜体文本'), strikethrough: () => wrap('~~','~~','删除文本'),
            code: () => wrap('`','`','code'), heading: () => insertLine('## ','标题'), quote: () => insertLine('> ','引用'),
            ul: () => insertLine('- ','列表项'), ol: () => insertLine('1. ','列表项'),
            link: () => { ta.value = before + `[链接文本](https://)` + after; ta.focus(); },
            table: () => { ta.value = before + '\n| 列1 | 列2 | 列3 |\n|------|------|------|\n| 内容 | 内容 | 内容 |\n' + after; ta.focus(); },
            codeblock: () => { ta.value = before + '\n```javascript\n' + (sel || '// 代码') + '\n```\n' + after; ta.focus(); },
            mermaid: () => { ta.value = before + '\n```mermaid\n' + (sel || 'graph TD\n    A[开始] --> B[结束]') + '\n```\n' + after; ta.focus(); },
        };
        if (actions[action]) actions[action]();
        viewerOutput.innerHTML = renderMarkdown(ta.value);
        renderMermaid(viewerOutput);
    }

    toolbar.addEventListener('click', e => {
        const btn = e.target.closest('[data-md-action]');
        if (btn) applyMdAction(btn.dataset.mdAction);
    });

    ta.addEventListener('keydown', e => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key === 'b') { e.preventDefault(); applyMdAction('bold'); }
        else if (mod && e.key === 'i') { e.preventDefault(); applyMdAction('italic'); }
        else if (mod && e.key === 'k') { e.preventDefault(); applyMdAction('link'); }
    });

    // Live update viewer on typing
    ta.addEventListener('input', () => {
        viewerOutput.innerHTML = renderMarkdown(ta.value);
        renderMermaid(viewerOutput);
    });
})();
</script>
</body>
</html>
