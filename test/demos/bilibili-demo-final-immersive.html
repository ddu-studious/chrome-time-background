<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站集成 — 沉浸式面板（方案A技术 + 方案C风格）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bm-bg: #0f0f0f;
    --bm-surface: #181818;
    --bm-card: #212121;
    --bm-pink: #fb7299;
    --bm-pink-dim: rgba(251,114,153,0.12);
    --bm-blue: #00a1d6;
    --bm-text: #f1f1f1;
    --bm-text-sub: #aaa;
    --bm-text-dim: #717171;
    --bm-border: rgba(255,255,255,0.08);
    --bm-hover: rgba(255,255,255,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bm-bg);
    color: var(--bm-text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ====== Top Nav ====== */
.bn-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: var(--bm-surface);
    border-bottom: 1px solid var(--bm-border);
    flex-shrink: 0;
    z-index: 100;
}
.bn-logo {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--bm-pink);
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
    padding-right: 8px;
    border-right: 1px solid var(--bm-border);
    margin-right: 4px;
}
.bn-logo i { font-size: 20px; }
.bn-search {
    flex: 1;
    max-width: 420px;
    display: flex;
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    border: 1px solid transparent;
    transition: border-color 0.2s;
    overflow: hidden;
}
.bn-search:focus-within { border-color: var(--bm-pink); }
.bn-search input {
    flex: 1;
    background: none;
    border: none;
    color: var(--bm-text);
    font-size: 12px;
    padding: 7px 14px;
    outline: none;
}
.bn-search input::placeholder { color: var(--bm-text-dim); }
.bn-search button {
    background: var(--bm-pink);
    border: none;
    color: #fff;
    padding: 0 16px;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.15s;
}
.bn-search button:hover { opacity: 0.85; }
.bn-nav-pills {
    display: flex;
    gap: 3px;
    margin-left: auto;
}
.bn-pill {
    background: none;
    border: 1px solid var(--bm-border);
    color: var(--bm-text-sub);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
}
.bn-pill:hover { background: var(--bm-hover); color: var(--bm-text); border-color: rgba(255,255,255,0.15); }
.bn-pill.active { background: var(--bm-pink); color: #fff; border-color: var(--bm-pink); }
.bn-pill i { font-size: 10px; }
.bn-sidebar-toggle {
    background: none;
    border: 1px solid var(--bm-border);
    color: var(--bm-text-sub);
    font-size: 15px;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 6px;
}
.bn-sidebar-toggle:hover { background: var(--bm-hover); color: var(--bm-text); }
.bn-sidebar-toggle.open { color: var(--bm-pink); border-color: var(--bm-pink); }

/* ====== Main Layout ====== */
.bn-main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
}

/* ====== Player Area ====== */
.bn-player-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}
.bn-player-frame {
    flex: 1;
    background: #000;
    position: relative;
}
.bn-player-frame iframe { width: 100%; height: 100%; border: none; }
.bn-player-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 14px;
    color: var(--bm-text-dim);
}
.bn-player-empty i { font-size: 56px; opacity: 0.3; }
.bn-player-empty p { font-size: 14px; }

.bn-player-info {
    background: var(--bm-surface);
    padding: 12px 20px;
    border-top: 1px solid var(--bm-border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
}
.bn-pi-text { flex: 1; min-width: 0; }
.bn-pi-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.bn-pi-meta {
    font-size: 11px;
    color: var(--bm-text-sub);
    margin-top: 2px;
    display: flex;
    gap: 14px;
}
.bn-pi-meta span { display: flex; align-items: center; gap: 3px; }
.bn-pi-meta i { font-size: 10px; }
.bn-pi-actions { display: flex; gap: 6px; flex-shrink: 0; }
.bn-pi-btn {
    background: var(--bm-card);
    border: 1px solid var(--bm-border);
    color: var(--bm-text-sub);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
}
.bn-pi-btn:hover { background: var(--bm-hover); color: var(--bm-text); }
.bn-pi-btn i { font-size: 11px; }

/* ====== Sidebar ====== */
.bn-sidebar {
    width: 380px;
    background: var(--bm-surface);
    border-left: 1px solid var(--bm-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transform: translateX(100%);
    margin-right: -380px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.bn-sidebar.visible {
    transform: translateX(0);
    margin-right: 0;
}

.bn-stabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-bottom: 1px solid var(--bm-border);
    flex-shrink: 0;
    padding: 0 4px;
    overflow-x: auto;
}
.bn-stab {
    padding: 11px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--bm-text-sub);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
}
.bn-stab:hover { color: var(--bm-text); }
.bn-stab.active { color: var(--bm-pink); border-bottom-color: var(--bm-pink); }
.bn-stab i { font-size: 11px; }

.bn-list-info {
    padding: 8px 14px;
    font-size: 11px;
    color: var(--bm-text-dim);
    border-bottom: 1px solid var(--bm-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
}
.bn-list-info code {
    background: rgba(251,114,153,0.1);
    color: var(--bm-pink);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-family: monospace;
}

.bn-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
}
.bn-item {
    display: flex;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
}
.bn-item:hover { background: var(--bm-hover); }
.bn-item.playing { background: var(--bm-pink-dim); }
.bn-item.playing .bn-item-title { color: var(--bm-pink); }

.bn-item-cover {
    width: 120px;
    height: 68px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bm-card);
}
.bn-item-dur {
    position: absolute;
    top: 54px;
    left: 98px;
    background: rgba(0,0,0,0.78);
    color: #ddd;
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 3px;
    font-family: monospace;
}
.bn-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.bn-item-title {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.bn-item-meta {
    font-size: 11px;
    color: var(--bm-text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
}
.bn-item-meta i { font-size: 9px; }
.bn-item-progress {
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 1px;
    overflow: hidden;
}
.bn-item-progress-bar { height: 100%; background: var(--bm-pink); border-radius: 1px; }

.bn-item-badge {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
}
.bn-item-badge.free { background: #4ade80; color: #000; }
.bn-item-badge.paid { background: #f59e0b; color: #000; }

.bn-list::-webkit-scrollbar { width: 4px; }
.bn-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
.bn-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<div class="bn-topbar">
    <div class="bn-logo">
        <i class="fab fa-bilibili"></i>
        <span>哔哩哔哩</span>
    </div>
    <div class="bn-search">
        <input type="text" placeholder="搜索视频、课程、UP主..." id="searchInput">
        <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <div class="bn-nav-pills">
        <button class="bn-pill active" data-tab="popular"><i class="fas fa-fire"></i>热门</button>
        <button class="bn-pill" data-tab="history"><i class="fas fa-history"></i>历史</button>
        <button class="bn-pill" data-tab="watchlater"><i class="fas fa-clock"></i>稍后看</button>
        <button class="bn-pill" data-tab="favorite"><i class="fas fa-star"></i>收藏</button>
        <button class="bn-pill" data-tab="ranking"><i class="fas fa-trophy"></i>排行</button>
        <button class="bn-pill" data-tab="course"><i class="fas fa-graduation-cap"></i>课程</button>
    </div>
    <button class="bn-sidebar-toggle open" id="sidebarToggle" title="展开/收起列表"><i class="fas fa-columns"></i></button>
</div>

<div class="bn-main">
    <div class="bn-player-area">
        <div class="bn-player-frame" id="playerFrame">
            <div class="bn-player-empty">
                <i class="fab fa-bilibili"></i>

        <div class="bn-player-info" id="playerInfo" style="display:none">
            <div class="bn-pi-text">

                    <span><i class="fas fa-user"></i><span id="piAuthor"></span></span>

                    <span><i class="fas fa-comment-dots"></i><span id="piDanmaku"></span></span>
                </div>
            </div>
            <div class="bn-pi-actions">
                <button class="bn-pi-btn"><i class="fas fa-thumbs-up"></i>点赞</button>
                <button class="bn-pi-btn"><i class="fas fa-star"></i>收藏</button>
                <button class="bn-pi-btn"><i class="fas fa-clock"></i>稍后看</button>
            </div>
        </div>
    </div>

    <div class="bn-sidebar visible" id="sidebar">
        <div class="bn-stabs" id="sidebarTabs">
            <div class="bn-stab active" data-tab="popular"><i class="fas fa-fire"></i>热门</div>
            <div class="bn-stab" data-tab="history"><i class="fas fa-history"></i>历史</div>

            <div class="bn-stab" data-tab="favorite"><i class="fas fa-star"></i>收藏</div>
            <div class="bn-stab" data-tab="ranking"><i class="fas fa-trophy"></i>排行</div>
            <div class="bn-stab" data-tab="course"><i class="fas fa-graduation-cap"></i>课程</div>
        </div>
        <div class="bn-list-info" id="listInfo">
            <i class="fas fa-info-circle"></i>
            <span>热门视频</span>
            <code>/x/web-interface/popular</code>
        </div>
        <div class="bn-list" id="videoList"></div>
    </div>
</div>

let currentTab = 'popular';
let currentVideo = null;
let sidebarOpen = true;

function renderList(tab) {
    const data = TABS[tab];
    currentTab = tab;

    document.getElementById('listInfo').innerHTML = `<i class="fas fa-info-circle"></i><span>${data.label}${data.auth ? ' · ' + data.auth : ''}</span><code>${data.api}</code>`;

    const listEl = document.getElementById('videoList');
    listEl.innerHTML = data.items.map((v, i) => `
        <div class="bn-item${currentVideo?.bvid === v.bvid ? ' playing' : ''}" data-tab="${tab}" data-idx="${i}">
            <img class="bn-item-cover" src="${v.cover}" alt="" loading="lazy">
            <span class="bn-item-dur">${v.dur}</span>
            ${v.badge ? `<span class="bn-item-badge ${v.badge === '免费' ? 'free' : 'paid'}">${v.badge}</span>` : ''}
            <div class="bn-item-info">
                <div class="bn-item-title">${v.title}</div>
                <div class="bn-item-meta">
                    <span><i class="fas fa-user"></i> ${v.author}</span>
                    <span><i class="fas fa-play"></i> ${v.views}</span>
                </div>
                ${v.progress > 0 && v.progress < 100 ? `<div class="bn-item-progress"><div class="bn-item-progress-bar" style="width:${v.progress}%"></div></div>` : ''}
            </div>
        </div>
    `).join('');

    listEl.querySelectorAll('.bn-item').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx);
            const t = el.dataset.tab;
            playVideo(TABS[t].items[idx]);
            listEl.querySelectorAll('.bn-item').forEach(e => e.classList.remove('playing'));
            el.classList.add('playing');
        });
    });
}

function playVideo(video) {
    currentVideo = video;
    const frame = document.getElementById('playerFrame');

    if (video.bvid.startsWith('BV_cheese_')) {
        frame.innerHTML = `<div class="bn-player-empty" style="background:linear-gradient(135deg,#1a1a2e,#16213e)">
            <i class="fas fa-graduation-cap" style="font-size:48px;color:var(--bm-pink);opacity:0.6"></i>
            <p style="color:var(--bm-text-sub)">课程播放 · ${video.title}</p>
            <p style="font-size:12px;color:var(--bm-text-dim)">实际实现中将加载 B 站课程嵌入播放器</p>
        </div>`;
    } else {
        frame.innerHTML = `<iframe src="//player.bilibili.com/player.html?bvid=${video.bvid}&high_quality=1&danmaku=0&autoplay=1" allowfullscreen></iframe>`;
    }

    document.getElementById('playerInfo').style.display = '';
    document.getElementById('piTitle').textContent = video.title;
    document.getElementById('piAuthor').textContent = video.author;
    document.getElementById('piViews').textContent = video.views;
    document.getElementById('piDanmaku').textContent = video.danmaku;
}

document.querySelectorAll('.bn-stab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.bn-stab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderList(tab.dataset.tab);
        document.querySelectorAll('.bn-pill').forEach(p => p.classList.remove('active'));
        const pill = document.querySelector(`.bn-pill[data-tab="${tab.dataset.tab}"]`);
        if (pill) pill.classList.add('active');
    });
});

document.querySelectorAll('.bn-pill').forEach(pill => {
    pill.addEventListener('click', () => {
        document.querySelectorAll('.bn-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const tab = pill.dataset.tab;
        renderList(tab);
        document.querySelectorAll('.bn-stab').forEach(t => t.classList.remove('active'));
        const stab = document.querySelector(`.bn-stab[data-tab="${tab}"]`);
        if (stab) stab.classList.add('active');
        if (!sidebarOpen) toggleSidebar();
    });
});

document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);

function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    document.getElementById('sidebar').classList.toggle('visible', sidebarOpen);
    document.getElementById('sidebarToggle').classList.toggle('open', sidebarOpen);
}

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim();
    if (!q) return;
    doSearch(q);
});
document.getElementById('searchBtn').addEventListener('click', () => {
    const q = document.getElementById('searchInput').value.trim();
    if (q) doSearch(q);
});

function doSearch(q) {
    document.querySelectorAll('.bn-pill, .bn-stab').forEach(el => el.classList.remove('active'));
    document.getElementById('listInfo').innerHTML = `<i class="fas fa-search"></i><span>搜索 "${q}"</span><code>s.search.bilibili.com/main/suggest</code>`;
    document.getElementById('videoList').innerHTML = '<div style="padding:40px;text-align:center;color:var(--bm-text-dim);font-size:13px"><i class="fas fa-spinner fa-spin"></i> 搜索中...</div>';
    if (!sidebarOpen) toggleSidebar();
    setTimeout(() => {
        const results = TABS.popular.items.slice(0, 4).map(v => ({ ...v, title: `[搜索] ${q} — ${v.title}` }));
        TABS['_search'] = { label: `搜索 "${q}"`, api: 'suggest', items: results };
        renderList('_search');
    }, 500);
}

renderList('popular');
</script>
</body>
</html>
