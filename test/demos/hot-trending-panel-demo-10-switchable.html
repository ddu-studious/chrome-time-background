    { type:'devto', title:'Understanding TypeScript Generics Through Real Examples', desc:'Practical generics guide', metricNum:88, hearts:88 },
];

const SRC = { github:'GitHub', hackernews:'HN', reddit:'Reddit', devto:'DEV' };
const SRC_ICON = { github:'fab fa-github', hackernews:'fab fa-hacker-news', reddit:'fab fa-reddit', devto:'fab fa-dev' };
let currentFilter = 'all', currentSort = null, sortAsc = false, searchQuery = '', currentView = 'table';

function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : String(n); }

function getFiltered() {
    let items = currentFilter === 'all' ? [...ALL_DATA] : ALL_DATA.filter(d => d.type === currentFilter);
    if (searchQuery) { const q = searchQuery.toLowerCase(); items = items.filter(d => d.title.toLowerCase().includes(q) || (d.desc||'').toLowerCase().includes(q)); }
    if (currentSort === 'metric') items.sort((a,b) => sortAsc ? a.metricNum - b.metricNum : b.metricNum - a.metricNum);
    else if (currentSort === 'comments') items.sort((a,b) => sortAsc ? (a.comments||0)-(b.comments||0) : (b.comments||0)-(a.comments||0));
    return items;
}

// ---- Filter Bar ----
function renderFilters() {
    const bar = document.getElementById('filter-bar');
    const groups = {}; ALL_DATA.forEach(d => { groups[d.type] = (groups[d.type]||0)+1; });
    let h = `<button class="filter-chip active" data-filter="all"><i class="fas fa-globe"></i> 全部</button>`;
    for (const [k,c] of Object.entries(groups)) h += `<button class="filter-chip" data-filter="${k}"><i class="${SRC_ICON[k]}"></i> ${SRC[k]} <span style="opacity:.5;margin-left:2px">${c}</span></button>`;
    h += `<span class="filter-count" id="result-count">${ALL_DATA.length} 条</span>`;
    bar.innerHTML = h;
    bar.querySelectorAll('.filter-chip').forEach(btn => btn.addEventListener('click', () => {
        bar.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        currentFilter = btn.dataset.filter; renderCurrentView();
    }));
}

// ---- View Switching ----
document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
    currentView = btn.dataset.view;
    document.querySelectorAll('.view-pane').forEach(p => p.classList.add('hidden'));
    document.getElementById('pane-' + currentView).classList.remove('hidden');
    renderCurrentView();
}));

function renderCurrentView() {
    const items = getFiltered();
    document.getElementById('result-count').textContent = items.length + ' 条';
    document.getElementById('hdr-count').textContent = items.length + ' 条';
    if (currentView === 'table') renderTable(items);
    else if (currentView === 'bento') renderBento(items);
    else renderInsight(items);
}

// ---- TABLE ----
function renderTable(items) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = items.map((item, idx) => {
        let mh = '';
        if (item.stars) mh = `<span class="metric-value stars"><i class="fas fa-star"></i> ${fmt(item.stars)}</span>`;
        else if (item.points) mh = `<span class="metric-value points"><i class="fas fa-arrow-up"></i> ${fmt(item.points)}</span>`;
        else if (item.votes) mh = `<span class="metric-value votes"><i class="fas fa-arrow-up"></i> ${fmt(item.votes)}</span>`;
        else if (item.hearts) mh = `<span class="metric-value hearts"><i class="fas fa-heart"></i> ${fmt(item.hearts)}</span>`;
        return `<tr>
            <td class="rank-cell${idx<3?' r'+(idx+1):''}">${idx+1}</td>
            <td><span class="source-chip ${item.type}">${SRC[item.type]}</span></td>
            <td class="title-cell"><span class="title-text">${item.title}</span>${item.desc?`<div class="title-desc">${item.desc}</div>`:''}${item.lang?`<div class="title-tags"><span class="title-tag lang">${item.lang}</span></div>`:''}</td>
            <td class="metric-cell">${mh}</td>
            <td class="comments-cell">${item.comments?`<i class="fas fa-comment"></i> ${item.comments}`:'—'}</td>
            <td class="actions-cell"><div class="row-actions"><button class="row-act" title="打开"><i class="fas fa-external-link-alt"></i></button><button class="row-act" title="保存"><i class="fas fa-bookmark"></i></button></div></td>
        </tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,0.2)">无匹配结果</td></tr>';
}
document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort; if (currentSort===k) sortAsc=!sortAsc; else { currentSort=k; sortAsc=false; }
    document.querySelectorAll('th').forEach(t=>t.classList.remove('sorted')); th.classList.add('sorted');
    renderCurrentView();
}));

// ---- BENTO ----
const BENTO_SIZES = ['size-2x2','size-2x1','size-1x2','size-1x1','size-1x1','size-2x1','size-1x1','size-1x1'];
const BENTO_GRADIENTS = ['card-g1','card-g2','','','','','',''];
function renderBento(items) {
    const pane = document.getElementById('pane-bento');
    pane.innerHTML = '<div class="bento-grid">' + items.map((item, idx) => {
        const sz = BENTO_SIZES[idx] || 'size-1x1';
        const gr = BENTO_GRADIENTS[idx] || '';
        const srcCls = {github:'src-gh',hackernews:'src-hn',reddit:'src-rd',devto:'src-dev'}[item.type]||'';
        let foot = '';
        if (item.stars) foot += `<span class="m-stars"><i class="fas fa-star"></i> ${fmt(item.stars)}</span>`;
        if (item.points) foot += `<span class="m-pts"><i class="fas fa-arrow-up"></i> ${fmt(item.points)}</span>`;
        if (item.votes) foot += `<span class="m-pts" style="color:#ef4444"><i class="fas fa-arrow-up"></i> ${fmt(item.votes)}</span>`;
        if (item.hearts) foot += `<span class="m-pts" style="color:#f472b6"><i class="fas fa-heart"></i> ${fmt(item.hearts)}</span>`;
        if (item.comments) foot += `<span class="m-cmt"><i class="fas fa-comment"></i> ${item.comments}</span>`;
        if (item.lang) foot += `<span style="color:rgba(255,255,255,.4)">${item.lang}</span>`;
        const insightHtml = (idx === 0 && item.aiInsight) ? `<div class="bento-insight"><strong>✨ AI 洞察：</strong>${item.aiInsight}</div>` : '';
        return `<div class="bento-card ${sz} ${gr}">
            <i class="${SRC_ICON[item.type]} bento-bg"></i>
            <div class="bento-source ${srcCls}"><i class="${SRC_ICON[item.type]}"></i> ${SRC[item.type]} #${idx+1}</div>
            <div class="bento-title">${idx<3?`<span class="rank-badge">${idx+1}</span>`:''}${item.title}</div>
            ${item.desc && sz!=='size-1x1' ? `<div class="bento-desc">${item.desc}</div>`:''}
            ${insightHtml}
            <div class="bento-footer">${foot}</div>
        </div>`;
    }).join('') + '</div>';
}

// ---- AI INSIGHT ----
function renderInsight(items) {
    const pane = document.getElementById('pane-insight');
    const withInsight = items.filter(i => i.aiInsight);
    const without = items.filter(i => !i.aiInsight);
    let h = '<div class="insight-feed">';
    for (const item of withInsight) {
        const srcCls = {github:'s-gh',hackernews:'s-hn',reddit:'s-rd',devto:'s-dev'}[item.type]||'';
        let foot = '';
        if (item.stars) foot += `<span class="fm fm-star"><i class="fas fa-star"></i> ${fmt(item.stars)}</span>`;
        if (item.points) foot += `<span class="fm fm-pt"><i class="fas fa-arrow-up"></i> ${fmt(item.points)}</span>`;
        if (item.votes) foot += `<span class="fm fm-vote"><i class="fas fa-arrow-up"></i> ${fmt(item.votes)}</span>`;
        if (item.hearts) foot += `<span class="fm" style="color:#f472b6"><i class="fas fa-heart"></i> ${fmt(item.hearts)}</span>`;
        if (item.comments) foot += `<span class="fm fm-cmt"><i class="fas fa-comment"></i> ${item.comments}</span>`;
        if (item.lang) foot += `<span class="fm fm-cmt">${item.lang}</span>`;
        h += `<div class="feed-card">
            <div class="feed-header"><div class="feed-src-icon ${srcCls}"><i class="${SRC_ICON[item.type]}"></i></div> ${SRC[item.type]}</div>
            <div class="feed-title">${item.title}</div>
            <div class="insight-box"><div class="insight-label"><i class="fas ${item.aiIcon||'fa-bolt'}"></i> ${item.aiLabel||'AI 洞察'}</div><div class="insight-text">${item.aiInsight}</div></div>
            <div class="feed-footer"><div class="feed-metrics">${foot}</div><div class="feed-actions"><button class="feed-act"><i class="fas fa-bookmark"></i> 稍后读</button><button class="feed-act"><i class="fas fa-external-link-alt"></i> 打开</button></div></div>
        </div>`;
    }
    if (without.length) {
        h += `<div style="font-size:12px;color:rgba(255,255,255,0.3);padding:8px 0;border-top:1px solid rgba(255,255,255,0.05);margin-top:4px">其他 ${without.length} 条暂无 AI 洞察</div>`;
        for (const item of without) {
            const srcCls = {github:'s-gh',hackernews:'s-hn',reddit:'s-rd',devto:'s-dev'}[item.type]||'';
            let foot = '';
            if (item.stars) foot += `<span class="fm fm-star"><i class="fas fa-star"></i> ${fmt(item.stars)}</span>`;
            if (item.points) foot += `<span class="fm fm-pt"><i class="fas fa-arrow-up"></i> ${fmt(item.points)}</span>`;
            if (item.votes) foot += `<span class="fm fm-vote"><i class="fas fa-arrow-up"></i> ${fmt(item.votes)}</span>`;
            if (item.hearts) foot += `<span class="fm" style="color:#f472b6"><i class="fas fa-heart"></i> ${fmt(item.hearts)}</span>`;
            if (item.comments) foot += `<span class="fm fm-cmt"><i class="fas fa-comment"></i> ${item.comments}</span>`;
            h += `<div class="feed-card" style="padding:14px 20px">
                <div style="display:flex;align-items:center;gap:8px"><div class="feed-src-icon ${srcCls}"><i class="${SRC_ICON[item.type]}"></i></div><span style="flex:1;font-size:14px;font-weight:500;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.title}</span><div class="feed-metrics" style="flex-shrink:0">${foot}</div></div>
            </div>`;
        }
    }
    h += '</div>';
    pane.innerHTML = h;
}

// ---- Search ----
document.getElementById('search-input').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderCurrentView(); });

// ---- Init ----
renderFilters();
renderCurrentView();
</script>
</body>
</html>
