<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热榜面板 Demo 3 - 仪表盘卡片</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80') center/cover no-repeat fixed;
            color: #fff; min-height: 100vh;
        }
        body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 0; }

        .panel-overlay {
            position: fixed; inset: 0; z-index: 900;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
        }
        .panel {
            width: min(1100px, 94vw); height: 84vh;
            border-radius: 16px;
            background: rgba(16, 16, 24, 0.92);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .panel-title { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 8px; }
        .panel-stats {
            display: flex; gap: 16px; font-size: 12px; color: rgba(255,255,255,0.4);
        }
        .panel-stat { display: flex; align-items: center; gap: 4px; }
        .panel-stat i { font-size: 10px; }
        .panel-close {
            width: 30px; height: 30px; border-radius: 8px;
            background: rgba(255,255,255,0.06); border: none; color: rgba(255,255,255,0.5);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .panel-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

        /* Dashboard body */
        .dashboard {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .dashboard::-webkit-scrollbar { width: 6px; }
        .dashboard::-webkit-scrollbar-track { background: transparent; }
        .dashboard::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* Source group */
        .source-group {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .source-group:hover { border-color: rgba(255,255,255,0.08); }
        .source-group-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            cursor: pointer; user-select: none;
            transition: background 0.2s;
        }
        .source-group-header:hover { background: rgba(255,255,255,0.03); }
        .source-icon {
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .source-icon.github { background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(139,92,246,0.08)); }
        .source-icon.hackernews { background: linear-gradient(135deg, rgba(249,115,22,0.2), rgba(249,115,22,0.08)); }
        .source-icon.reddit { background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.08)); }
        .source-icon.devto { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.08)); }
        .source-info { flex: 1; }
        .source-name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85); }
        .source-summary { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; }
        .source-toggle {
            color: rgba(255,255,255,0.25); transition: transform 0.3s;
            font-size: 12px;
        }
        .source-group.collapsed .source-toggle { transform: rotate(-90deg); }
        .source-group.collapsed .source-group-body { display: none; }

        /* Group body - horizontal scroll cards */
        .source-group-body {
            padding: 0 12px 12px;
        }
        .cards-scroll {
            display: flex; gap: 10px;
            overflow-x: auto; padding: 4px 4px 8px;
            scroll-snap-type: x mandatory;
        }
        .cards-scroll::-webkit-scrollbar { height: 4px; }
        .cards-scroll::-webkit-scrollbar-track { background: transparent; }
        .cards-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .dash-card {
            flex: 0 0 280px; scroll-snap-align: start;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; padding: 14px;
            cursor: pointer; transition: all 0.25s;
            position: relative;
        }
        .dash-card:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .dash-card-rank {
            position: absolute; top: 10px; left: 10px;
            font-size: 28px; font-weight: 800;
            color: rgba(255,255,255,0.04);
            line-height: 1;
        }
        .dash-card-rank.top { color: rgba(251, 191, 36, 0.12); }
        .dash-card-title {
            font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85);
            line-height: 1.5; margin-bottom: 8px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
            position: relative;
        }
        .dash-card-desc {
            font-size: 11px; color: rgba(255,255,255,0.35);
            line-height: 1.4; margin-bottom: 10px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .dash-card-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .dash-tag {
            padding: 2px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 500;
        }
        .dash-tag.lang { background: rgba(59,130,246,0.12); color: #93c5fd; }
        .dash-metric {
            font-size: 11px; display: flex; align-items: center; gap: 3px;
        }
        .dash-metric.stars { color: #fbbf24; }
        .dash-metric.points { color: #f97316; }
        .dash-metric.votes { color: #ef4444; }
        .dash-metric.hearts { color: #ec4899; }
        .dash-metric i { font-size: 9px; }
        .dash-comments { font-size: 11px; color: rgba(255,255,255,0.25); display: flex; align-items: center; gap: 3px; }
        .dash-comments i { font-size: 9px; }

        .dash-card-actions {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 2px; opacity: 0; transition: opacity 0.2s;
        }
        .dash-card:hover .dash-card-actions { opacity: 1; }
        .dash-act {
            width: 24px; height: 24px; border-radius: 6px;
            background: rgba(0,0,0,0.4); border: none;
            color: rgba(255,255,255,0.5); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .dash-act:hover { background: rgba(0,0,0,0.7); color: #fff; }

        /* View all link */
        .view-all-card {
            flex: 0 0 100px; scroll-snap-align: start;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 10px; cursor: pointer;
            transition: all 0.2s;
            font-size: 12px; color: rgba(255,255,255,0.3);
            flex-direction: column; gap: 6px; min-height: 120px;
        }
        .view-all-card:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); }
        .view-all-card i { font-size: 16px; }
    </style>
</head>
<body>
    <div class="panel-overlay">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fas fa-th-large" style="color:#a5b4fc"></i> 热榜仪表盘
                </div>
                <div class="panel-stats">
                    <span class="panel-stat"><i class="fas fa-database"></i> 4 个源</span>
                    <span class="panel-stat"><i class="fas fa-list"></i> 31 条</span>
                    <span class="panel-stat"><i class="fas fa-clock"></i> 5 分钟前</span>
                </div>
                <button class="panel-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="dashboard" id="dashboard"></div>
        </div>
    </div>

    <script>
    const SOURCES = {
        github: {
            name: 'GitHub Trending', icon: '🔥',
            items: [
                { title: 'Krishnagangwal/CS-Fundamentals', desc: 'CS fundamentals collection for interviews', metric: '1.5k', stars: 1500, lang: 'Python' },
                { title: 'yynxxxxx/Codex-5.5-codex-instruct-5.5', desc: 'Codex 5.5 instruction-tuned model', metric: '1.3k', stars: 1300, lang: 'Python' },
                { title: 'mekos2772/ios-location-spoofer', desc: 'GPS spoofer for iOS without jailbreak', metric: '1.3k', stars: 1300, lang: 'Swift' },
                { title: 'Kulaxyz/self-learning-skills', desc: 'Curated resources for self-taught devs', metric: '820', stars: 820 },
                { title: 'HUANGCHIHHUNGLeo/claude-real-video', desc: 'Real-time video processing with Claude', metric: '675', stars: 675, lang: 'TypeScript' },
                { title: 'anthropics/claude-code', desc: 'AI coding assistant by Anthropic', metric: '12.4k', stars: 12400, lang: 'TypeScript' },
                { title: 'vercel/next.js', desc: 'The React Framework for the Web', metric: '128k', stars: 128000, lang: 'JavaScript' },
                { title: 'denoland/deno', desc: 'Modern runtime for JavaScript and TypeScript', metric: '98k', stars: 98000, lang: 'Rust' },
            ]
        },
        hackernews: {
            name: 'Hacker News', icon: '📰',
            items: [
                { title: 'Astrophysicists Puzzle over Webb\'s New Universe', metric: '79 pts', points: 79, comments: 142 },
                { title: 'Linux has officially won', metric: '1.4k pts', points: 1400, comments: 891 },
                { title: 'The Vespa at 80', metric: '43 pts', points: 43, comments: 67 },
                { title: 'Division Polynomials of Elliptic Curves in Python', metric: '7 pts', points: 7, comments: 12 },
                { title: 'Night Witches – all-female Soviet aviator regiment', metric: '18 pts', points: 18, comments: 34 },
                { title: 'Hunting a 16-year-old SQLite bug with TLA+', metric: '80 pts', points: 80, comments: 45 },
                { title: 'The bottleneck might be the air in the room', metric: '483 pts', points: 483, comments: 267 },
                { title: 'Show HN: Browser extension new tab dashboard', metric: '156 pts', points: 156, comments: 89 },
            ]
        },
        reddit: {
            name: 'Reddit', icon: '💬',
            items: [
                { title: 'What\'s Next for AI?', metric: '192', votes: 192, comments: 445 },
                { title: 'Need a break? Play today\'s game', metric: '111', votes: 111, comments: 23 },
                { title: 'Maybe you should learn something', metric: '201', votes: 201, comments: 89 },
                { title: 'Leading backend architecture of a university project', metric: '0', votes: 0, comments: 15 },
                { title: 'Dunning-Kruger effect in software engineering', metric: '1.2k', votes: 1200, comments: 543 },
                { title: 'What language should I learn in 2026?', metric: '890', votes: 890, comments: 234 },
                { title: 'My side project just hit 10k users!', metric: '567', votes: 567, comments: 178 },
            ]
        },
        devto: {
            name: 'DEV.to', icon: '📝',
            items: [
                { title: 'Welcome to AI Engineer World\'s Fair 2026', metric: '70', hearts: 70 },
                { title: 'CI workflows on Tangled for Elixir', metric: '1', hearts: 1 },
                { title: 'My First Year at DEV Recap', metric: '62', hearts: 62 },
                { title: 'Building a Modern CLI Tool with Go', metric: '45', hearts: 45 },
                { title: 'Understanding TypeScript Generics', metric: '88', hearts: 88 },
                { title: '10 VS Code Extensions You Need in 2026', metric: '156', hearts: 156 },
                { title: 'How to Write Clean Python Code', metric: '94', hearts: 94 },
                { title: 'GraphQL vs REST: A Practical Guide', metric: '77', hearts: 77 },
            ]
        },
    };

    function renderDashboard() {
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        for (const [key, source] of Object.entries(SOURCES)) {
            const group = document.createElement('div');
            group.className = 'source-group';
            const topItem = source.items[0];
            const summary = `${source.items.length} 条 · Top: ${topItem?.title?.slice(0, 30)}...`;

            group.innerHTML = `
                <div class="source-group-header">
                    <div class="source-icon ${key}">${source.icon}</div>
                    <div class="source-info">
                        <div class="source-name">${source.name}</div>
                        <div class="source-summary">${summary}</div>
                    </div>
                    <div class="source-toggle"><i class="fas fa-chevron-down"></i></div>
                </div>
                <div class="source-group-body">
                    <div class="cards-scroll">
                        ${source.items.map((item, idx) => {
                            let metricHtml = '';
                            if (item.stars) metricHtml = `<span class="dash-metric stars"><i class="fas fa-star"></i> ${item.metric}</span>`;
                            else if (item.points) metricHtml = `<span class="dash-metric points"><i class="fas fa-arrow-up"></i> ${item.points}</span>`;
                            else if (item.votes) metricHtml = `<span class="dash-metric votes"><i class="fas fa-arrow-up"></i> ${item.votes}</span>`;
                            else if (item.hearts) metricHtml = `<span class="dash-metric hearts"><i class="fas fa-heart"></i> ${item.hearts}</span>`;

                            return `
                                <div class="dash-card">
                                    <div class="dash-card-rank${idx < 3 ? ' top' : ''}">${idx + 1}</div>
                                    <div class="dash-card-actions">
                                        <button class="dash-act" title="打开"><i class="fas fa-external-link-alt"></i></button>
                                        <button class="dash-act" title="保存"><i class="fas fa-bookmark"></i></button>
                                    </div>
                                    <div class="dash-card-title">${item.title}</div>
                                    ${item.desc ? `<div class="dash-card-desc">${item.desc}</div>` : ''}
                                    <div class="dash-card-footer">
                                        ${item.lang ? `<span class="dash-tag lang">${item.lang}</span>` : ''}
                                        ${metricHtml}
                                        ${item.comments ? `<span class="dash-comments"><i class="fas fa-comment"></i> ${item.comments}</span>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        <div class="view-all-card">
                            <i class="fas fa-arrow-right"></i>
                            查看全部
                        </div>
                    </div>
                </div>
            `;

            group.querySelector('.source-group-header').addEventListener('click', () => {
                group.classList.toggle('collapsed');
            });

            dashboard.appendChild(group);
        }
    }

    renderDashboard();
    </script>
</body>
</html>
