<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MarkdownRenderer 统一渲染测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1724; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; }
        h1 { text-align: center; margin-bottom: 24px; color: #60a5fa; font-size: 20px; }
        .test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1400px; margin: 0 auto; }
        .test-case { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
        .test-case h3 { padding: 12px 16px; background: rgba(59,130,246,0.15); color: #93c5fd; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .test-source { padding: 12px 16px; background: rgba(0,0,0,0.2); font-family: 'Fira Code', monospace; font-size: 12px; white-space: pre-wrap; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.08); max-height: 150px; overflow: auto; }
        .test-render { padding: 16px; min-height: 60px; }

        /* 复用项目 Markdown 样式 */
        .kw-md-body h1,.kw-md-body h2,.kw-md-body h3,.kw-md-body h4 { margin: 12px 0 6px; color: #f1f5f9; }
        .kw-md-body h1 { font-size: 1.4em; }
        .kw-md-body h2 { font-size: 1.2em; }
        .kw-md-body h3 { font-size: 1.05em; }
        .kw-md-body p { margin: 6px 0; line-height: 1.7; color: #cbd5e1; }
        .kw-md-body a { color: #60a5fa; text-decoration: underline; }
        .kw-md-body img, .md-img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        .kw-md-body code { background: rgba(59,130,246,0.15); color: #93c5fd; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .kw-md-body pre { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
        .kw-md-body pre code { background: transparent; padding: 0; color: #e2e8f0; }
        .kw-md-body blockquote { border-left: 3px solid #3b82f6; padding: 4px 12px; margin: 8px 0; background: rgba(59,130,246,0.06); }
        .kw-md-body ul,.kw-md-body ol { padding-left: 20px; margin: 6px 0; }
        .kw-md-body li { margin: 3px 0; color: #cbd5e1; }
        .kw-md-body mark { background: rgba(234,179,8,0.3); color: #fde68a; padding: 1px 4px; border-radius: 3px; }
        .kw-md-body table { border-collapse: collapse; width: 100%; margin: 8px 0; }
        .kw-md-body th,.kw-md-body td { padding: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .kw-md-body th { background: rgba(255,255,255,0.05); }
        .kw-md-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 12px 0; }
        .kw-md-body .kw-md-task-item { list-style: none; }
        .kw-md-body .kw-md-task-item.done { text-decoration: line-through; opacity: 0.6; }

        .status-bar { text-align: center; margin-top: 24px; padding: 12px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); border-radius: 8px; color: #86efac; font-size: 13px; }
        .status-bar.error { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <h1>MarkdownRenderer 统一渲染测试</h1>
    <div class="test-grid" id="test-grid"></div>
    <div class="status-bar" id="status-bar">加载中...</div>

    <script src="../../vendor/marked.min.js"></script>
    <script src="../../vendor/purify.min.js"></script>
    <script src="../../vendor/highlight.min.js"></script>
    <script src="../../vendor/mermaid.tiny.min.js"></script>
    <script src="../../js/markdown-renderer.js"></script>
    <script>
        const testCases = [
            {
                name: '图片渲染（同行）',
                md: '![示例图片](https://picsum.photos/400/200)'
            },
            {
                name: '图片渲染（跨行修复）',
                md: '![LangChain 学习视频进度]\n(https://picsum.photos/400/200)'
            },
            {
                name: '标题层级',
                md: '# 一级标题\n## 二级标题\n### 三级标题\n#### 四级标题'
            },
            {
                name: '强调与高亮',
                md: '**粗体** *斜体* ~~删除线~~ ==高亮文本== `行内代码`'
            },
            {
                name: '链接（内外部）',
                md: '[内部链接](/page)\n\n[GitHub](https://github.com)\n\n自动链接: https://example.com'
            },
            {
                name: '代码块高亮',
                md: '```javascript\nconst greeting = "Hello";\nconsole.log(greeting);\n```'
            },
            {
                name: '引用与列表',
                md: '> 这是一段引用\n\n- 无序列表 1\n- 无序列表 2\n\n1. 有序列表 1\n2. 有序列表 2'
            },
            {
                name: 'GFM 任务列表',
                md: '- [x] 已完成任务\n- [ ] 未完成任务\n- [x] 另一个完成的'
            },
            {
                name: '表格',
                md: '| 名称 | 版本 | 说明 |\n|------|------|------|\n| marked | 15.0.7 | Markdown 解析 |\n| DOMPurify | 3.2.5 | HTML 消毒 |'
            },
            {
                name: '多行检测 hasMarkdownSyntax',
                md: '普通第一行\n## 第二行才是标题\n- 第三行是列表'
            },
            {
                name: '图片+文字混合',
                md: '## 学习笔记\n\n这是一张截图：\n\n![截图](https://picsum.photos/300/150)\n\n以上是效果图。'
            },
            {
                name: '链接跨行修复',
                md: '[点击这里]\n(https://github.com) 查看详情'
            }
        ];

        const grid = document.getElementById('test-grid');
        const statusBar = document.getElementById('status-bar');
        let errors = 0;

        testCases.forEach((tc, i) => {
            const div = document.createElement('div');
            div.className = 'test-case';

            let rendered = '';
            let hasMd = false;
            try {
                rendered = MarkdownRenderer.render(tc.md);
                hasMd = MarkdownRenderer.hasMarkdownSyntax(tc.md);
            } catch (e) {
                rendered = `<span style="color:#ef4444">渲染失败: ${e.message}</span>`;
                errors++;
            }

            div.innerHTML = `
                <h3>#${i + 1} ${tc.name} ${hasMd ? '<span style="color:#86efac;font-size:11px;margin-left:8px;">✓ 检测为MD</span>' : '<span style="color:#fca5a5;font-size:11px;margin-left:8px;">✗ 未检测为MD</span>'}</h3>
                <div class="test-source">${tc.md.replace(/</g, '&lt;')}</div>
                <div class="test-render kw-md-body">${rendered}</div>
            `;
            grid.appendChild(div);
        });

        if (errors > 0) {
            statusBar.className = 'status-bar error';
            statusBar.textContent = `${errors} 个测试用例渲染失败`;
        } else {
            statusBar.textContent = `全部 ${testCases.length} 个测试用例渲染成功 | MarkdownRenderer 已加载 ✓ | marked ${typeof marked !== 'undefined' ? '✓' : '✗'} | DOMPurify ${typeof DOMPurify !== 'undefined' ? '✓' : '✗'} | hljs ${typeof hljs !== 'undefined' ? '✓' : '✗'}`;
        }
    </script>
</body>
</html>
