<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dock Bar Demo 3 · 霓虹分段底座</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .hint{
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(18px);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 12px;
            color: rgba(255,255,255,0.65);
            max-width: 400px;
            line-height: 1.5;
        }

        /* 分段“条形 Dock” */
        .dock-shell{
            position: fixed;
            right: 18px;
            bottom: 18px;
            padding: 10px;
            border-radius: 18px;
            background: rgba(10, 12, 20, 0.35);
            backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 18px 60px rgba(0,0,0,0.30);
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            gap: 0;
        }

        .dock-btn{
            width: 44px;
            height: 44px;
            border: 0;
            background: transparent;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.65);
            transition: transform 180ms cubic-bezier(0.4,0,0.2,1), color 180ms ease, opacity 180ms ease;
            outline: none;
        }

        .dock-btn + .dock-btn{
            border-left: 1px solid rgba(255,255,255,0.10);
        }

        .dock-btn i{ font-size: 17px; }

        .dock-btn::after{
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 6px;
            height: 2px;
            border-radius: 999px;
            background: rgba(167,139,250,0.0);
            transition: background 180ms ease, transform 180ms ease;
            transform: scaleX(0.5);
            transform-origin: center;
        }

        .dock-btn:hover{
            transform: translateY(-2px) scale(1.08);
            color: rgba(167,139,250,1);
        }

        .dock-btn.active{
            color: rgba(167,139,250,1);
        }
        .dock-btn.active::after{
            background: rgba(167,139,250,0.9);
            transform: scaleX(1);
            box-shadow: 0 0 14px rgba(167,139,250,0.55);
        }

        .dock-shell:focus-within{
            border-color: rgba(167,139,250,0.22);
        }
    </style>
</head>
<body>
    <div class="hint">
        Demo 3：分段条形 Dock，hover 放大不浮夸；active 用底部霓虹短横线提示，让“右下角工具条”更克制但有辨识度。
        点击切换 active。
    </div>

    <div class="dock-shell" id="dockShell" aria-label="Dock Bar">
        <button class="dock-btn" data-key="sys" title="扩展监控" aria-label="扩展监控">
            <i class="fas fa-heartbeat"></i>
        </button>
        <button class="dock-btn" data-key="memo" title="任务面板" aria-label="任务面板">
            <i class="fas fa-tasks"></i>
        </button>
    </div>

    <script>
        const shell = document.getElementById('dockShell');
        const buttons = Array.from(shell.querySelectorAll('.dock-btn'));
        function setActive(key) {
            buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.key === key));
        }
        buttons.forEach(btn => btn.addEventListener('click', () => setActive(btn.dataset.key)));
        setActive('sys');
    </script>
</body>
</html>
