<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>回声花园 · 背景实验 v4</title>
  <link rel="stylesheet" href="garden.css?v=2">
  <link rel="stylesheet" href="garden-background.css?v=1">
</head>
<body>
  <main id="garden" class="garden" aria-label="回声花园互动区域">
    <div class="garden-photo"></div>
    <div class="garden-grade"></div>
    <canvas id="garden-canvas"></canvas>
    <div class="garden-grain"></div>
    <div id="bloom" class="bloom"></div>
  </main>

  <header class="topbar">
    <div class="brand"><i>04</i><span><b>ECHO GARDEN</b><small>BACKGROUND PLAY LAB</small></span></div>
    <nav>
      <a href="../background-playground-v3/index.html">返回 v3</a>
      <button id="sound-toggle" type="button" aria-pressed="false">声音：关</button>
      <button id="pause-toggle" type="button" aria-pressed="false">暂停花园</button>
    </nav>
  </header>

  <section class="welcome" id="welcome">
    <p>REPEAT PLAY · EXPERIMENT 02</p>
    <h1>画一段时间。<br>让它自己生长。</h1>
    <span>你的每条手势都会成为一层循环回声。叠加三层，观察它们靠近、和声，并最终让整个花园绽放。</span>
    <button id="enter-garden" type="button">进入回声花园</button>
  </section>

  <aside class="loop-panel">
    <header><span>循环层</span><b id="loop-count">0 / 3</b></header>
    <div class="loop-slots">
      <div data-slot="0"><i></i><span><b>第一回声</b><small>等待录制</small></span><em>01</em></div>
      <div data-slot="1"><i></i><span><b>第二回声</b><small>等待叠加</small></span><em>02</em></div>
      <div data-slot="2"><i></i><span><b>第三回声</b><small>等待绽放</small></span><em>03</em></div>
    </div>
    <div class="record-wrap">
      <button id="record-toggle" type="button"><i></i><span>开始录制</span></button>
      <div class="record-time"><span id="record-time">0.0</span><small>最多 6 秒</small></div>
    </div>
    <p id="record-hint">进入后，点击录制，再在右侧空白区域拖动。</p>
  </aside>

  <aside class="world-panel">
    <p>WORLD COMPOSER</p>
    <div class="tempo-row"><span>循环速度</span><input id="tempo" type="range" min="50" max="160" value="100"><output id="tempo-output">1.00×</output></div>
    <div class="mood-row" aria-label="花园氛围">
      <button class="active" data-mood="dawn">晨雾</button>
      <button data-mood="blue">潮蓝</button>
      <button data-mood="ember">余烬</button>
      <button data-mood="moon">月夜</button>
    </div>
    <div class="world-actions"><button id="demo-garden" type="button">演示三层绽放</button><button id="undo-loop" type="button" disabled>撤销一层</button><button id="clear-garden" type="button" disabled>清空</button></div>
    <div class="garden-state"><span id="garden-state">花园尚未苏醒</span><b id="harmony-count">和声 0</b></div>
  </aside>

  <div class="guide" id="guide" role="status" aria-live="polite">先点击“进入回声花园”</div>
  <script src="garden.js?v=3"></script>
</body>
</html>
