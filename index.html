<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新标签页 - 中国风景时钟</title>
    <style>
        html { overflow: hidden; height: 100%; }
        body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/weekview.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 视频背景层（v3.16.0 多源背景支持） -->
    <video id="background-video" autoplay muted loop playsinline></video>
    <!-- 主布局容器（单栏） -->
    <div class="main-layout">
        <main class="main-content">
            <!-- 吸顶容器：热榜 + 任务提醒条，滚动时固定在顶部 -->
            <div class="ticker-sticky-wrapper">
                <!-- 顶部滚动信息栏（混合双层模式） -->
                <div class="tech-ticker" id="tech-ticker">
                    <!-- 上层：主信息卡片 -->
                    <div class="ticker-main" id="ticker-main">
                        <div class="ticker-source-icon" id="ticker-source-icon">🔥</div>
                        <div class="ticker-body" id="ticker-body">
                            <div class="ticker-title" id="ticker-title">正在加载热门资讯...</div>
                            <div class="ticker-desc" id="ticker-desc"></div>
                        </div>
                        <div class="ticker-metric" id="ticker-metric"></div>
                        <div class="ticker-controls">
                            <span class="ticker-counter" id="ticker-counter"></span>
                            <button class="ticker-btn" id="ticker-prev-btn" title="上一条"><i class="fas fa-chevron-left"></i></button>
                            <button class="ticker-btn" id="ticker-next-btn" title="下一条"><i class="fas fa-chevron-right"></i></button>
                            <button class="ticker-btn ticker-save-btn" id="ticker-save-btn" title="保存为任务（稍后查看）"><i class="fas fa-bookmark"></i></button>
                            <button class="ticker-btn ticker-refresh-btn" id="ticker-refresh-btn" title="刷新"><i class="fas fa-sync-alt"></i></button>
                            <button class="ticker-btn ticker-keyword-btn" id="ticker-keyword-btn" title="关键字监控"><i class="fas fa-bell"></i></button>
                            <button class="ticker-btn ticker-sources-btn" id="ticker-sources-btn" title="数据源管理"><i class="fas fa-sliders-h"></i></button>
                            <button class="ticker-btn ticker-toggle-btn" id="ticker-toggle-btn" title="折叠/展开滚动栏"><i class="fas fa-chevron-up"></i></button>
                        </div>
                    </div>
                    <!-- 下层：迷你连续滚动栏 -->
                    <div class="ticker-mini" id="ticker-mini">
                        <div class="ticker-mini-mask">
                            <div class="ticker-mini-track" id="ticker-mini-track"></div>
                        </div>
                    </div>
                </div>
                <!-- 未完成任务滚动提醒条（分段进度 + 滚动混合） -->
                <div class="task-ticker" id="task-ticker">
                    <div class="task-ticker-stats" id="task-ticker-stats">
                        <i class="fas fa-check-circle task-ticker-icon"></i>
                        <span class="task-ticker-count" id="task-ticker-count">0/0</span>
                        <div class="task-ticker-bar">
                            <div class="task-ticker-fill" id="task-ticker-fill"></div>
                        </div>
                    </div>
                    <div class="task-ticker-scroll">
                        <div class="task-ticker-mask">
                            <div class="task-ticker-track" id="task-ticker-track"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 天气模块（右上角固定，hover 向下展开详情） -->
            <div class="weather-wrapper" id="weather-float">
                <div class="weather-container" id="weather">
                    <div class="current-weather">
                        <span class="weather-icon">🌤</span>
                        <span class="weather-temp">23°C</span>
                        <span class="weather-desc">晴朗</span>
                        <span class="weather-city">北京市</span>
                    </div>
                </div>
                <div class="weather-detail">
                    <div class="weather-detail-card">
                        <div class="forecast-container" id="forecast"></div>
                        <div class="hourly-chart-wrapper collapsed" id="hourly-chart-container">
                            <div class="hourly-chart-header">
                                <span class="hourly-chart-title">
                                    <i class="fas fa-temperature-half"></i>
                                    24小时温度趋势
                                </span>
                                <button class="hourly-chart-toggle-btn" id="hourly-chart-toggle" title="展开温度曲线">
                                    <i class="fas fa-chevron-down"></i>
                                </button>
                            </div>
                            <div class="hourly-chart-body" id="hourly-chart"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="time-wrapper">
                <div class="time-container">
                    <div class="time" id="time">00:00:00</div>
                    <div class="date" id="date">2026年1月31日 星期六</div>
                    <div class="lunar" id="lunar">农历乙巳年正月初三</div>
                    <div class="holiday" id="holiday"></div>
                </div>
            </div>
            <!-- 今日推荐阅读 -->
            <div class="reading-reco-wrapper" id="reading-reco-wrapper" style="display: none;">
                <div class="reading-reco-container" id="reading-reco">
                    <div class="reading-reco-header">
                        <span class="reading-reco-title">
                            <i class="fas fa-book-reader"></i>
                            今日推荐阅读
                        </span>
                        <div class="reading-reco-actions">
                            <span class="reading-reco-count" id="reading-reco-count"></span>
                            <button class="reading-reco-toggle" id="reading-reco-toggle" title="收起">
                                <i class="fas fa-chevron-up"></i>
                            </button>
                        </div>
                    </div>
                    <div class="reading-reco-body" id="reading-reco-body"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 紧急任务浮动提醒气泡 -->
    <div class="urgent-bubble" id="urgent-bubble" style="display:none;">
        <!-- 悬浮简易摘要条（收缩状态时显示） -->
        <div class="urgent-mini-bar" id="urgent-mini-bar">
            <span class="urgent-mini-dot"></span>
            <span class="urgent-mini-text" id="urgent-mini-text"></span>
        </div>
        <div class="urgent-bubble-dot" id="urgent-bubble-dot">
            <span class="urgent-bubble-ring"></span>
            <span class="urgent-bubble-num" id="urgent-bubble-num">0</span>
        </div>
        <div class="urgent-bubble-panel" id="urgent-bubble-panel">
            <div class="urgent-panel-header">
                <i class="fas fa-fire urgent-panel-icon"></i>
                <span class="urgent-panel-title" id="urgent-panel-title">任务需要关注</span>
                <button class="urgent-panel-close" id="urgent-panel-close">&times;</button>
            </div>
            <div class="urgent-panel-body" id="urgent-panel-body"></div>
            <div class="urgent-panel-footer">
                <a href="tasks.html" class="urgent-panel-link">查看全部任务 <i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </div>

    <!-- v3.2.1: 扩展活动监控面板（挂载在 dock 旁） -->
    <div class="sys-monitor" id="sys-monitor">
        <div class="sys-monitor-panel hidden" id="sys-monitor-panel">
            <div class="sys-monitor-header">
                <span><i class="fas fa-heartbeat"></i> 扩展监控</span>
                <button class="sys-monitor-close" id="sys-monitor-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="sys-monitor-body">
                <div class="sys-stat" id="sys-cpu-stat">
                    <div class="sys-stat-label"><i class="fas fa-microchip"></i> CPU</div>
                    <div class="sys-stat-bar"><div class="sys-stat-fill" id="sys-cpu-fill"></div></div>
                    <div class="sys-stat-value" id="sys-cpu-value">--</div>
                </div>
                <div class="sys-stat" id="sys-mem-stat">
                    <div class="sys-stat-label"><i class="fas fa-memory"></i> 内存</div>
                    <div class="sys-stat-bar"><div class="sys-stat-fill" id="sys-mem-fill"></div></div>
                    <div class="sys-stat-value" id="sys-mem-value">--</div>
                </div>
                <div class="sys-stat" id="sys-disk-stat">
                    <div class="sys-stat-label"><i class="fas fa-hdd"></i> 磁盘</div>
                    <div class="sys-stat-bar"><div class="sys-stat-fill" id="sys-disk-fill"></div></div>
                    <div class="sys-stat-value" id="sys-disk-value">--</div>
                </div>
                <div class="sys-stat" id="sys-ext-mem-stat">
                    <div class="sys-stat-label"><i class="fas fa-puzzle-piece"></i> 扩展</div>
                    <div class="sys-stat-bar"><div class="sys-stat-fill" id="sys-ext-mem-fill"></div></div>
                    <div class="sys-stat-value" id="sys-ext-mem-value">--</div>
                </div>
                <div class="sys-cpu-detail hidden" id="sys-cpu-detail">
                    <canvas id="sys-cpu-chart" width="280" height="80"></canvas>
                </div>
            </div>
            <div class="ext-timeline-section">
                <div class="ext-timeline-header">
                    <span class="ext-timeline-title">扩展活动</span>
                    <div class="ext-timeline-filters" id="ext-timeline-filters">
                        <button class="ext-filter-btn active" data-cat="all">全部</button>
                        <button class="ext-filter-btn" data-cat="music"><i class="fas fa-music"></i></button>
                        <button class="ext-filter-btn" data-cat="network"><i class="fas fa-globe"></i></button>
                        <button class="ext-filter-btn" data-cat="task"><i class="fas fa-tasks"></i></button>
                        <button class="ext-filter-btn" data-cat="alarm"><i class="fas fa-bell"></i></button>
                        <button class="ext-filter-btn" data-cat="storage"><i class="fas fa-database"></i></button>
                        <button class="ext-filter-btn" data-cat="system"><i class="fas fa-cog"></i></button>
                    </div>
                </div>
                <div class="ext-timeline-list" id="ext-timeline-list">
                    <div class="ext-timeline-empty">加载中...</div>
                </div>
                <div class="ext-timeline-footer">
                    <span class="ext-timeline-count" id="ext-timeline-count">0 条</span>
                    <button class="ext-timeline-clear" id="ext-timeline-clear" title="清空日志"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- v3.0.0: 诗词电台 + 温情提示（迷你播放器） -->
    <div class="poetry-radio" id="poetry-radio">
        <div class="pr-display">
            <span class="pr-icon" id="pr-icon">📜</span>
            <div class="pr-text-wrap">
                <span class="pr-text" id="pr-text"></span>
                <span class="pr-author" id="pr-author"></span>
            </div>
        </div>
        <div class="pr-controls">
            <button class="pr-btn" id="pr-prev" title="上一首"><i class="fas fa-step-backward"></i></button>
            <button class="pr-btn pr-btn-play" id="pr-play" title="播放/暂停"><i class="fas fa-play"></i></button>
            <button class="pr-btn" id="pr-next" title="下一首"><i class="fas fa-step-forward"></i></button>
            <button class="pr-btn pr-btn-fav" id="pr-fav" title="收藏"><i class="far fa-heart"></i></button>
            <select class="pr-speed" id="pr-speed" title="朗读速度">
                <option value="0.7">0.7x</option>
                <option value="0.85">0.85x</option>
                <option value="1" selected>1x</option>
                <option value="1.2">1.2x</option>
                <option value="1.5">1.5x</option>
            </select>
            <button class="pr-btn pr-btn-mode" id="pr-mode" title="切换模式"><i class="fas fa-random"></i></button>
        </div>
    </div>

    <!-- 底部信息 -->
    <div class="background-credit" id="background-credit">
        长城 - 慕田峪长城
    </div>
    <div class="keyboard-hint">按 Ctrl/⌘ + Shift + B 切换背景</div>
    
    <!-- 极简模式退出提示 -->
    <div class="zen-exit-hint" id="zen-exit-hint">按 Ctrl/⌘ + Shift + . 或双击退出极简模式</div>

    <!-- v3.3.0: 统一右下角工具栏 -->
    <div class="dock-bar" id="dock-bar">
        <button class="dock-btn" id="zen-mode-btn" title="极简模式">
            <i class="fas fa-eye-slash"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="sys-monitor-toggle" title="扩展监控">
            <i class="fas fa-heartbeat"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="kw-dock-btn" title="常用信息">
            <i class="fas fa-brain"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="bili-dock-btn" title="哔哩哔哩">
            <i class="fab fa-bilibili"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="schedule-dock-btn" title="计划管理">
            <i class="fas fa-calendar-check"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="worklog-dock-btn" title="工作日志">
            <i class="fas fa-clipboard-list"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="blog-dock-btn" title="写作空间">
            <i class="fas fa-pen-nib"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="agent-dock-btn" title="Agent 矩阵">
            <i class="fas fa-robot"></i>
            <span class="cb-dock-indicator disconnected"></span>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="settings-dock-btn" title="设置">
            <i class="fas fa-cog"></i>
        </button>
        <div class="dock-divider" aria-hidden="true"></div>
        <button class="dock-btn" id="memo-toggle-btn" title="任务面板">
            <i class="fas fa-tasks"></i>
        </button>
    </div>

    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/mermaid.tiny.min.js"></script>
    <link rel="stylesheet" href="vendor/highlight-theme.css">
    <script src="js/markdown-renderer.js"></script>
    <script src="js/chrome-shim.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/lunar-lib.js"></script>
    <script src="js/lunar.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/holidays.js"></script>
    <script src="js/tinyurl.js"></script>
    <script src="js/bookmark-srs.js"></script>
    <script src="js/bookmark-rag.js"></script>
    <script src="js/activity-logger.js"></script>
    <script src="js/memo.js"></script>
    <script src="js/knowledge-wall.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/adaptive-overlay.js"></script>
    <script src="js/music-controller.js"></script>
    <script src="js/bilibili-controller.js"></script>
    <script src="js/worklog.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/weekview.js"></script>
    <link rel="stylesheet" href="css/cursor-bridge.css">
    <link rel="stylesheet" href="css/whitebox-observability.css">
    <script src="js/cursor-bridge.js"></script>
    <script src="js/whitebox-observability.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
